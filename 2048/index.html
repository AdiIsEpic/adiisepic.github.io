
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1b1a18">
<title>2048</title>
<style>
  :root{
    --page:#1b1a18;
    --ink:#f6f1e8;
    --ink-dim:#a79d90;
    --board:#bbada0;
    --cell:#cdc1b4;
    --dark:#776e65;
    --gap:12px;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html,body{
    margin:0;
    min-height:100%;
    background:var(--page);
    color:var(--ink);
    font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    overscroll-behavior:none;
    -webkit-text-size-adjust:100%;
  }

  body{
    display:flex;
    justify-content:center;
    padding:max(18px, env(safe-area-inset-top)) 14px calc(18px + env(safe-area-inset-bottom));
  }

  .wrap{
    width:min(94vw, 480px, calc(100dvh - 220px));
    min-width:280px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  /* ---- header ---- */
  .top{ display:flex; align-items:center; justify-content:space-between; gap:12px; }

  h1{
    margin:0;
    font-size:clamp(40px, 11vw, 64px);
    font-weight:800;
    line-height:1;
    color:#edc22e;
    letter-spacing:-1px;
  }

  .scores{ display:flex; gap:8px; }

  .box{
    position:relative;
    min-width:74px;
    padding:6px 12px 7px;
    border-radius:8px;
    background:var(--board);
    text-align:center;
  }
  .box .lbl{
    font-size:11px;
    font-weight:800;
    letter-spacing:0.8px;
    text-transform:uppercase;
    color:#eee4da;
  }
  .box .num{ font-size:20px; font-weight:800; color:#fff; line-height:1.15; }

  /* "+8" that floats up off the score box */
  .plus{
    position:absolute;
    left:0; right:0; top:8px;
    font-size:18px;
    font-weight:800;
    color:#edc22e;
    pointer-events:none;
    animation:float .6s ease-out forwards;
  }

  .sub{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .sub p{ margin:0; color:var(--ink-dim); font-size:14px; line-height:1.4; }

  button{
    font:inherit;
    font-weight:800;
    font-size:14px;
    color:#f9f6f2;
    background:#8f7a66;
    border:none;
    border-radius:8px;
    padding:10px 16px;
    cursor:pointer;
    white-space:nowrap;
    transition:transform .12s ease, background .15s ease;
  }
  button:hover{ background:#9c8672; }
  button:active{ transform:translateY(1px) scale(0.98); }
  button:focus-visible{ outline:2px solid #edc22e; outline-offset:2px; }

  /* ---- board ---- */
  .board{
    position:relative;
    width:100%;
    aspect-ratio:1;
    padding:var(--gap);
    border-radius:10px;
    background:var(--board);
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    grid-template-rows:repeat(4, 1fr);
    gap:var(--gap);
    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
    container-type:inline-size;
  }

  .cell{ border-radius:6px; background:var(--cell); }

  .layer{ position:absolute; inset:0; }

  .tile{
    position:absolute;
    top:var(--gap);
    left:var(--gap);
    width:calc((100% - var(--gap) * 5) / 4);
    height:calc((100% - var(--gap) * 5) / 4);
    border-radius:6px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:800;
    font-size:11cqw;
    line-height:1;
    transition:transform .1s ease-in-out;
    will-change:transform;
  }

  /* inner face scales for pop/appear, so it doesn't fight the slide transform */
  .face{
    width:100%;
    height:100%;
    border-radius:inherit;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .tile.new .face{ animation:appear .16s ease .1s both; }
  .tile.merged{ z-index:2; }
  .tile.merged .face{ animation:pop .18s ease .1s both; }

  .tile[data-len="3"]{ font-size:9cqw; }
  .tile[data-len="4"]{ font-size:7.4cqw; }
  .tile[data-len="5"]{ font-size:6cqw; }

  .tile[data-v="2"]    .face{ background:#eee4da; color:var(--dark); }
  .tile[data-v="4"]    .face{ background:#ede0c8; color:var(--dark); }
  .tile[data-v="8"]    .face{ background:#f2b179; color:#f9f6f2; }
  .tile[data-v="16"]   .face{ background:#f59563; color:#f9f6f2; }
  .tile[data-v="32"]   .face{ background:#f67c5f; color:#f9f6f2; }
  .tile[data-v="64"]   .face{ background:#f65e3b; color:#f9f6f2; }
  .tile[data-v="128"]  .face{ background:#edcf72; color:#f9f6f2; box-shadow:0 0 18px rgba(243,215,116,0.35); }
  .tile[data-v="256"]  .face{ background:#edcc61; color:#f9f6f2; box-shadow:0 0 20px rgba(243,215,116,0.45); }
  .tile[data-v="512"]  .face{ background:#edc850; color:#f9f6f2; box-shadow:0 0 22px rgba(243,215,116,0.55); }
  .tile[data-v="1024"] .face{ background:#edc53f; color:#f9f6f2; box-shadow:0 0 24px rgba(243,215,116,0.65); }
  .tile[data-v="2048"] .face{ background:#edc22e; color:#f9f6f2; box-shadow:0 0 28px rgba(243,215,116,0.8); }
  .tile[data-v="super"] .face{ background:#3c3a32; color:#f9f6f2; }

  /* ---- win / lose overlay ---- */
  .overlay{
    position:absolute;
    inset:0;
    z-index:5;
    border-radius:10px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:14px;
    text-align:center;
    animation:fade .4s ease both;
  }
  .overlay[hidden]{ display:none; }
  .overlay.lose{ background:rgba(238,228,218,0.72); color:var(--dark); }
  .overlay.win{ background:rgba(237,194,46,0.6); color:#f9f6f2; }
  .overlay h2{ margin:0; font-size:clamp(30px, 9cqw, 48px); font-weight:800; }
  .overlay .row{ display:flex; gap:10px; }

  .hint{ margin:0; text-align:center; color:var(--ink-dim); font-size:12px; }

  @keyframes appear{ from{ transform:scale(0); opacity:0; } to{ transform:scale(1); opacity:1; } }
  @keyframes pop{ 0%{ transform:scale(1); } 50%{ transform:scale(1.18); } 100%{ transform:scale(1); } }
  @keyframes float{ from{ opacity:1; transform:translateY(0); } to{ opacity:0; transform:translateY(-34px); } }
  @keyframes fade{ from{ opacity:0; } to{ opacity:1; } }

  @media (max-width:420px){
    :root{ --gap:8px; }
    .box{ min-width:62px; padding:5px 9px 6px; }
    .box .num{ font-size:17px; }
    .sub p{ font-size:13px; }
  }

  @media (prefers-reduced-motion: reduce){
    .tile{ transition:none; }
    .tile .face, .plus, .overlay{ animation:none !important; }
  }
</style>
</head>
<body>

<div class="wrap">

  <div class="top">
    <h1>2048</h1>
    <div class="scores">
      <div class="box"><div class="lbl">Score</div><div class="num" id="score">0</div></div>
      <div class="box"><div class="lbl">Best</div><div class="num" id="best">0</div></div>
    </div>
  </div>

  <div class="sub">
    <p>Join the tiles, get to <b>2048</b>.</p>
    <button id="new">New game</button>
  </div>

  <div class="board" id="board">
    <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
    <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
    <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
    <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>

    <div class="layer" id="layer"></div>

    <div class="overlay win" id="win" hidden>
      <h2>You win!</h2>
      <div class="row">
        <button id="keep">Keep going</button>
        <button id="win-new">New game</button>
      </div>
    </div>

    <div class="overlay lose" id="lose" hidden>
      <h2>Game over</h2>
      <button id="retry">Try again</button>
    </div>
  </div>

  <p class="hint">Arrow keys or WASD &middot; swipe on touch &middot; your game is saved</p>

</div>

<script>
(function(){
  'use strict';

  var SIZE = 4;
  var SLIDE_MS = 100;

  var layer   = document.getElementById('layer');
  var board   = document.getElementById('board');
  var scoreEl = document.getElementById('score');
  var bestEl  = document.getElementById('best');
  var winEl   = document.getElementById('win');
  var loseEl  = document.getElementById('lose');

  var grid, score, best, won, keepGoing, over;
  var nextId = 1;
  var pending = null;     // finishing step of the last move (removals + spawn)

  // ---------- storage (throws in some private modes) ----------
  function load(key){ try { return localStorage.getItem(key); } catch(e){ return null; } }
  function save(key, v){ try { localStorage.setItem(key, v); } catch(e){} }
  function drop(key){ try { localStorage.removeItem(key); } catch(e){} }

  // ---------- tiles ----------
  function place(t){
    t.el.style.transform =
      'translate(calc(' + t.c + ' * (100% + var(--gap))), calc(' + t.r + ' * (100% + var(--gap))))';
  }

  function makeTile(v, r, c, kind){
    var t = { id: nextId++, v: v, r: r, c: c };
    t.el = document.createElement('div');
    t.el.className = 'tile' + (kind ? ' ' + kind : '');
    t.el.dataset.v = v > 2048 ? 'super' : String(v);
    t.el.dataset.len = String(Math.min(5, String(v).length));
    var face = document.createElement('div');
    face.className = 'face';
    face.textContent = v;
    t.el.appendChild(face);
    place(t);
    layer.appendChild(t.el);
    grid[r][c] = t;
    return t;
  }

  function emptyCells(){
    var out = [];
    for(var r = 0; r < SIZE; r++)
      for(var c = 0; c < SIZE; c++)
        if(!grid[r][c]) out.push([r, c]);
    return out;
  }

  function addRandom(){
    var free = emptyCells();
    if(!free.length) return;
    var spot = free[(Math.random() * free.length) | 0];
    makeTile(Math.random() < 0.9 ? 2 : 4, spot[0], spot[1], 'new');
  }

  function movesLeft(){
    for(var r = 0; r < SIZE; r++){
      for(var c = 0; c < SIZE; c++){
        var t = grid[r][c];
        if(!t) return true;
        if(c + 1 < SIZE && grid[r][c + 1] && grid[r][c + 1].v === t.v) return true;
        if(r + 1 < SIZE && grid[r + 1][c] && grid[r + 1][c].v === t.v) return true;
      }
    }
    return false;
  }

  // ---------- game ----------
  function blankGrid(){
    var g = [];
    for(var r = 0; r < SIZE; r++){ g.push([null, null, null, null]); }
    return g;
  }

  function newGame(){
    finish();
    layer.innerHTML = '';
    grid = blankGrid();
    score = 0; won = false; keepGoing = false; over = false;
    winEl.hidden = true; loseEl.hidden = true;
    addRandom(); addRandom();
    updateScore(0);
    saveGame();
  }

  function saveGame(){
    if(over){ drop('g2048.state'); return; }
    var cells = grid.map(function(row){ return row.map(function(t){ return t ? t.v : 0; }); });
    save('g2048.state', JSON.stringify({ cells: cells, score: score, won: won, keepGoing: keepGoing }));
  }

  function restore(){
    var s;
    try { s = JSON.parse(load('g2048.state')); } catch(e){ s = null; }
    if(!s || !Array.isArray(s.cells) || s.cells.length !== SIZE) return false;

    layer.innerHTML = '';
    grid = blankGrid();
    var any = false;
    for(var r = 0; r < SIZE; r++){
      for(var c = 0; c < SIZE; c++){
        var v = s.cells[r] && s.cells[r][c];
        if(typeof v === 'number' && v >= 2){ makeTile(v, r, c, 'new'); any = true; }
      }
    }
    if(!any) return false;
    score = +s.score || 0;
    won = !!s.won; keepGoing = !!s.keepGoing; over = false;
    // input is blocked while the win screen is up, so it has to come back with the board
    winEl.hidden = !(won && !keepGoing);
    loseEl.hidden = true;
    updateScore(0);
    return true;
  }

  function updateScore(gained){
    scoreEl.textContent = String(score);
    if(score > best){ best = score; save('g2048.best', String(best)); }
    bestEl.textContent = String(best);
    if(gained > 0){
      var p = document.createElement('div');
      p.className = 'plus';
      p.textContent = '+' + gained;
      scoreEl.parentNode.appendChild(p);
      setTimeout(function(){ p.remove(); }, 650);
    }
  }

  // run the tail end of the previous move right now, so fast input never gets dropped
  function finish(){
    if(!pending) return;
    clearTimeout(pending.timer);
    var run = pending.run;
    pending = null;
    run();
  }

  // dir: 0 up, 1 right, 2 down, 3 left
  function move(dir){
    finish();
    if(over || (won && !keepGoing)) return;

    var dr = [-1, 0, 1, 0][dir];
    var dc = [0, 1, 0, -1][dir];
    var rows = [0, 1, 2, 3], cols = [0, 1, 2, 3];
    // walk from the far edge so tiles pile up in the right order
    if(dr === 1) rows.reverse();
    if(dc === 1) cols.reverse();

    var moved = false, gained = 0;
    var doomed = [], merges = [];
    var mergedAt = {};

    rows.forEach(function(r){
      cols.forEach(function(c){
        var t = grid[r][c];
        if(!t) return;

        var nr = r, nc = c;
        while(true){
          var rr = nr + dr, cc = nc + dc;
          if(rr < 0 || rr >= SIZE || cc < 0 || cc >= SIZE) break;
          var other = grid[rr][cc];
          if(!other){ nr = rr; nc = cc; continue; }

          // each cell merges at most once per move: 2 2 2 2 -> 4 4, not 8
          if(other.v === t.v && !mergedAt[rr + ',' + cc]){
            mergedAt[rr + ',' + cc] = true;
            grid[r][c] = null;
            grid[rr][cc] = { v: t.v * 2, placeholder: true };
            t.r = rr; t.c = cc;
            place(t);
            doomed.push(t, other);
            merges.push({ v: t.v * 2, r: rr, c: cc });
            gained += t.v * 2;
            moved = true;
            return;
          }
          break;
        }

        if(nr !== r || nc !== c){
          grid[r][c] = null;
          grid[nr][nc] = t;
          t.r = nr; t.c = nc;
          place(t);
          moved = true;
        }
      });
    });

    if(!moved) return;

    score += gained;
    updateScore(gained);

    var run = function(){
      doomed.forEach(function(t){ t.el.remove(); });
      var hit2048 = false;
      merges.forEach(function(m){
        makeTile(m.v, m.r, m.c, 'merged');
        if(m.v === 2048) hit2048 = true;
      });
      addRandom();

      if(hit2048 && !won){
        won = true;
        setTimeout(function(){ winEl.hidden = false; }, 250);
      } else if(!movesLeft()){
        over = true;
        setTimeout(function(){ loseEl.hidden = false; }, 350);
      }
      saveGame();
    };

    pending = { run: run, timer: setTimeout(function(){ finish(); }, SLIDE_MS) };
  }

  // ---------- input ----------
  var KEYS = {
    ArrowUp: 0, ArrowRight: 1, ArrowDown: 2, ArrowLeft: 3,
    w: 0, d: 1, s: 2, a: 3, W: 0, D: 1, S: 2, A: 3
  };

  window.addEventListener('keydown', function(e){
    if(e.metaKey || e.ctrlKey || e.altKey) return;
    var d = KEYS[e.key];
    if(d === undefined) return;
    e.preventDefault();
    move(d);
  });

  // swipe (pointer events cover touch, pen and mouse-drag)
  var sx = 0, sy = 0, tracking = false;
  board.addEventListener('pointerdown', function(e){
    if(e.target.closest('button')) return;
    tracking = true; sx = e.clientX; sy = e.clientY;
  });
  window.addEventListener('pointerup', function(e){
    if(!tracking) return;
    tracking = false;
    var dx = e.clientX - sx, dy = e.clientY - sy;
    if(Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    if(Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 1 : 3);
    else move(dy > 0 ? 2 : 0);
  });
  window.addEventListener('pointercancel', function(){ tracking = false; });

  document.getElementById('new').addEventListener('click', newGame);
  document.getElementById('retry').addEventListener('click', newGame);
  document.getElementById('win-new').addEventListener('click', newGame);
  document.getElementById('keep').addEventListener('click', function(){
    keepGoing = true;
    winEl.hidden = true;
    saveGame();
  });

  // ---------- go ----------
  best = parseInt(load('g2048.best'), 10) || 0;
  if(!restore()) newGame();

})();
</script>

</body>
</html>
