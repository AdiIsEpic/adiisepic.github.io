<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1b1446">
<title>Brick Bounce</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Lilita+One&display=swap" rel="stylesheet">
<style>
  :root{ --font:'Fredoka', ui-rounded, 'Segoe UI', system-ui, sans-serif; --display:'Lilita One', 'Fredoka', system-ui, sans-serif; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; overflow:hidden; overscroll-behavior:none; background:linear-gradient(180deg, #2a1d6b, #140f35); color:#fff; font-family:var(--font); -webkit-user-select:none; user-select:none; }
  #c{ position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:none; }
  .hud{ position:fixed; top:0; left:0; right:0; z-index:5; display:flex; align-items:center; gap:8px; padding:10px; padding-top:max(10px, env(safe-area-inset-top)); pointer-events:none; }
  .hud > *{ pointer-events:auto; }
  .back{ padding:8px 12px; border-radius:12px; background:rgba(255,255,255,0.12); color:#fff; font-weight:600; font-size:15px; text-decoration:none; white-space:nowrap; }
  .stat{ text-align:center; line-height:1.05; min-width:54px; }
  .stat small{ display:block; font-size:10px; font-weight:700; letter-spacing:1.5px; opacity:0.65; text-transform:uppercase; }
  .stat b{ font:400 22px var(--display); }
  .spacer{ flex:1; }
  .lives{ font-size:18px; letter-spacing:2px; white-space:nowrap; }
  .round{ width:40px; height:40px; border:none; border-radius:50%; background:rgba(255,255,255,0.12); color:#fff; font-size:17px; cursor:pointer; flex:none; }
  .overlay{ position:fixed; inset:0; z-index:10; display:flex; align-items:center; justify-content:center; padding:16px; background:rgba(10,6,30,0.55); }
  .overlay[hidden]{ display:none; }
  .card{ width:min(100%, 360px); padding:24px 20px; border-radius:26px; text-align:center; background:linear-gradient(180deg, #3b2c8f, #241a63); box-shadow:0 20px 50px rgba(0,0,0,0.45); animation:pop .35s cubic-bezier(.2,.9,.3,1.3); }
  @keyframes pop{ from{ transform:scale(0.85); opacity:0; } }
  .card h1{ margin:0 0 8px; font:400 40px var(--display); color:#ffd23f; letter-spacing:1px; text-shadow:0 3px 0 rgba(0,0,0,0.3); }
  .card p{ margin:0 0 14px; font-size:16px; opacity:0.85; line-height:1.4; }
  .card .best{ color:#ffd23f; font-weight:600; opacity:1; }
  .btn{ font:400 22px var(--display); letter-spacing:1px; border:none; border-radius:18px; padding:13px 30px; color:#fff; cursor:pointer; background:linear-gradient(180deg, #ff6fb1, #e8457f); box-shadow:0 6px 0 #a82d5e; }
  .btn:active{ transform:translateY(4px); box-shadow:0 2px 0 #a82d5e; }
  .btn:focus-visible, .round:focus-visible, .back:focus-visible{ outline:3px solid #fff; outline-offset:2px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">
  <a class="back" href="../" aria-label="Back to games">&lsaquo; Games</a>
  <div class="stat"><small>Score</small><b id="score">0</b></div>
  <div class="stat"><small>Level</small><b id="level">1</b></div>
  <div class="spacer"></div>
  <div class="lives" id="lives" aria-label="Lives"></div>
  <button type="button" class="round" id="mute" aria-label="Sound on">🔊</button>
</div>
<div class="overlay" id="ov">
  <div class="card">
    <h1 id="ov-title">Brick Bounce</h1>
    <p id="ov-text">Smash every brick! Move with your mouse, finger or ← →. Tap or press Space to launch.</p>
    <p class="best" id="ov-best"></p>
    <button type="button" class="btn" id="ov-btn">▶ Play</button>
  </div>
</div>
<script>
(function(){
  'use strict';
  function clamp(v, a, b){ return v < a ? a : v > b ? b : v; }
  function $(id){ return document.getElementById(id); }
  function load(k, d){ try { var v = localStorage.getItem(k); return v === null ? d : v; } catch(e){ return d; } }
  function save(k, v){ try { localStorage.setItem(k, v); } catch(e){} }
  function mulberry(a){ return function(){ a = (a + 0x6D2B79F5) | 0; var t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

  // ---------- sound ----------
  var actx = null, muted = load('brick.muted', '0') === '1';
  function tone(f0, f1, dur, type, vol, delay){
    if(muted) return;
    try {
      if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if(actx.state === 'suspended') actx.resume();
      var t0 = actx.currentTime + (delay || 0), o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(actx.destination); o.start(t0); o.stop(t0 + dur + 0.05);
    } catch(e){}
  }
  var NOTES = [523, 587, 659, 784, 880, 1047, 1175, 1319];
  var sfx = {
    paddle: function(){ tone(300, 420, 0.07, 'square', 0.05); },
    wall: function(){ tone(220, 200, 0.04, 'square', 0.03); },
    brick: function(n){ var f = NOTES[n % NOTES.length]; tone(f, f, 0.08, 'triangle', 0.06); },
    tough: function(){ tone(160, 140, 0.06, 'square', 0.05); },
    power: function(){ [660, 880, 1100].forEach(function(f, i){ tone(f, f, 0.1, 'triangle', 0.06, i * 0.06); }); },
    lose: function(){ tone(400, 90, 0.5, 'sawtooth', 0.06); },
    clear: function(){ [523, 659, 784, 1047, 1319].forEach(function(f, i){ tone(f, f, 0.18, 'triangle', 0.07, i * 0.08); }); }
  };
  var muteBtn = $('mute');
  function renderMute(){ muteBtn.textContent = muted ? '🔈' : '🔊'; muteBtn.setAttribute('aria-label', muted ? 'Sound off' : 'Sound on'); }
  muteBtn.addEventListener('click', function(){ muted = !muted; save('brick.muted', muted ? '1' : '0'); renderMute(); muteBtn.blur(); });

  // ---------- the field is 480 x 700 units, scaled to fit the screen ----------
  var FWU = 480, FHU = 700, cv = $('c'), cx = cv.getContext('2d'), W = 0, H = 0, DPR = 1, S = 1, OX = 0, OY = 0;
  function layout(){
    W = window.innerWidth; H = window.innerHeight; DPR = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.max(1, Math.round(W * DPR)); cv.height = Math.max(1, Math.round(H * DPR));
    var top = 62;
    S = Math.max(0.2, Math.min((W - 12) / FWU, (H - top - 8) / FHU));
    OX = (W - FWU * S) / 2; OY = top + Math.max(0, (H - top - 8 - FHU * S) / 2);
  }
  window.addEventListener('resize', layout);

  var COLORS = [['#ff5d8f', '#d93a6c'], ['#ff9f43', '#e07a1c'], ['#ffd23f', '#d9aa00'], ['#6bd968', '#3fae45'], ['#3bc9db', '#1f98a8'], ['#5e8bff', '#3a62d6'], ['#b56dff', '#8a45d6'], ['#ff7eb6', '#d9558e'], ['#ffffff', '#c9c9d9']];
  var POWERS = { wide: { label: '↔', color: '#6bd968' }, multi: { label: '✦', color: '#ffd23f' }, slow: { label: '🐢', color: '#3bc9db' }, life: { label: '♥', color: '#ff5d8f' } };

  var state = 'menu', level = 1, score = 0, lives = 3, bricks = [], balls = [], drops = [], parts = [];
  var P = { x: 240, y: 650, w: 90, h: 14, wideT: 0, target: 240, vx: 0 }, slowT = 0, keys = {}, shake = 0;

  function makeLevel(n){
    var r = mulberry(n * 977 + 3), rows = Math.min(5 + Math.floor(n / 2), 9), pattern = (n - 1) % 5, out = [];
    for(var row = 0; row < rows; row++){
      for(var col = 0; col < 10; col++){
        var keep = true;
        if(pattern === 1) keep = (row + col) % 2 === 0;
        else if(pattern === 2) keep = Math.abs(col - 4.5) < rows - row;
        else if(pattern === 3) keep = Math.abs(col - 4.5) + Math.abs(row - (rows - 1) / 2) < 5.5;
        else if(pattern === 4) keep = r() > 0.25;
        if(!keep) continue;
        var hp = n >= 3 && r() < Math.min(0.08 + n * 0.03, 0.45) ? 2 : 1;
        out.push({ x: 2 + col * 48, y: 80 + row * 24, w: 44, h: 18, hp: hp, max: hp, c: COLORS[row % COLORS.length] });
      }
    }
    return out;
  }

  function speed(){ return Math.min(400 + level * 16, 620) * (slowT > 0 ? 0.7 : 1); }
  function newBall(){ return { x: P.x, y: P.y - 8, vx: 0, vy: 0, r: 7, stuck: true, trail: [] }; }

  function startGame(){ level = 1; score = 0; lives = 3; startLevel(); }
  function startLevel(){
    bricks = makeLevel(level); drops = []; parts = []; slowT = 0; P.wideT = 0;
    balls = [newBall()]; state = 'ready'; $('ov').hidden = true; hud();
  }
  function launch(){
    balls.forEach(function(b){ if(b.stuck){ var a = (Math.random() - 0.5) * 0.6; b.stuck = false; b.vx = Math.sin(a) * speed(); b.vy = -Math.cos(a) * speed(); } });
    state = 'play';
  }

  function hud(){
    $('score').textContent = score; $('level').textContent = level;
    $('lives').textContent = '♥'.repeat(Math.max(0, lives));
  }

  function burst(x, y, color, n){
    for(var i = 0; i < n; i++){ var a = Math.random() * Math.PI * 2, sp = 60 + Math.random() * 200; parts.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, t: 0.5 + Math.random() * 0.4, c: color, s: 2 + Math.random() * 4 }); }
  }

  function hitBrick(k, bi){
    k.hp--;
    if(k.hp > 0){ sfx.tough(); return; }
    bricks.splice(bi, 1);
    score += 10 * level; hud();
    sfx.brick(Math.floor(k.y / 24));
    burst(k.x + k.w / 2, k.y + k.h / 2, k.c[0], 10);
    if(Math.random() < 0.13){
      var kinds = ['wide', 'multi', 'slow', 'multi', 'wide', 'life'];
      drops.push({ x: k.x + k.w / 2, y: k.y + k.h / 2, kind: kinds[Math.floor(Math.random() * kinds.length)] });
    }
  }

  function stepBall(b, dt){
    b.x += b.vx * dt; b.y += b.vy * dt;
    if(b.x < b.r){ b.x = b.r; b.vx = Math.abs(b.vx); sfx.wall(); }
    if(b.x > FWU - b.r){ b.x = FWU - b.r; b.vx = -Math.abs(b.vx); sfx.wall(); }
    if(b.y < b.r){ b.y = b.r; b.vy = Math.abs(b.vy); sfx.wall(); }
    // paddle: where you hit it decides the angle
    if(b.vy > 0 && b.y + b.r >= P.y && b.y - b.r <= P.y + P.h && b.x >= P.x - P.w / 2 - b.r && b.x <= P.x + P.w / 2 + b.r){
      var hit = clamp((b.x - P.x) / (P.w / 2), -1, 1), a = hit * 1.05, sp = speed();
      b.vx = Math.sin(a) * sp; b.vy = -Math.cos(a) * sp; b.y = P.y - b.r; sfx.paddle();
    }
    for(var i = 0; i < bricks.length; i++){
      var k = bricks[i], nx = clamp(b.x, k.x, k.x + k.w), ny = clamp(b.y, k.y, k.y + k.h), dx = b.x - nx, dy = b.y - ny;
      if(dx * dx + dy * dy > b.r * b.r) continue;
      // bounce off the side we came in from
      var ox = (b.x - (k.x + k.w / 2)) / (k.w / 2), oy = (b.y - (k.y + k.h / 2)) / (k.h / 2);
      if(Math.abs(ox) > Math.abs(oy)){ b.vx = ox > 0 ? Math.abs(b.vx) : -Math.abs(b.vx); b.x = ox > 0 ? k.x + k.w + b.r : k.x - b.r; }
      else { b.vy = oy > 0 ? Math.abs(b.vy) : -Math.abs(b.vy); b.y = oy > 0 ? k.y + k.h + b.r : k.y - b.r; }
      hitBrick(k, i);
      break;
    }
    // keep the speed steady and never let it go perfectly flat
    var s0 = Math.hypot(b.vx, b.vy) || 1, want = speed();
    if(Math.abs(b.vy) < want * 0.25){ b.vy = (b.vy < 0 ? -1 : 1) * want * 0.25; }
    s0 = Math.hypot(b.vx, b.vy); b.vx *= want / s0; b.vy *= want / s0;
  }

  function update(dt){
    // paddle
    if(keys.left) P.target -= 520 * dt;
    if(keys.right) P.target += 520 * dt;
    P.w = P.wideT > 0 ? 140 : 90;
    P.target = clamp(P.target, P.w / 2, FWU - P.w / 2);
    P.x += (P.target - P.x) * Math.min(1, dt * 20);
    if(P.wideT > 0) P.wideT -= dt;
    if(slowT > 0) slowT -= dt;
    if(state !== 'play' && state !== 'ready') return;
    balls.forEach(function(b){
      if(b.stuck){ b.x = P.x; b.y = P.y - b.r - 1; return; }
      for(var s = 0; s < 4; s++) stepBall(b, dt / 4);
      b.trail.push([b.x, b.y]); if(b.trail.length > 8) b.trail.shift();
    });
    // lost balls
    var before = balls.length;
    balls = balls.filter(function(b){ return b.y < FHU + 20; });
    if(before && !balls.length){
      lives--; hud(); sfx.lose(); shake = 10;
      if(lives <= 0){ gameOver(); return; }
      balls = [newBall()]; state = 'ready'; P.wideT = 0; slowT = 0;
    }
    // power-ups
    drops.forEach(function(d){
      d.y += 150 * dt;
      if(d.y > P.y - 8 && d.y < P.y + P.h + 8 && Math.abs(d.x - P.x) < P.w / 2 + 10){
        d.got = true; sfx.power(); burst(d.x, d.y, POWERS[d.kind].color, 12);
        if(d.kind === 'wide') P.wideT = 12;
        else if(d.kind === 'slow') slowT = 8;
        else if(d.kind === 'life'){ lives = Math.min(5, lives + 1); hud(); }
        else if(d.kind === 'multi'){
          var add = [];
          balls.forEach(function(b){
            if(b.stuck || balls.length + add.length >= 8) return;
            [-0.4, 0.4].forEach(function(t){ var c = Math.cos(t), s = Math.sin(t); add.push({ x: b.x, y: b.y, vx: b.vx * c - b.vy * s, vy: b.vx * s + b.vy * c, r: 7, stuck: false, trail: [] }); });
          });
          balls = balls.concat(add);
        }
      }
    });
    drops = drops.filter(function(d){ return !d.got && d.y < FHU + 20; });
    if(!bricks.length) levelClear();
  }

  function levelClear(){
    state = 'clear'; sfx.clear(); score += lives * 50; hud();
    showCard('Level ' + level + ' cleared! 🎉', 'Bonus +' + (lives * 50) + ' for your lives. Ready for level ' + (level + 1) + '?', '', 'Next level ›');
  }
  function gameOver(){
    state = 'over';
    var best = +load('brick.best', '0') || 0, isBest = score > best;
    if(isBest) save('brick.best', String(score));
    showCard('Game over', 'You scored ' + score + ' and reached level ' + level + '.', isBest ? '★ New best score! ★' : 'Best: ' + best, '↻ Play again');
  }
  function showCard(title, text, best, btn){
    $('ov-title').textContent = title; $('ov-text').textContent = text; $('ov-best').textContent = best; $('ov-btn').textContent = btn;
    $('ov').hidden = false; $('ov-btn').focus();
  }
  $('ov-btn').addEventListener('click', function(){
    if(state === 'clear'){ level++; startLevel(); } else startGame();
  });

  // ---------- input ----------
  function toField(px){ return (px - OX) / S; }
  cv.addEventListener('pointermove', function(e){ P.target = toField(e.clientX); });
  cv.addEventListener('pointerdown', function(e){ P.target = toField(e.clientX); if(state === 'ready') launch(); });
  window.addEventListener('keydown', function(e){
    var k = e.key;
    if(k === 'ArrowLeft' || k === 'a' || k === 'A'){ keys.left = true; e.preventDefault(); }
    if(k === 'ArrowRight' || k === 'd' || k === 'D'){ keys.right = true; e.preventDefault(); }
    if(k === ' '){ e.preventDefault(); if(state === 'ready') launch(); else if(!$('ov').hidden) $('ov-btn').click(); }
  });
  window.addEventListener('keyup', function(e){
    if(e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
    if(e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
  });

  // ---------- drawing ----------
  function rr(x, y, w, h, r){ cx.beginPath(); cx.moveTo(x + r, y); cx.arcTo(x + w, y, x + w, y + h, r); cx.arcTo(x + w, y + h, x, y + h, r); cx.arcTo(x, y + h, x, y, r); cx.arcTo(x, y, x + w, y, r); cx.closePath(); }
  function render(dt){
    cx.setTransform(DPR, 0, 0, DPR, 0, 0);
    cx.clearRect(0, 0, W, H);
    var sx = shake ? (Math.random() - 0.5) * shake : 0; shake = shake > 0.3 ? shake * 0.88 : 0;
    cx.setTransform(DPR * S, 0, 0, DPR * S, DPR * (OX + sx), DPR * OY);
    rr(0, 0, FWU, FHU, 16); cx.fillStyle = 'rgba(8,5,30,0.55)'; cx.fill();
    cx.strokeStyle = 'rgba(255,255,255,0.08)'; cx.lineWidth = 2; cx.stroke();
    bricks.forEach(function(k){
      var g = cx.createLinearGradient(0, k.y, 0, k.y + k.h);
      g.addColorStop(0, k.c[0]); g.addColorStop(1, k.c[1]);
      rr(k.x, k.y, k.w, k.h, 5); cx.fillStyle = g; cx.fill();
      cx.fillStyle = 'rgba(255,255,255,0.35)'; cx.fillRect(k.x + 4, k.y + 3, k.w - 8, 3);
      if(k.max > 1){
        cx.strokeStyle = 'rgba(40,20,60,0.6)'; cx.lineWidth = 2; rr(k.x + 1, k.y + 1, k.w - 2, k.h - 2, 4); cx.stroke();
        if(k.hp < k.max){ cx.beginPath(); cx.moveTo(k.x + 10, k.y + 2); cx.lineTo(k.x + 18, k.y + 10); cx.lineTo(k.x + 14, k.y + 16); cx.moveTo(k.x + 30, k.y + 3); cx.lineTo(k.x + 26, k.y + 12); cx.stroke(); }
      }
    });
    drops.forEach(function(d){
      var p = POWERS[d.kind];
      rr(d.x - 16, d.y - 9, 32, 18, 9); cx.fillStyle = p.color; cx.fill();
      cx.fillStyle = '#1b1446'; cx.font = '700 13px Fredoka, sans-serif'; cx.textAlign = 'center'; cx.textBaseline = 'middle'; cx.fillText(p.label, d.x, d.y + 1);
    });
    // paddle
    var pg = cx.createLinearGradient(0, P.y, 0, P.y + P.h);
    pg.addColorStop(0, P.wideT > 0 ? '#9dff8a' : '#ffffff'); pg.addColorStop(1, P.wideT > 0 ? '#3fae45' : '#9aa6ff');
    cx.shadowColor = '#8fb0ff'; cx.shadowBlur = 16;
    rr(P.x - P.w / 2, P.y, P.w, P.h, 7); cx.fillStyle = pg; cx.fill();
    cx.shadowBlur = 0;
    balls.forEach(function(b){
      b.trail.forEach(function(t, i){ cx.globalAlpha = (i + 1) / b.trail.length * 0.35; cx.fillStyle = slowT > 0 ? '#3bc9db' : '#ffd23f'; cx.beginPath(); cx.arc(t[0], t[1], b.r * (i + 1) / b.trail.length, 0, Math.PI * 2); cx.fill(); });
      cx.globalAlpha = 1; cx.fillStyle = '#ffffff'; cx.beginPath(); cx.arc(b.x, b.y, b.r, 0, Math.PI * 2); cx.fill();
    });
    parts.forEach(function(p){ p.t -= dt; p.vy += 500 * dt; p.x += p.vx * dt; p.y += p.vy * dt; cx.globalAlpha = clamp(p.t / 0.3, 0, 1); cx.fillStyle = p.c; cx.fillRect(p.x - p.s / 2, p.y - p.s / 2, p.s, p.s); });
    cx.globalAlpha = 1; parts = parts.filter(function(p){ return p.t > 0; });
    if(state === 'ready'){ cx.fillStyle = 'rgba(255,255,255,0.8)'; cx.font = '600 18px Fredoka, sans-serif'; cx.textAlign = 'center'; cx.fillText('Tap or press Space to launch!', FWU / 2, P.y - 60); }
  }

  var last = 0;
  function frame(now){ requestAnimationFrame(frame); var dt = last ? Math.min(0.033, (now - last) / 1000) : 0.016; last = now; if(W > 0 && H > 0){ update(dt); render(dt); } }
  renderMute(); layout(); bricks = makeLevel(1); hud();
  var best0 = +load('brick.best', '0') || 0; $('ov-best').textContent = best0 ? 'Best: ' + best0 : '';
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
