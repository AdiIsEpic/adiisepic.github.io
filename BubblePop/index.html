<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#2a2466">
<title>Bubble Pop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Lilita+One&display=swap" rel="stylesheet">
<style>
  :root{ --font:'Fredoka', ui-rounded, 'Segoe UI', system-ui, sans-serif; --display:'Lilita One', 'Fredoka', system-ui, sans-serif; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; overflow:hidden; overscroll-behavior:none; background:#2a2466; color:#fff; font-family:var(--font); -webkit-user-select:none; user-select:none; }
  #c{ position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:crosshair; }
  .hud{ position:fixed; top:0; left:0; right:0; z-index:5; display:flex; align-items:center; gap:8px; padding:10px; padding-top:max(10px, env(safe-area-inset-top)); pointer-events:none; }
  .hud > *{ pointer-events:auto; }
  .back{ padding:8px 12px; border-radius:12px; background:rgba(255,255,255,0.12); color:#fff; font-weight:600; font-size:15px; text-decoration:none; white-space:nowrap; }
  .stat{ padding:4px 12px; border-radius:14px; background:rgba(255,255,255,0.12); text-align:center; line-height:1.05; min-width:64px; }
  .stat small{ display:block; font-size:10px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; opacity:0.75; }
  .stat b{ font:400 22px var(--display); }
  .spacer{ flex:1; }
  .round{ width:40px; height:40px; border:none; border-radius:50%; background:rgba(255,255,255,0.12); color:#fff; font-size:17px; cursor:pointer; flex:none; }
  .overlay{ position:fixed; inset:0; z-index:10; display:flex; align-items:center; justify-content:center; padding:16px; background:rgba(15,10,45,0.55); }
  .overlay[hidden]{ display:none; }
  .card{ width:min(100%, 350px); padding:24px 20px; border-radius:26px; text-align:center; background:#fff; color:#2a2466; box-shadow:0 20px 50px rgba(0,0,0,0.45); animation:pop .35s cubic-bezier(.2,.9,.3,1.3); }
  @keyframes pop{ from{ transform:scale(0.85); opacity:0; } }
  .card h1{ margin:0 0 8px; font:400 42px var(--display); color:#7a4dff; }
  .card p{ margin:0 0 14px; font-size:16px; line-height:1.4; opacity:0.85; }
  .card .big{ font:400 56px/1 var(--display); color:#ff4d8d; margin:0 0 8px; }
  .card .best{ color:#c98f00; font-weight:700; opacity:1; }
  .btn{ font:400 22px var(--display); border:none; border-radius:18px; padding:13px 32px; color:#fff; cursor:pointer; background:linear-gradient(180deg, #9a78ff, #7a4dff); box-shadow:0 6px 0 #5530c9; }
  .btn:active{ transform:translateY(4px); box-shadow:0 2px 0 #5530c9; }
  .btn:focus-visible, .round:focus-visible, .back:focus-visible{ outline:3px solid #fff; outline-offset:2px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">
  <a class="back" href="../" aria-label="Back to games">&lsaquo; Games</a>
  <div class="spacer"></div>
  <div class="stat"><small>Score</small><b id="score">0</b></div>
  <div class="stat"><small>Level</small><b id="level">1</b></div>
  <div class="spacer"></div>
  <button type="button" class="round" id="mute" aria-label="Sound on">🔊</button>
</div>
<div class="overlay" id="ov">
  <div class="card">
    <h1 id="ov-title">Bubble Pop</h1>
    <div class="big" id="ov-score" hidden>0</div>
    <p id="ov-text">Aim and let go to shoot. Match 3 or more of the same colour to pop them! Tap the bubble at the bottom to swap. Clear the board to level up.</p>
    <p class="best" id="ov-best"></p>
    <button type="button" class="btn" id="ov-btn">🫧 Play</button>
  </div>
</div>
<script>
(function(){
  'use strict';
  function $(id){ return document.getElementById(id); }
  function load(k, d){ try { var v = localStorage.getItem(k); return v === null ? d : v; } catch(e){ return d; } }
  function save(k, v){ try { localStorage.setItem(k, v); } catch(e){} }

  var actx = null, muted = load('bubble.muted', '0') === '1';
  function tone(f0, f1, dur, type, vol, delay){
    if(muted) return;
    try {
      if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if(actx.state === 'suspended') actx.resume();
      var t0 = actx.currentTime + (delay || 0), o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(actx.destination); o.start(t0); o.stop(t0 + dur + 0.05);
    } catch(e){}
  }
  var muteBtn = $('mute');
  function renderMute(){ muteBtn.textContent = muted ? '🔈' : '🔊'; muteBtn.setAttribute('aria-label', muted ? 'Sound off' : 'Sound on'); }
  muteBtn.addEventListener('click', function(){ muted = !muted; save('bubble.muted', muted ? '1' : '0'); renderMute(); muteBtn.blur(); });
  renderMute();

  var COLORS = [['#ff5a6e', '#ffc2ca'], ['#ffd23f', '#fff3b8'], ['#3ddc84', '#bff7d6'], ['#3d9bff', '#bfe0ff'], ['#b56dff', '#ead3ff'], ['#ff9a3d', '#ffd9b3']];
  var C = 11, R = 20, LW = C * 2 * R, LH = 760, RH = R * Math.sqrt(3), SHOOT_Y = LH - 56, DEATH_Y = LH - 118, SPEED = 1500;
  var cv = $('c'), cx = cv.getContext('2d'), W = 0, H = 0, DPR = 1, sc = 1, ox = 0, oy = 0;
  var grid = [], par = 0, ncol = 4, level = 1, score = 0, best = +load('bubble.best', '0') || 0, shots = 0, misses = 0;
  var cur = 0, nxt = 0, shot = null, aim = null, aiming = false, state = 'menu', pops = [], falls = [], texts = [], overT = 0, clock = 0;
  var ov = $('ov'), scoreEl = $('score'), levelEl = $('level');

  function layout(){
    W = window.innerWidth; H = window.innerHeight; DPR = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.max(1, Math.round(W * DPR)); cv.height = Math.max(1, Math.round(H * DPR));
    sc = Math.max(0.3, Math.min((W - 12) / LW, (H - 66) / LH)); ox = (W - LW * sc) / 2; oy = 60 + (H - 66 - LH * sc) / 2;
  }
  window.addEventListener('resize', layout);
  layout();

  function shifted(r){ return ((r + par) & 1) === 1; }
  function cols(r){ return shifted(r) ? C - 1 : C; }
  function pos(r, c){ return [R + 2 * R * c + (shifted(r) ? R : 0), R + r * RH]; }
  function get(r, c){ return r >= 0 && r < grid.length && c >= 0 && c < cols(r) ? grid[r][c] : -1; }
  function neighbours(r, c){
    var s = shifted(r), out = [[r, c - 1], [r, c + 1]];
    if(s){ out.push([r - 1, c], [r - 1, c + 1], [r + 1, c], [r + 1, c + 1]); }
    else { out.push([r - 1, c - 1], [r - 1, c], [r + 1, c - 1], [r + 1, c]); }
    return out.filter(function(p){ return p[0] >= 0 && p[1] >= 0 && p[1] < cols(p[0]); });
  }
  function makeRow(r){ var row = []; for(var c = 0; c < C; c++) row.push(c < cols(r) ? Math.floor(Math.random() * ncol) : -1); return row; }
  function present(){
    var seen = {}, list = [];
    for(var r = 0; r < grid.length; r++) for(var c = 0; c < cols(r); c++){ var v = grid[r][c]; if(v >= 0 && !seen[v]){ seen[v] = 1; list.push(v); } }
    return list;
  }
  function randColor(){ var p = present(); if(!p.length) return Math.floor(Math.random() * ncol); return p[Math.floor(Math.random() * p.length)]; }
  function setupLevel(){
    ncol = Math.min(6, 3 + Math.min(3, Math.ceil(level / 2)));
    grid = []; par = 0;
    var rows = Math.min(9, 4 + level);
    for(var r = 0; r < rows; r++) grid.push(makeRow(r));
    misses = 0; cur = randColor(); nxt = randColor();
    levelEl.textContent = String(level);
  }
  function startGame(){
    level = 1; score = 0; shots = 0; pops = []; falls = []; texts = []; shot = null;
    scoreEl.textContent = '0'; setupLevel(); state = 'play'; ov.hidden = true;
  }
  function missLimit(){ return Math.max(3, 6 - Math.floor(level / 2)); }

  function angleFrom(px, py){
    var a = Math.atan2(py - SHOOT_Y, px - LW / 2), lo = -Math.PI + 0.16, hi = -0.16;
    if(a > 0) a = px < LW / 2 ? lo : hi;
    return Math.max(lo, Math.min(hi, a));
  }
  function collides(x, y){
    if(y <= R) return true;
    var r0 = Math.max(0, Math.floor((y - R) / RH) - 1), r1 = Math.min(grid.length - 1, r0 + 3);
    for(var r = r0; r <= r1; r++) for(var c = 0; c < cols(r); c++){
      if(grid[r][c] < 0) continue;
      var p = pos(r, c), dx = p[0] - x, dy = p[1] - y;
      if(dx * dx + dy * dy < (2 * R * 0.86) * (2 * R * 0.86)) return true;
    }
    return false;
  }
  function fire(){
    if(state !== 'play' || shot || !aim) return;
    shot = { x: LW / 2, y: SHOOT_Y, vx: Math.cos(aim) * SPEED, vy: Math.sin(aim) * SPEED, c: cur };
    cur = nxt; nxt = randColor(); shots++;
    tone(500, 800, 0.08, 'sine', 0.05);
  }
  function snap(s){
    var best2 = null, bd = Infinity, rMax = Math.min(grid.length, Math.floor((s.y - R) / RH) + 2);
    for(var r = Math.max(0, rMax - 3); r <= rMax; r++){
      for(var c = 0; c < C; c++){
        if(r < grid.length ? (c >= cols(r) || grid[r][c] >= 0) : c >= cols(r)) continue;
        var attached = r === 0 || neighbours(r, c).some(function(p){ return get(p[0], p[1]) >= 0; });
        if(!attached) continue;
        var p = pos(r, c), d = (p[0] - s.x) * (p[0] - s.x) + (p[1] - s.y) * (p[1] - s.y);
        if(d < bd){ bd = d; best2 = [r, c]; }
      }
    }
    if(!best2){ best2 = [0, Math.max(0, Math.min(cols(0) - 1, Math.round((s.x - R - (shifted(0) ? R : 0)) / (2 * R))))]; }
    while(grid.length <= best2[0]) grid.push(makeEmpty(grid.length));
    grid[best2[0]][best2[1]] = s.c;
    resolve(best2[0], best2[1]);
  }
  function makeEmpty(){ return new Array(C).fill(-1); }
  function cluster(r, c, match){
    var col = grid[r][c], seen = {}, out = [], q = [[r, c]];
    seen[r + ',' + c] = 1;
    while(q.length){
      var p = q.pop(); out.push(p);
      neighbours(p[0], p[1]).forEach(function(n2){
        var k = n2[0] + ',' + n2[1], v = get(n2[0], n2[1]);
        if(seen[k] || v < 0 || (match && v !== col)) return;
        seen[k] = 1; q.push(n2);
      });
    }
    return out;
  }
  function resolve(r, c){
    var grp = cluster(r, c, true), popped = 0;
    if(grp.length >= 3){
      grp.forEach(function(p, i){ var xy = pos(p[0], p[1]); pops.push({ x: xy[0], y: xy[1], c: grid[p[0]][p[1]], t: -i * 0.03 }); grid[p[0]][p[1]] = -1; });
      popped = grp.length;
      // drop anything no longer connected to the ceiling
      var keep = {};
      for(var c0 = 0; c0 < cols(0); c0++) if(grid.length && grid[0][c0] >= 0 && !keep['0,' + c0]) cluster(0, c0, false).forEach(function(p){ keep[p[0] + ',' + p[1]] = 1; });
      var dropped = 0;
      for(var rr = 0; rr < grid.length; rr++) for(var cc = 0; cc < cols(rr); cc++){
        if(grid[rr][cc] >= 0 && !keep[rr + ',' + cc]){ var xy2 = pos(rr, cc); falls.push({ x: xy2[0], y: xy2[1], vx: (Math.random() - 0.5) * 120, vy: -Math.random() * 120, c: grid[rr][cc] }); grid[rr][cc] = -1; dropped++; }
      }
      var gain = popped * 10 + dropped * 20;
      score += gain; scoreEl.textContent = String(score);
      var mid = pos(r, c);
      texts.push({ x: mid[0], y: mid[1], s: '+' + gain + (dropped ? '!' : ''), t: 0 });
      tone(700, 1200, 0.1, 'triangle', 0.06); if(dropped) tone(900, 1600, 0.15, 'triangle', 0.05, 0.08);
      misses = 0;
    } else {
      misses++;
      tone(300, 250, 0.06, 'sine', 0.04);
    }
    while(grid.length && grid[grid.length - 1].every(function(v){ return v < 0; })) grid.pop();
    if(!grid.length){
      score += 500; scoreEl.textContent = String(score);
      texts.push({ x: LW / 2, y: LH / 2, s: 'Board clear! +500', t: 0, big: true });
      [523, 659, 784, 1047].forEach(function(f, k){ tone(f, f, 0.18, 'triangle', 0.06, k * 0.09); });
      level++; setupLevel(); return;
    }
    if(misses >= missLimit()){ addRow(); misses = 0; }
    if(!present().some(function(v){ return v === cur; })) cur = randColor();
    if(!present().some(function(v){ return v === nxt; })) nxt = randColor();
    checkOver();
  }
  function addRow(){
    par ^= 1;
    grid.unshift(makeRow(0));
    tone(200, 140, 0.2, 'square', 0.05);
  }
  function checkOver(){
    for(var r = 0; r < grid.length; r++) for(var c = 0; c < cols(r); c++) if(grid[r][c] >= 0 && pos(r, c)[1] + R > DEATH_Y){ gameOver(); return; }
  }
  function gameOver(){
    state = 'over'; overT = 0;
    tone(300, 80, 0.6, 'sawtooth', 0.08);
    if(score > best){ best = score; save('bubble.best', String(best)); }
  }
  function showOver(){
    $('ov-title').textContent = score >= 3000 ? 'Bubble boss!' : score >= 1000 ? 'Great popping!' : 'Game over';
    $('ov-score').hidden = false; $('ov-score').textContent = String(score);
    $('ov-text').textContent = 'You reached level ' + level + '.';
    $('ov-best').textContent = (score === best && score > 0 ? 'New best! ' : 'Best: ') + best;
    $('ov-btn').textContent = 'Play again';
    ov.hidden = false;
  }

  function step(dt){
    clock += dt;
    var i;
    for(i = pops.length - 1; i >= 0; i--){ pops[i].t += dt; if(pops[i].t > 0.25) pops.splice(i, 1); }
    for(i = falls.length - 1; i >= 0; i--){ var f = falls[i]; f.vy += 1600 * dt; f.x += f.vx * dt; f.y += f.vy * dt; if(f.y > LH + 60) falls.splice(i, 1); }
    for(i = texts.length - 1; i >= 0; i--){ texts[i].t += dt; texts[i].y -= 30 * dt; if(texts[i].t > 1.1) texts.splice(i, 1); }
    if(state === 'over'){ overT += dt; if(overT > 0.8 && ov.hidden) showOver(); return; }
    if(state !== 'play' || !shot) return;
    var dist = Math.hypot(shot.vx, shot.vy) * dt, steps = Math.ceil(dist / 5);
    for(var k = 0; k < steps; k++){
      shot.x += shot.vx * dt / steps; shot.y += shot.vy * dt / steps;
      if(shot.x < R){ shot.x = 2 * R - shot.x; shot.vx = Math.abs(shot.vx); tone(800, 700, 0.03, 'sine', 0.02); }
      if(shot.x > LW - R){ shot.x = 2 * (LW - R) - shot.x; shot.vx = -Math.abs(shot.vx); tone(800, 700, 0.03, 'sine', 0.02); }
      if(collides(shot.x, shot.y)){ var s = shot; shot = null; snap(s); return; }
    }
  }

  function bubble(x, y, c, r){
    var col = COLORS[c], g = cx.createRadialGradient(x - r * 0.35, y - r * 0.4, r * 0.1, x, y, r);
    g.addColorStop(0, col[1]); g.addColorStop(0.45, col[0]); g.addColorStop(1, col[0]);
    cx.fillStyle = g; cx.beginPath(); cx.arc(x, y, r, 0, Math.PI * 2); cx.fill();
    cx.strokeStyle = 'rgba(0,0,0,0.15)'; cx.lineWidth = 1.5; cx.stroke();
    cx.fillStyle = 'rgba(255,255,255,0.7)'; cx.beginPath(); cx.ellipse(x - r * 0.35, y - r * 0.42, r * 0.22, r * 0.14, -0.6, 0, Math.PI * 2); cx.fill();
  }
  function aimPath(){
    var x = LW / 2, y = SHOOT_Y, vx = Math.cos(aim), vy = Math.sin(aim), pts = [];
    for(var d = 0; d < 1400; d += 5){
      x += vx * 5; y += vy * 5;
      if(x < R){ x = 2 * R - x; vx = Math.abs(vx); }
      if(x > LW - R){ x = 2 * (LW - R) - x; vx = -Math.abs(vx); }
      if(d % 25 === 0) pts.push([x, y]);
      if(collides(x, y)) break;
    }
    return pts;
  }
  function render(){
    if(!W || !H) return;
    cx.setTransform(DPR, 0, 0, DPR, 0, 0);
    var g = cx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#3b2f8f'); g.addColorStop(1, '#1d1a4d');
    cx.fillStyle = g; cx.fillRect(0, 0, W, H);
    cx.setTransform(DPR * sc, 0, 0, DPR * sc, DPR * ox, DPR * oy);
    cx.fillStyle = 'rgba(255,255,255,0.06)'; cx.beginPath(); cx.roundRect ? cx.roundRect(0, 0, LW, LH, 18) : cx.rect(0, 0, LW, LH); cx.fill();
    cx.strokeStyle = 'rgba(255,90,110,0.45)'; cx.setLineDash([8, 8]); cx.lineWidth = 2;
    cx.beginPath(); cx.moveTo(0, DEATH_Y); cx.lineTo(LW, DEATH_Y); cx.stroke(); cx.setLineDash([]);
    var r, c, i;
    for(r = 0; r < grid.length; r++) for(c = 0; c < cols(r); c++) if(grid[r][c] >= 0){ var p = pos(r, c); bubble(p[0], p[1], grid[r][c], R - 1); }
    for(i = 0; i < pops.length; i++){ var pp = pops[i]; if(pp.t < 0){ bubble(pp.x, pp.y, pp.c, R - 1); continue; } var k = pp.t / 0.25; cx.globalAlpha = 1 - k; bubble(pp.x, pp.y, pp.c, (R - 1) * (1 + k * 0.6)); cx.globalAlpha = 1; }
    for(i = 0; i < falls.length; i++) bubble(falls[i].x, falls[i].y, falls[i].c, R - 1);
    if(state === 'play' && aim !== null && !shot){
      var pts = aimPath();
      cx.fillStyle = COLORS[cur][0];
      for(i = 0; i < pts.length; i++){ cx.globalAlpha = 1 - i / pts.length * 0.7; cx.beginPath(); cx.arc(pts[i][0], pts[i][1], 3.2, 0, Math.PI * 2); cx.fill(); }
      cx.globalAlpha = 1;
    }
    // shooter
    cx.fillStyle = 'rgba(255,255,255,0.12)'; cx.beginPath(); cx.arc(LW / 2, SHOOT_Y, R + 10, 0, Math.PI * 2); cx.fill();
    if(state === 'play' || state === 'over'){
      if(shot) bubble(shot.x, shot.y, shot.c, R - 1);
      bubble(LW / 2, SHOOT_Y, cur, R - 1);
      bubble(LW / 2 + 62, SHOOT_Y + 14, nxt, R * 0.7);
      cx.fillStyle = 'rgba(255,255,255,0.6)'; cx.font = '600 11px Fredoka, sans-serif'; cx.textAlign = 'center'; cx.fillText('NEXT', LW / 2 + 62, SHOOT_Y + 40);
      var left = missLimit() - misses;
      for(i = 0; i < missLimit(); i++){ cx.fillStyle = i < left ? '#ffd23f' : 'rgba(255,255,255,0.2)'; cx.beginPath(); cx.arc(24 + i * 14, SHOOT_Y + 14, 4.5, 0, Math.PI * 2); cx.fill(); }
    }
    cx.textAlign = 'center'; cx.textBaseline = 'middle';
    for(i = 0; i < texts.length; i++){
      var t = texts[i]; cx.globalAlpha = Math.max(0, 1 - t.t / 1.1);
      cx.font = t.big ? '400 34px "Lilita One", sans-serif' : '400 24px "Lilita One", sans-serif';
      cx.fillStyle = '#fff'; cx.fillText(t.s, t.x, t.y);
    }
    cx.globalAlpha = 1;
  }

  var last = 0;
  function frame(ts){
    var dt = Math.min(0.033, Math.max(0, (ts - last) / 1000)); last = ts;
    step(dt); render();
    requestAnimationFrame(frame);
  }
  function toLocal(e){ return [(e.clientX - ox) / sc, (e.clientY - oy) / sc]; }
  function onSwap(p){ return Math.hypot(p[0] - (LW / 2 + 62), p[1] - (SHOOT_Y + 14)) < R * 1.3 || Math.hypot(p[0] - LW / 2, p[1] - SHOOT_Y) < R * 1.2; }
  cv.addEventListener('pointerdown', function(e){
    e.preventDefault();
    if(state !== 'play') return;
    var p = toLocal(e);
    if(onSwap(p)){ if(!shot){ var t2 = cur; cur = nxt; nxt = t2; tone(600, 900, 0.06, 'sine', 0.04); } aiming = false; aim = null; return; }
    aiming = true; aim = angleFrom(p[0], p[1]);
    try { cv.setPointerCapture(e.pointerId); } catch(err){}
  });
  cv.addEventListener('pointermove', function(e){
    if(state !== 'play') return;
    var p = toLocal(e);
    if(aiming || e.pointerType === 'mouse'){ if(!onSwap(p) || aiming) aim = angleFrom(p[0], p[1]); }
  });
  cv.addEventListener('pointerup', function(e){
    if(!aiming) return;
    aiming = false;
    var p = toLocal(e); aim = angleFrom(p[0], p[1]);
    fire();
    if(e.pointerType !== 'mouse') aim = null;
  });
  cv.addEventListener('pointercancel', function(){ aiming = false; aim = null; });
  $('ov-btn').addEventListener('click', startGame);
  window.addEventListener('keydown', function(e){ if((e.code === 'Space' || e.code === 'Enter') && !ov.hidden){ e.preventDefault(); startGame(); } });

  setupLevel();
  $('ov-best').textContent = best ? 'Best: ' + best : '';
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
