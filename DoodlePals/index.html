  // actions after the last "clear" are the ones that count
  function live(list){
    for(var i = list.length - 1; i >= 0; i--) if(list[i].type === 'clear') return list.slice(i + 1);
    return list;
  }
  function isStroke(a){ return a.type === 'stroke'; }
  function hasInk(i){ return !!st && live(st.actions[i]).some(isStroke); }

  function strokesBox(list){
    var x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    list.forEach(function(a){
      if(a.type !== 'stroke') return;
      var r = a.size / 2 + 2;
      a.pts.forEach(function(q){
        if(q[0] - r < x0) x0 = q[0] - r;
        if(q[1] - r < y0) y0 = q[1] - r;
        if(q[0] + r > x1) x1 = q[0] + r;
        if(q[1] + r > y1) y1 = q[1] + r;
      });
    });
    if(x1 < x0) return null;
    x0 = Math.max(0, x0); y0 = Math.max(0, y0); x1 = Math.min(SIZE, x1); y1 = Math.min(SIZE, y1);
    return { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
  }
  function stepBox(i){ return strokesBox(live(st.actions[i])); }

  // dashed hints showing where each part goes
  function guide(c, type, step, b, hb){
    c.save();
    c.setLineDash([10, 9]);
    c.lineWidth = 3;
    c.lineCap = 'round';
    c.strokeStyle = 'rgba(155,93,229,0.45)';
    c.fillStyle = 'rgba(155,93,229,0.06)';
    function ell(x, y, rx, ry, rot){ c.beginPath(); c.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2); c.fill(); c.stroke(); }
    function line(x0, y0, x1, y1){ c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); c.stroke(); }
    function tri(a, b2, d){ c.beginPath(); c.moveTo(a[0], a[1]); c.lineTo(b2[0], b2[1]); c.lineTo(d[0], d[1]); c.closePath(); c.fill(); c.stroke(); }
    if(step === 'body'){
      if(type === 'animal') ell(250, 270, 140, 80);
      else if(type === 'person') ell(250, 290, 70, 100);
      else if(type === 'bird') ell(240, 260, 105, 80);
      else if(type === 'fish') ell(260, 250, 140, 80);
      else ell(250, 260, 130, 120);
    } else if(b){
      var cx = b.x + b.w / 2, cy = b.y + b.h / 2, r;
      if(step === 'head'){
        if(type === 'person'){ r = clamp(b.w * 0.55, 40, 90); ell(cx, b.y - r * 0.8, r, r); }
        else if(type === 'bird'){ r = clamp(b.h * 0.4, 30, 70); ell(b.x + b.w * 0.92, b.y + r * 0.2, r, r); }
        else { r = clamp(b.h * 0.5, 36, 85); ell(b.x + b.w * 0.95, b.y, r * 1.05, r); }
      } else if(step === 'legs'){
        var fx = type === 'animal' ? [0.14, 0.34, 0.66, 0.86] : type === 'person' ? [0.3, 0.7] : [0.4, 0.6];
        var len = type === 'bird' ? b.h * 0.5 : type === 'person' ? b.h * 0.75 : b.h * 0.65;
        fx.forEach(function(f){ var x = b.x + b.w * f; line(x, b.y + b.h * 0.85, x, Math.min(SIZE - 6, b.y + b.h + len)); });
      } else if(step === 'arms'){
        line(b.x + 6, b.y + b.h * 0.2, b.x - b.w * 0.45, b.y + b.h * 0.7);
        line(b.x + b.w - 6, b.y + b.h * 0.2, b.x + b.w * 1.45, b.y + b.h * 0.7);
      } else if(step === 'tail'){
        var left = !hb || hb.x + hb.w / 2 >= cx, tx = left ? b.x : b.x + b.w, dir = left ? -1 : 1;
        if(type === 'fish') tri([tx - dir * 4, cy], [tx + dir * b.w * 0.32, cy - b.h * 0.45], [tx + dir * b.w * 0.32, cy + b.h * 0.45]);
        else {
          c.beginPath();
          c.moveTo(tx, b.y + b.h * 0.35);
          c.quadraticCurveTo(tx + dir * b.w * 0.35, b.y + b.h * 0.3, tx + dir * b.w * 0.3, b.y - b.h * 0.25);
          c.stroke();
        }
      } else if(step === 'wings'){
        ell(cx - b.w * 0.05, b.y + b.h * 0.3, b.w * 0.3, b.h * 0.22, -0.35);
      } else if(step === 'fins'){
        tri([cx - b.w * 0.15, b.y + 6], [cx, b.y - b.h * 0.35], [cx + b.w * 0.15, b.y + 6]);
        tri([cx, b.y + b.h - 6], [cx + b.w * 0.05, b.y + b.h * 1.28], [cx + b.w * 0.2, b.y + b.h - 6]);
      }
    }
    c.restore();
  }

  // each step gets its own 2x layer
  function newLayer(){
    var c = document.createElement('canvas');
    c.width = c.height = SIZE * LS;
    var x = c.getContext('2d');
    x.setTransform(LS, 0, 0, LS, 0, 0);
    x.lineCap = 'round';
    x.lineJoin = 'round';
    return c;
  }

  function clearLayer(layer){
    var c = layer.getContext('2d');
    c.save(); c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, layer.width, layer.height); c.restore();
  }

  // draw point i of a stroke (a dot for the first point, else a segment)
  function drawSeg(c, a, i){
    var q = a.pts[i];
    c.strokeStyle = c.fillStyle = a.color === 'rainbow' ? 'hsl(' + Math.round(q[2]) + ',90%,58%)' : a.color;
    c.lineWidth = a.size;
    if(i === 0){ c.beginPath(); c.arc(q[0], q[1], a.size / 2, 0, Math.PI * 2); c.fill(); return; }
    var o = a.pts[i - 1];
    c.beginPath(); c.moveTo(o[0], o[1]); c.lineTo(q[0], q[1]); c.stroke();
  }

  function replay(layer, list){
    var c = layer.getContext('2d');
    clearLayer(layer);
    list.forEach(function(a){
      if(a.type === 'clear') clearLayer(layer);
      else if(a.type === 'stroke'){ for(var i = 0; i < a.pts.length; i++) drawSeg(c, a, i); }
      else if(a.type === 'fill') floodFill(layer, a.x, a.y, a.color);
    });
  }

  // paint bucket: fills an empty area inside lines, or recolours a painted area
  function floodFill(layer, fx, fy, color){
    var w = layer.width, h = layer.height, c = layer.getContext('2d');
    fx = fx | 0; fy = fy | 0;
    if(fx < 0 || fy < 0 || fx >= w || fy >= h) return 'out';
    var data = c.getImageData(0, 0, w, h).data;
    var s0 = (fy * w + fx) * 4, empty = data[s0 + 3] <= 100, r0 = data[s0], g0 = data[s0 + 1], b0 = data[s0 + 2];
    var mask = new Uint8Array(w * h);
    function open(x, y){
      var i = y * w + x, o = i * 4;
      if(mask[i]) return false;
      if(empty) return data[o + 3] <= 100;
      return data[o + 3] > 100 && Math.abs(data[o] - r0) + Math.abs(data[o + 1] - g0) + Math.abs(data[o + 2] - b0) < 90;
    }
    var stack = [fx, fy], minX = fx, maxX = fx, minY = fy, maxY = fy;
    while(stack.length){
      var y = stack.pop(), x = stack.pop();
      if(!open(x, y)) continue;
      var x1 = x, x2 = x;
      while(x1 > 0 && open(x1 - 1, y)) x1--;
      while(x2 < w - 1 && open(x2 + 1, y)) x2++;
      if(empty && (x1 === 0 || x2 === w - 1 || y === 0 || y === h - 1)) return 'open';
      for(var i = x1; i <= x2; i++) mask[y * w + i] = 1;
      if(x1 < minX) minX = x1;
      if(x2 > maxX) maxX = x2;
      if(y < minY) minY = y;
      if(y > maxY) maxY = y;
      for(var dy = -1; dy <= 1; dy += 2){
        var ny = y + dy;
        if(ny < 0 || ny >= h) continue;
        for(var j = x1; j <= x2; j++){
          if(open(j, ny) && (j === x1 || !open(j - 1, ny))) stack.push(j, ny);
        }
      }
    }
    // paint the mask in the chosen colour, slightly grown so it tucks under the lines
    var mw = maxX - minX + 9, mh = maxY - minY + 9;
    var mc = document.createElement('canvas');
    mc.width = mw; mc.height = mh;
    var mx = mc.getContext('2d'), id = mx.createImageData(mw, mh), md = id.data;
    for(var yy = minY; yy <= maxY; yy++){
      for(var xx = minX; xx <= maxX; xx++){
        if(!mask[yy * w + xx]) continue;
        var o = ((yy - minY + 4) * mw + (xx - minX + 4)) * 4;
        md[o] = md[o + 1] = md[o + 2] = md[o + 3] = 255;
      }
    }
    mx.putImageData(id, 0, 0);
    mx.globalCompositeOperation = 'source-in';
    if(color === 'rainbow'){
      var g = mx.createLinearGradient(0, 0, mw, mh);
      for(var k = 0; k <= 6; k++) g.addColorStop(k / 6, 'hsl(' + k * 60 + ',90%,62%)');
      mx.fillStyle = g;
    } else mx.fillStyle = color;
    mx.fillRect(0, 0, mw, mh);
    c.save();
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.globalCompositeOperation = empty ? 'destination-over' : 'source-atop';
    var ox = minX - 4, oy = minY - 4, grow = empty ? 2 : 1;
    [[0, 0], [-1, 0], [1, 0], [0, -1], [0, 1], [-0.7, -0.7], [0.7, -0.7], [-0.7, 0.7], [0.7, 0.7]].forEach(function(d){
      c.drawImage(mc, ox + d[0] * grow, oy + d[1] * grow);
    });
    c.restore();
    return 'ok';
  }

  // ---------- studio: tools ----------
  function chip(html, label, onClick, cls){
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip' + (cls ? ' ' + cls : '');
    b.innerHTML = html;
    b.setAttribute('aria-label', label);
    b.addEventListener('click', onClick);
    toolsEl.appendChild(b);
    return b;
  }
  function sep(){ var s = document.createElement('span'); s.className = 'sep'; toolsEl.appendChild(s); }

  var toolBtns = { swatches: [], sizes: [] };
  function buildTools(){
    toolsEl.innerHTML = '';
    COLORS.forEach(function(col, i){
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'swatch' + (col === 'rainbow' ? ' rainbow' : '');
      if(col !== 'rainbow') b.style.background = col;
      b.setAttribute('aria-label', COLOR_NAMES[i]);
      b.addEventListener('click', function(){ tool.color = col; renderTools(); });
      toolsEl.appendChild(b);
      toolBtns.swatches.push(b);
    });
    sep();
    SIZES.forEach(function(sz, i){
      var d = Math.round(4 + i * 5);
      toolBtns.sizes.push(chip('<b style="width:' + d + 'px;height:' + d + 'px"></b>', SIZE_NAMES[i] + ' pen', function(){ tool.size = sz; tool.mode = 'pen'; renderTools(); }, 'size'));
    });
    sep();
    toolBtns.pen = chip('✏️ Pen', 'Pen', function(){ tool.mode = 'pen'; renderTools(); });
    toolBtns.fill = chip('🪣 Fill', 'Fill bucket', function(){ tool.mode = 'fill'; renderTools(); });
    sep();
    chip('↩️', 'Undo', undo);
    chip('🗑️', 'Clear this part', clearStep);
    toolBtns.eyes = chip('👀', 'Googly eyes', function(){ tool.eyes = !tool.eyes; renderTools(); redraw(); });
    renderTools();
  }

  function renderTools(){
    toolBtns.swatches.forEach(function(b, i){ b.setAttribute('aria-pressed', COLORS[i] === tool.color ? 'true' : 'false'); });
    var dot = tool.color === 'rainbow' || tool.color === '#ffffff' ? '#2b2140' : tool.color;
    toolBtns.sizes.forEach(function(b, i){
      b.setAttribute('aria-pressed', tool.mode === 'pen' && SIZES[i] === tool.size ? 'true' : 'false');
      b.style.color = b.getAttribute('aria-pressed') === 'true' ? '#fff' : dot;
    });
    toolBtns.pen.setAttribute('aria-pressed', tool.mode === 'pen' ? 'true' : 'false');
    toolBtns.fill.setAttribute('aria-pressed', tool.mode === 'fill' ? 'true' : 'false');
    toolBtns.eyes.setAttribute('aria-pressed', tool.eyes ? 'true' : 'false');
    pad.style.cursor = tool.mode === 'fill' ? 'cell' : 'crosshair';
  }

  // ---------- studio: the pad ----------
  function sizePad(){
    var cardW = Math.min(window.innerWidth - 20, 720) - 32;
    var size = Math.round(clamp(Math.min(cardW, window.innerHeight - 300), 240, 560));
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    pad.style.width = pad.style.height = size + 'px';
    pad.width = pad.height = Math.round(size * dpr);
    redraw();
  }

  function facingFor(){
    var b = stepBox(0);
    if(!b) return 1;
    var cx = b.x + b.w / 2, hi = st.steps.indexOf('head'), ti = st.steps.indexOf('tail');
    if(hi >= 0 && hasInk(hi)){
      var h = stepBox(hi), d = h.x + h.w / 2 - cx;
      if(Math.abs(d) > b.w * 0.08) return d > 0 ? 1 : -1;
    }
    if(ti >= 0 && hasInk(ti)){ var t = stepBox(ti); return t.x + t.w / 2 < cx ? 1 : -1; }
    return 1;
  }

  function makeFace(b, isHead, type, facing){
    var r = clamp(Math.min(b.w, b.h) * (isHead ? 0.17 : 0.13), 6, 28);
    var side = type === 'animal' || type === 'bird' || type === 'fish' ? 1 : 0;
    var cx = b.x + b.w / 2 + facing * side * b.w * (type === 'fish' ? 0.22 : isHead ? 0.1 : 0.12);
    var ey = b.y + b.h * (type === 'fish' ? 0.4 : isHead ? 0.42 : 0.35);
    return {
      facing: facing,
      eyes: [{ x: cx - r * 1.15, y: ey, r: r }, { x: cx + r * 1.15, y: ey, r: r }],
      smile: { x: cx, y: ey + r * 1.7, r: r * 0.85 }
    };
  }

  // where the eyes will go: on the head if there is one, else the body
  function facePreview(){
    var hi = st.steps.indexOf('head');
    if(hi >= 0 && hasInk(hi)) return makeFace(stepBox(hi), true, st.type, facingFor());
    if(hi >= 0 && st.i <= hi) return null;
    var b = stepBox(0);
    return b ? makeFace(b, false, st.type, facingFor()) : null;
  }

  var rq = 0;
  function requestRedraw(){ if(!rq) rq = requestAnimationFrame(function(){ rq = 0; redraw(); }); }

  function redraw(){
    if(!st) return;
    var k = pad.width / SIZE;
    px.setTransform(1, 0, 0, 1, 0, 0);
    px.clearRect(0, 0, pad.width, pad.height);
    px.setTransform(k, 0, 0, k, 0, 0);
    px.fillStyle = '#fff';
    px.fillRect(0, 0, SIZE, SIZE);
    px.fillStyle = '#efe9ff';
    for(var gx = 25; gx < SIZE; gx += 25) for(var gy = 25; gy < SIZE; gy += 25) px.fillRect(gx - 1, gy - 1, 2, 2);
    var hi = st.steps.indexOf('head');
    guide(px, st.type, st.steps[st.i], stepBox(0), hi >= 0 && hasInk(hi) ? stepBox(hi) : null);
    // finished parts in their real stacking order, the current one on top
    st.steps.map(function(s, i){ return i; })
      .filter(function(i){ return i !== st.i; })
      .sort(function(a, b){ return ROLE_Z[ROLE_OF[st.steps[a]]] - ROLE_Z[ROLE_OF[st.steps[b]]]; })
      .forEach(function(i){ px.drawImage(st.layers[i], 0, 0, SIZE, SIZE); });
    px.drawImage(st.layers[st.i], 0, 0, SIZE, SIZE);
    if(tool.eyes){
      var f = facePreview();
      if(f) drawEyes(px, f, { t: 0, blink: 0, mode: 'idle', look: 0, waveT: 0 });
    }
  }

  function padPos(e){
    var r = pad.getBoundingClientRect();
    return [clamp((e.clientX - r.left) / r.width * SIZE, 0, SIZE), clamp((e.clientY - r.top) / r.height * SIZE, 0, SIZE)];
  }

  pad.addEventListener('pointerdown', function(e){
    if(!st || cur) return;
    e.preventDefault();
    audio();
    var q = padPos(e), layer = st.layers[st.i];
    if(tool.mode === 'fill'){
      var a = { type: 'fill', x: Math.round(q[0] * LS), y: Math.round(q[1] * LS), color: tool.color };
      var res = floodFill(layer, a.x, a.y, a.color);
      if(res === 'ok'){ st.actions[st.i].push(a); sfx.pop(); afterEdit(); }
      else if(res === 'open') toast('Draw a closed shape to fill it in 🙂');
      return;
    }
    cur = { type: 'stroke', color: tool.color, size: tool.size, pts: [[q[0], q[1], rand(0, 360)]], id: e.pointerId };
    try { pad.setPointerCapture(e.pointerId); } catch(err){}
    drawSeg(layer.getContext('2d'), cur, 0);
    requestRedraw();
  });

  pad.addEventListener('pointermove', function(e){
    if(!cur || e.pointerId !== cur.id) return;
    var evs = (e.getCoalescedEvents && e.getCoalescedEvents()) || [];
    if(!evs.length) evs = [e];
    var c = st.layers[st.i].getContext('2d');
    evs.forEach(function(ev){
      var q = padPos(ev), o = cur.pts[cur.pts.length - 1], d = Math.hypot(q[0] - o[0], q[1] - o[1]);
      if(d < 1.2) return;
      cur.pts.push([q[0], q[1], (o[2] + d * 0.9) % 360]);
      drawSeg(c, cur, cur.pts.length - 1);
    });
    requestRedraw();
  });

  function endStroke(e){
    if(!cur || e.pointerId !== cur.id) return;
    delete cur.id;
    st.actions[st.i].push(cur);
    cur = null;
    afterEdit();
  }
  pad.addEventListener('pointerup', endStroke);
  pad.addEventListener('pointercancel', endStroke);

  function afterEdit(){ redraw(); updateNav(); }

  function undo(){
    if(!st) return;
    var list = st.actions[st.i];
    if(!list.length){ toast('Nothing to undo'); return; }
    list.pop();
    replay(st.layers[st.i], list);
    afterEdit();
  }

  function clearStep(){
    if(!st || !hasInk(st.i)) return;
    st.actions[st.i].push({ type: 'clear' });
    clearLayer(st.layers[st.i]);
    afterEdit();
    toast('Cleared! Tap ↩️ to bring it back');
  }

  // ---------- studio: steps ----------
  function renderDots(){
    dotsEl.innerHTML = '';
    if(!st || st.steps.length < 2) return;
    st.steps.forEach(function(s, i){
      var d = document.createElement('i');
      if(i === st.i) d.className = 'on';
      else if(i < st.i) d.className = 'done';
      dotsEl.appendChild(d);
    });
  }

  function updateNav(){
    var last = st.i === st.steps.length - 1, ink = hasInk(st.i), req = st.steps[st.i] === 'body';
    nextBtn.textContent = (ink || req) ? (last ? 'Name it ›' : 'Next ›') : 'Skip ›';
    nextBtn.className = 'btn' + ((ink || req) ? ' go' : '');
    nextBtn.disabled = req && !ink;
    skipBtn.hidden = !(st.i > 0 && !last);
    skipBtn.textContent = '✨ Done';
    backBtn.textContent = st.i === 0 ? '‹ Pick' : '‹ Back';
  }

  function goStep(i){
    st.i = i;
    var info = stepInfo(st.type, st.steps[i]);
    stTitle.textContent = info.title;
    tipEl.textContent = info.tip;
    renderDots();
    updateNav();
    redraw();
  }

  function buildPicker(){
    pickerEl.innerHTML = '';
    TYPE_ORDER.forEach(function(k){
      var t = TYPES[k], b = document.createElement('button');
      b.type = 'button';
      b.className = 'type';
      b.style.background = t.bg;
      b.innerHTML = '<span class="em">' + t.em + '</span>' + t.label + '<small>' + t.note + '</small>';
      b.addEventListener('click', function(){ startDrawing(k); });
      pickerEl.appendChild(b);
    });
  }

  function showPicker(){
    st = null;
    cur = null;
    stTitle.textContent = 'What do you want to draw?';
    dotsEl.innerHTML = '';
    pickerEl.hidden = false;
    drawingEl.hidden = true;
    namingEl.hidden = true;
  }

  function startDrawing(type){
    audio();
    sfx.pop();
    var t = TYPES[type];
    st = { type: type, steps: t.steps.slice(), i: 0, layers: t.steps.map(newLayer), actions: t.steps.map(function(){ return []; }) };
    tool.mode = 'pen';
    renderTools();
    pickerEl.hidden = true;
    namingEl.hidden = true;
    drawingEl.hidden = false;
    sizePad();
    goStep(0);
  }

  function openStudio(){
    audio();
    studioEl.hidden = false;
    updateEmpty();
    // a half-finished pal is still waiting
    if(st && st.actions.some(function(l, i){ return hasInk(i); })){
      pickerEl.hidden = true;
      namingEl.hidden = true;
      drawingEl.hidden = false;
      sizePad();
      goStep(st.i);
    } else showPicker();
  }

  function closeStudio(){
    studioEl.hidden = true;
    cur = null;
    updateEmpty();
  }

  document.getElementById('st-close').addEventListener('click', closeStudio);
  backBtn.addEventListener('click', function(){ if(st.i === 0) showPicker(); else goStep(st.i - 1); });
  nextBtn.addEventListener('click', function(){
    if(nextBtn.disabled) return;
    if(st.i === st.steps.length - 1) goNaming(); else goStep(st.i + 1);
  });
  skipBtn.addEventListener('click', goNaming);

  // ---------- studio: naming ----------
  var namingEl = document.getElementById('naming'), previewEl = document.getElementById('preview');
  var nameInput = document.getElementById('pal-name');

  function renderPreview(){
    var c = previewEl.getContext('2d'), S = previewEl.width, u = null;
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.fillStyle = '#fff';
    c.fillRect(0, 0, S, S);
    st.steps.forEach(function(s, i){
      var b = stepBox(i);
      if(!b) return;
      if(!u){ u = { x0: b.x, y0: b.y, x1: b.x + b.w, y1: b.y + b.h }; return; }
      u.x0 = Math.min(u.x0, b.x); u.y0 = Math.min(u.y0, b.y);
      u.x1 = Math.max(u.x1, b.x + b.w); u.y1 = Math.max(u.y1, b.y + b.h);
    });
    if(!u) return;
    // zoom so the pal fills the little frame
    var k = Math.min(S * 0.82 / Math.max(u.x1 - u.x0, u.y1 - u.y0), S / SIZE * 1.6);
    c.setTransform(k, 0, 0, k, S / 2 - (u.x0 + u.x1) / 2 * k, S / 2 - (u.y0 + u.y1) / 2 * k);
    st.steps.map(function(s, i){ return i; })
      .sort(function(a, b){ return ROLE_Z[ROLE_OF[st.steps[a]]] - ROLE_Z[ROLE_OF[st.steps[b]]]; })
      .forEach(function(i){ c.drawImage(st.layers[i], 0, 0, SIZE, SIZE); });
    if(tool.eyes){
      var hi = st.steps.indexOf('head'), headOn = hi >= 0 && hasInk(hi);
      drawEyes(c, makeFace(headOn ? stepBox(hi) : stepBox(0), headOn, st.type, facingFor()), { t: 0, blink: 0, mode: 'idle', look: 0, waveT: 1 });
    }
  }

  function goNaming(){
    if(!st || !hasInk(0)) return;
    cur = null;
    if(!st.name) st.name = pickName();
    stTitle.textContent = 'What’s their name?';
    Array.prototype.forEach.call(dotsEl.children, function(d){ d.className = 'done'; });
    drawingEl.hidden = true;
    namingEl.hidden = false;
    nameInput.value = st.name;
    renderPreview();
    sfx.pop();
    // on phones, wait for a tap so the keyboard doesn't cover the picture
    if(!(window.matchMedia && matchMedia('(pointer: coarse)').matches)){ nameInput.focus(); nameInput.select(); }
  }

  function bringToLife(){
    if(!st) return;
    st.name = cleanName(nameInput.value) || pickName();
    nameInput.blur();
    finish();
  }

  document.getElementById('nm-back').addEventListener('click', function(){
    st.name = cleanName(nameInput.value) || st.name;
    namingEl.hidden = true;
    drawingEl.hidden = false;
    sizePad();
    goStep(st.i);
  });
  document.getElementById('nm-go').addEventListener('click', bringToLife);
  document.getElementById('name-dice').addEventListener('click', function(){
    nameInput.value = pickName(nameInput.value);
    sfx.pop();
  });

  // ---------- studio: bring it to life ----------
  // separate legs / arms / wings / fins become separate moving parts
  function groupActions(list){
    var strokes = list.filter(isStroke), boxes = strokes.map(function(a){ return strokesBox([a]); });
    var parent = strokes.map(function(a, i){ return i; });
    function find(i){ while(parent[i] !== i){ parent[i] = parent[parent[i]]; i = parent[i]; } return i; }
    for(var i = 0; i < strokes.length; i++){
      for(var j = i + 1; j < strokes.length; j++){
        var a = boxes[i], b = boxes[j];
        if(a.x - 6 < b.x + b.w && b.x - 6 < a.x + a.w && a.y - 6 < b.y + b.h && b.y - 6 < a.y + a.h) parent[find(i)] = find(j);
      }
    }
    var roots = [];
    strokes.forEach(function(a, i){ a._g = find(i); if(roots.indexOf(a._g) < 0) roots.push(a._g); });
    var gbox = {};
    roots.forEach(function(r){ gbox[r] = strokesBox(strokes.filter(function(a){ return a._g === r; })); });
    list.forEach(function(a){
      if(a.type !== 'fill') return;
      var x = a.x / LS, y = a.y / LS;
      a._g = -1;
      for(var k = 0; k < roots.length; k++){
        var b = gbox[roots[k]];
        if(x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h){ a._g = roots[k]; break; }
      }
    });
    return roots.map(function(r){ return list.filter(function(a){ return a._g === r; }); });
  }

  function crop(layer, b){
    var c = document.createElement('canvas');
    c.width = Math.max(1, Math.ceil(b.w));
    c.height = Math.max(1, Math.ceil(b.h));
    c.getContext('2d').drawImage(layer, b.x * LS, b.y * LS, b.w * LS, b.h * LS, 0, 0, c.width, c.height);
    return c.toDataURL('image/png');
  }

  function setPivot(part, list, bcx, bcy){
    var pts = [];
    list.forEach(function(a){ if(a.type === 'stroke') a.pts.forEach(function(q){ pts.push(q); }); });
    var cx = part.x + part.w / 2, cy = part.y + part.h / 2;
    if(part.role === 'body'){ part.px = cx; part.py = cy; }
    else if(part.role === 'head'){
      var nx = clamp(bcx, part.x, part.x + part.w), ny = clamp(bcy, part.y, part.y + part.h);
      if(nx === bcx && ny === bcy){ nx = cx; ny = part.y + part.h; }
      part.px = nx; part.py = ny;
    } else if(part.role === 'leg'){
      var lim = part.y + part.h * 0.2, sx = 0, n = 0;
      pts.forEach(function(q){ if(q[1] <= lim){ sx += q[0]; n++; } });
      part.px = n ? sx / n : cx;
      part.py = part.y + Math.min(6, part.h * 0.1);
    } else {
      var best = null, bd = Infinity;
      pts.forEach(function(q){ var d = (q[0] - bcx) * (q[0] - bcx) + (q[1] - bcy) * (q[1] - bcy); if(d < bd){ bd = d; best = q; } });
      part.px = best ? best[0] : cx;
      part.py = best ? best[1] : cy;
    }
    var sd = cx - part.px;
    part.side = Math.abs(sd) < 2 ? 1 : sd > 0 ? 1 : -1;
  }

  function pickName(avoid){
    var used = {};
    pals.forEach(function(p){ used[p.d.name] = 1; });
    if(avoid) used[avoid] = 1;
    var free = NAMES.filter(function(n){ return !used[n]; });
    return pick(free.length ? free : NAMES);
  }

  function finish(){
    if(!st || !hasInk(0)) return;
    var body = stepBox(0), bcx = body.x + body.w / 2, bcy = body.y + body.h / 2, parts = [];
    st.steps.forEach(function(step, si){
      var list = live(st.actions[si]);
      if(!list.some(isStroke)) return;
      var groups = GROUPED[step] ? groupActions(list) : [list];
      groups.forEach(function(g){
        var b = strokesBox(g);
        if(!b || b.w < 1 || b.h < 1) return;
        var layer = newLayer();
        replay(layer, g);
        var part = { role: ROLE_OF[step], url: crop(layer, b), x: b.x, y: b.y, w: b.w, h: b.h, px: 0, py: 0, side: 1, k: 0 };
        setPivot(part, g, bcx, bcy);
        parts.push(part);
      });
    });
    ['leg', 'arm', 'wing', 'fin'].forEach(function(r){
      parts.filter(function(q){ return q.role === r; })
        .sort(function(a, b){ return (a.x + a.w / 2) - (b.x + b.w / 2); })
        .forEach(function(q, k){ q.k = k; });
    });
    parts.sort(function(a, b){ return ROLE_Z[a.role] - ROLE_Z[b.role]; });

    var x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    parts.forEach(function(q){
      x0 = Math.min(x0, q.x); y0 = Math.min(y0, q.y);
      x1 = Math.max(x1, q.x + q.w); y1 = Math.max(y1, q.y + q.h);
    });
    var u = { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
    var facing = facingFor(), hi = st.steps.indexOf('head'), headOn = hi >= 0 && hasInk(hi);
    var face = tool.eyes ? makeFace(headOn ? stepBox(hi) : body, headOn, st.type, facing) : null;
    var centred = st.type === 'bird' || st.type === 'fish';
    var d = {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      type: st.type,
      name: st.name || pickName(),
      facing: facing,
      bbox: u,
      ax: u.x + u.w / 2,
      ay: centred ? u.y + u.h / 2 : u.y + u.h,
      eyes: face ? face.eyes : null,
      smile: face ? face.smile : null,
      eyeHost: headOn ? 'head' : 'body',
      parts: parts
    };
    st = null;
    closeStudio();
    addPal(d, true);
  }

  document.addEventListener('keydown', function(e){
    if(!renameEl.hidden){
      if(e.key === 'Escape') closeRename();
      else if(e.key === 'Enter'){ e.preventDefault(); saveRename(); }
      return;
    }
    if(!confirmEl.hidden){ if(e.key === 'Escape') confirmEl.hidden = true; return; }
    if(studioEl.hidden) return;
    var typing = e.target && e.target.tagName === 'INPUT';
    if(e.key === 'Escape'){ closeStudio(); e.preventDefault(); }
    else if(typing){ if(e.key === 'Enter'){ e.preventDefault(); bringToLife(); } }
    else if((e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'Z')){ undo(); e.preventDefault(); }
  });

  // ---------- go! ----------
  buildPicker();
  buildTools();
  renderMute();
  onResize();
  loadPals();
  updateEmpty();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
