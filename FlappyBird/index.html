<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1b1a18">
<title>Flappy Bird</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<style>
  :root{ --page:#1b1a18; --ink:#543847; }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html,body{
    margin:0;
    height:100%;
    background:var(--page);
    overflow:hidden;
    overscroll-behavior:none;
    font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
  }

  body{ display:flex; align-items:center; justify-content:center; }

  .stage{
    --u:1;                 /* px per world unit, set from JS */
    position:relative;
    overflow:hidden;
    touch-action:none;
    cursor:pointer;
  }
  .stage.framed{
    border-radius:18px;
    box-shadow:0 24px 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.06);
  }

  canvas{ display:block; width:100%; height:100%; }

  /* outlined chunky text, sized in world units so it scales with the board */
  .chunky{
    font-weight:800;
    color:#fff;
    text-shadow:
      calc(2px*var(--u)) 0 var(--ink), calc(-2px*var(--u)) 0 var(--ink),
      0 calc(2px*var(--u)) var(--ink), 0 calc(-2px*var(--u)) var(--ink),
      calc(1.5px*var(--u)) calc(1.5px*var(--u)) var(--ink), calc(-1.5px*var(--u)) calc(-1.5px*var(--u)) var(--ink),
      calc(1.5px*var(--u)) calc(-1.5px*var(--u)) var(--ink), calc(-1.5px*var(--u)) calc(1.5px*var(--u)) var(--ink),
      0 calc(4px*var(--u)) var(--ink);
  }

  .overlay{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    pointer-events:none;
  }
  .overlay[hidden]{ display:none; }

  .ready{ justify-content:flex-start; padding-top:calc(78px*var(--u)); gap:calc(10px*var(--u)); }
  .ready .title{ font-size:calc(38px*var(--u)); color:#ffb43a; }
  .ready .best{ font-size:calc(13px*var(--u)); }

  .pill{
    font-size:calc(12.5px*var(--u));
    font-weight:700;
    color:#fff;
    background:rgba(40,30,35,0.45);
    padding:calc(6px*var(--u)) calc(12px*var(--u));
    border-radius:999px;
  }

  .paused{ justify-content:center; gap:calc(10px*var(--u)); background:rgba(20,30,40,0.25); }
  .paused .title{ font-size:calc(34px*var(--u)); }

  .over{ justify-content:center; gap:calc(12px*var(--u)); pointer-events:auto; cursor:default; }
  .over .title{ font-size:calc(38px*var(--u)); color:#ffb43a; animation:drop .35s cubic-bezier(.2,.8,.3,1.2) both; }

  .card{
    display:flex;
    align-items:center;
    gap:calc(18px*var(--u));
    background:#ded895;
    border:calc(3px*var(--u)) solid var(--ink);
    border-radius:calc(10px*var(--u));
    box-shadow:0 calc(4px*var(--u)) 0 var(--ink);
    padding:calc(12px*var(--u)) calc(18px*var(--u));
    animation:rise .4s cubic-bezier(.2,.8,.3,1) .08s both;
  }

  .medal-col{ display:flex; flex-direction:column; align-items:center; gap:calc(5px*var(--u)); }
  .medal{
    width:calc(44px*var(--u));
    height:calc(44px*var(--u));
    border-radius:50%;
    border:calc(2px*var(--u)) dashed rgba(84,56,71,0.35);
  }
  .medal.won{
    border:calc(2px*var(--u)) solid var(--ink);
    box-shadow:inset 0 calc(-3px*var(--u)) 0 rgba(0,0,0,0.15);
  }
  .medal-name{
    font-size:calc(9.5px*var(--u));
    font-weight:800;
    color:#e86101;
    text-transform:uppercase;
    letter-spacing:calc(0.4px*var(--u));
  }

  .nums{ display:flex; flex-direction:column; align-items:flex-end; gap:calc(3px*var(--u)); }
  .k{
    font-size:calc(10px*var(--u));
    font-weight:800;
    color:#e86101;
    text-transform:uppercase;
    letter-spacing:calc(0.6px*var(--u));
  }
  .v{ font-size:calc(24px*var(--u)); line-height:1.05; }

  .newbest{
    font-size:calc(11px*var(--u));
    font-weight:800;
    color:#fff;
    background:#e86101;
    padding:calc(3px*var(--u)) calc(10px*var(--u));
    border-radius:999px;
  }

  .again{
    font:inherit;
    font-weight:800;
    font-size:calc(15px*var(--u));
    color:#fff;
    background:#e86101;
    border:calc(3px*var(--u)) solid var(--ink);
    border-radius:calc(10px*var(--u));
    padding:calc(8px*var(--u)) calc(22px*var(--u));
    box-shadow:0 calc(4px*var(--u)) 0 var(--ink);
    cursor:pointer;
    animation:rise .4s cubic-bezier(.2,.8,.3,1) .16s both;
  }
  .again:active{ transform:translateY(calc(3px*var(--u))); box-shadow:0 calc(1px*var(--u)) 0 var(--ink); }
  .again:focus-visible{ outline:3px solid #fff; outline-offset:2px; }

  .mute{
    position:absolute;
    top:calc(10px*var(--u));
    right:calc(10px*var(--u));
    width:calc(30px*var(--u));
    height:calc(30px*var(--u));
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0;
    border:none;
    border-radius:50%;
    background:rgba(40,30,35,0.35);
    color:#fff;
    cursor:pointer;
    z-index:2;
  }
  .mute svg{ width:60%; height:60%; }
  .mute:focus-visible{ outline:2px solid #fff; outline-offset:2px; }

  /* back to the launcher, mirrors the mute button */
  .back{
    position:absolute;
    top:calc(10px*var(--u));
    left:calc(10px*var(--u));
    width:calc(30px*var(--u));
    height:calc(30px*var(--u));
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:rgba(40,30,35,0.35);
    color:#fff;
    z-index:2;
  }
  .back svg{ width:58%; height:58%; }
  .back:focus-visible{ outline:2px solid #fff; outline-offset:2px; }

  @keyframes rise{ from{ opacity:0; transform:translateY(calc(24px*var(--u))); } to{ opacity:1; transform:none; } }
  @keyframes drop{ from{ opacity:0; transform:translateY(calc(-16px*var(--u))); } to{ opacity:1; transform:none; } }
</style>
</head>
<body>

<div class="stage" id="stage">
  <canvas id="game"></canvas>

  <a class="back" href="../" aria-label="Back to games">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg>
  </a>

  <button class="mute" id="mute" aria-label="Mute" aria-pressed="false">
    <svg id="icon-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
      <path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor" stroke="none"/>
      <path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/>
    </svg>
    <svg id="icon-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" style="display:none">
      <path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor" stroke="none"/>
      <path d="M16 9l6 6M22 9l-6 6"/>
    </svg>
  </button>

  <div class="overlay ready" id="ready">
    <div class="title chunky">Get Ready</div>
    <div class="pill">Tap, click or press Space to flap</div>
    <div class="best chunky" id="ready-best"></div>
  </div>

  <div class="overlay paused" id="paused" hidden>
    <div class="title chunky">Paused</div>
    <div class="pill">Tap or press Space to keep going</div>
  </div>

  <div class="overlay over" id="over" hidden>
    <div class="title chunky">Game Over</div>
    <div class="card">
      <div class="medal-col">
        <div class="medal" id="medal"></div>
        <div class="medal-name" id="medal-name"></div>
      </div>
      <div class="nums">
        <span class="k">Score</span>
        <span class="v chunky" id="ov-score">0</span>
        <span class="k">Best</span>
        <span class="v chunky" id="ov-best">0</span>
      </div>
    </div>
    <div class="newbest" id="newbest" hidden>New best!</div>
    <button class="again" id="again">Play again</button>
  </div>
</div>

<script>
(function(){
  'use strict';

  // ---- world, in virtual units: height is always 512, width follows the screen ----
  var VH = 512, VW = 288;
  var GROUND_H = 100, GROUND_Y = VH - GROUND_H;
  var BIRD_X = 72, BIRD_R = 11;
  var GRAVITY = 1400, FLAP = -390, MAX_FALL = 520;
  var SPEED = 128;
  var PIPE_W = 52, CAP_H = 24, GAP = 122, SPACING = 190;
  var STEP = 1 / 240;

  var stage    = document.getElementById('stage');
  var canvas   = document.getElementById('game');
  var ctx      = canvas.getContext('2d');
  var readyEl  = document.getElementById('ready');
  var pausedEl = document.getElementById('paused');
  var overEl   = document.getElementById('over');
  var readyBest = document.getElementById('ready-best');
  var ovScore  = document.getElementById('ov-score');
  var ovBest   = document.getElementById('ov-best');
  var newBestEl = document.getElementById('newbest');
  var medalEl  = document.getElementById('medal');
  var medalName = document.getElementById('medal-name');
  var againBtn = document.getElementById('again');
  var muteBtn  = document.getElementById('mute');
  var iconOn   = document.getElementById('icon-on');
  var iconOff  = document.getElementById('icon-off');

  var state = 'ready';          // ready | playing | paused | dying | over
  var bird = { y: VH * 0.42, vy: 0, rot: 0 };
  var pipes = [];
  var score = 0, best = 0;
  var t = 0, scroll = 0, flash = 0;
  var acc = 0, last = performance.now();
  var lastGapY = 0;
  var overTimer = 0, canRestartAt = 0;

  // ---------- storage (throws in some private modes) ----------
  function load(key, fallback){
    try { var v = localStorage.getItem(key); return v === null ? fallback : v; }
    catch(e){ return fallback; }
  }
  function save(key, v){
    try { localStorage.setItem(key, String(v)); } catch(e){}
  }

  // ---------- sound: tiny synth blips, no audio files ----------
  var actx = null;
  var muted = load('flappy.muted', '0') === '1';

  function ensureAudio(){
    if(!actx){
      var AC = window.AudioContext || window.webkitAudioContext;
      if(AC){ try { actx = new AC(); } catch(e){} }
    }
    if(actx && actx.state === 'suspended') actx.resume();
  }

  function tone(f0, f1, dur, type, vol, delay){
    if(muted || !actx) return;
    var t0 = actx.currentTime + (delay || 0);
    var o = actx.createOscillator(), g = actx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t0);
    o.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g);
    g.connect(actx.destination);
    o.start(t0);
    o.stop(t0 + dur + 0.03);
  }

  var sfx = {
    flap:  function(){ tone(420, 720, 0.09, 'triangle', 0.14); },
    point: function(){ tone(880, 880, 0.07, 'square', 0.05); tone(1320, 1320, 0.14, 'square', 0.05, 0.07); },
    hit:   function(){ tone(240, 60, 0.22, 'sawtooth', 0.12); },
    fall:  function(){ tone(620, 140, 0.45, 'triangle', 0.09, 0.12); }
  };

  function renderMute(){
    iconOn.style.display  = muted ? 'none' : '';
    iconOff.style.display = muted ? '' : 'none';
    muteBtn.setAttribute('aria-pressed', muted ? 'true' : 'false');
  }

  function toggleMute(){
    muted = !muted;
    save('flappy.muted', muted ? '1' : '0');
    renderMute();
  }

  // ---------- sizing ----------
  function resize(){
    var framed = window.innerWidth >= 700;
    var pad = framed ? 28 : 0;
    var maxW = window.innerWidth - pad * 2;
    var maxH = window.innerHeight - pad * 2;
    if(maxW <= 0 || maxH <= 0) return;   // hidden / zero-size viewport: keep last layout

    // phones fill the screen; desktop gets a portrait window
    var aspect = Math.max(0.45, Math.min(0.62, maxW / maxH));
    var h = maxH, w = h * aspect;
    if(w > maxW){ w = maxW; h = w / aspect; }

    VW = VH * aspect;
    var scale = h / VH;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);

    stage.style.width  = w + 'px';
    stage.style.height = h + 'px';
    stage.style.setProperty('--u', scale.toFixed(4));
    stage.classList.toggle('framed', framed);

    canvas.width  = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
    render();
  }

  // ---------- game flow ----------
  function toReady(){
    clearTimeout(overTimer);
    state = 'ready';
    pipes = [];
    score = 0;
    bird.y = VH * 0.42; bird.vy = 0; bird.rot = 0;
    lastGapY = (50 + (GROUND_Y - 50 - GAP)) / 2;
    readyBest.textContent = best > 0 ? 'Best ' + best : '';
    overEl.hidden = true;
    pausedEl.hidden = true;
    readyEl.hidden = false;
  }

  function startGame(){
    state = 'playing';
    readyEl.hidden = true;
    pipes = [];
    score = 0;
    spawnPipe(VW + 80);
  }

  function flap(){
    bird.vy = FLAP;
    sfx.flap();
  }

  function crash(onGround){
    flash = 1;
    sfx.hit();
    if(onGround){ gameOver(); return; }
    // clipped a pipe: drop out of the sky before the panel shows
    state = 'dying';
    if(bird.vy < 0) bird.vy = 0;
    sfx.fall();
  }

  function gameOver(){
    state = 'over';
    var isNew = score > best;
    if(isNew){ best = score; save('flappy.best', best); }
    ovScore.textContent = String(score);
    ovBest.textContent = String(best);
    newBestEl.hidden = !isNew;
    setMedal(score);
    overTimer = setTimeout(function(){ overEl.hidden = false; }, 450);
    // a frantic last tap shouldn't skip straight past the score
    canRestartAt = performance.now() + 650;
  }

  function tryRestart(){
    if(state === 'over' && performance.now() >= canRestartAt) toReady();
  }

  function pause(){
    if(state !== 'playing') return;
    state = 'paused';
    pausedEl.hidden = false;
  }

  function resume(){
    if(state !== 'paused') return;
    state = 'playing';
    pausedEl.hidden = true;
  }

  function setMedal(s){
    var m = s >= 40 ? ['#f4fbff', '#a9c9d8', 'Platinum']
          : s >= 30 ? ['#fff1a6', '#e0a800', 'Gold']
          : s >= 20 ? ['#ffffff', '#b3bac2', 'Silver']
          : s >= 10 ? ['#ffd2a8', '#c0712e', 'Bronze']
          : null;
    if(m){
      medalEl.className = 'medal won';
      medalEl.style.background = 'radial-gradient(circle at 35% 30%, ' + m[0] + ', ' + m[1] + ')';
      medalName.textContent = m[2];
    } else {
      medalEl.className = 'medal';
      medalEl.style.background = 'transparent';
      medalName.textContent = '10 for bronze';
    }
  }

  function spawnPipe(x){
    var minY = 50, maxY = GROUND_Y - 50 - GAP;
    var y = minY + Math.random() * (maxY - minY);
    // keep consecutive gaps within what one or two flaps can recover
    y = Math.max(lastGapY - 130, Math.min(lastGapY + 130, y));
    y = Math.max(minY, Math.min(maxY, y));
    lastGapY = y;
    pipes.push({ x: x, y: y, passed: false });
  }

  function circleRect(cx, cy, r, rx, ry, rw, rh){
    var nx = Math.max(rx, Math.min(cx, rx + rw));
    var ny = Math.max(ry, Math.min(cy, ry + rh));
    var dx = cx - nx, dy = cy - ny;
    return dx * dx + dy * dy < r * r;
  }

  // ---------- simulation: fixed step, so 60Hz and 144Hz screens play identically ----------
  function update(dt){
    if(state === 'paused') return;
    t += dt;
    if(flash > 0) flash = Math.max(0, flash - dt * 3.2);

    if(state === 'ready'){
      scroll += SPEED * dt;
      bird.y = VH * 0.42 + Math.sin(t * 5.5) * 5;
      return;
    }

    if(state === 'dying'){
      bird.vy = Math.min(bird.vy + GRAVITY * dt, MAX_FALL);
      bird.y += bird.vy * dt;
      bird.rot += (1.45 - bird.rot) * Math.min(1, dt * 10);
      if(bird.y + BIRD_R >= GROUND_Y){ bird.y = GROUND_Y - BIRD_R; gameOver(); }
      return;
    }

    if(state !== 'playing') return;

    scroll += SPEED * dt;

    bird.vy = Math.min(bird.vy + GRAVITY * dt, MAX_FALL);
    bird.y += bird.vy * dt;
    if(bird.y < -30){ bird.y = -30; bird.vy = 0; }

    // nose up after a flap, then tip into a dive as speed builds
    var target = bird.vy < 140 ? -0.42
               : Math.min(1.45, -0.42 + (bird.vy - 140) / (MAX_FALL - 140) * 1.9);
    bird.rot += (target - bird.rot) * Math.min(1, dt * 14);

    var i, p;
    for(i = 0; i < pipes.length; i++) pipes[i].x -= SPEED * dt;
    while(pipes.length && pipes[0].x + PIPE_W + 4 < 0) pipes.shift();
    p = pipes[pipes.length - 1];
    if(!p) spawnPipe(VW + 80);
    else if(p.x + SPACING <= VW + 20) spawnPipe(p.x + SPACING);

    for(i = 0; i < pipes.length; i++){
      p = pipes[i];
      if(!p.passed && p.x + PIPE_W / 2 < BIRD_X){ p.passed = true; score++; sfx.point(); }
    }

    if(bird.y + BIRD_R >= GROUND_Y){ bird.y = GROUND_Y - BIRD_R; crash(true); return; }

    for(i = 0; i < pipes.length; i++){
      p = pipes[i];
      if(p.x > BIRD_X + BIRD_R || p.x + PIPE_W < BIRD_X - BIRD_R) continue;
      // pipes extend past the top of the screen, so flying over them still counts as a hit
      if(circleRect(BIRD_X, bird.y, BIRD_R, p.x, -1000, PIPE_W, p.y + 1000) ||
         circleRect(BIRD_X, bird.y, BIRD_R, p.x, p.y + GAP, PIPE_W, 2000)){
        crash(false);
        return;
      }
    }
  }

  // ---------- drawing ----------
  var skyGrad = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
  skyGrad.addColorStop(0, '#4ec0ca');
  skyGrad.addColorStop(1, '#b4e8ec');

  // [x, radius] / [x, w, h], each pattern tiles horizontally
  var CLOUDS    = [[0,22],[28,30],[62,20],[88,34],[124,24],[152,29],[182,21]];
  var BUILDINGS = [[0,22,34],[24,16,52],[42,26,28],[70,18,46],[90,30,24],[122,14,58],[138,24,38],[164,28,28]];
  var BUSHES    = [[0,14],[18,19],[40,13],[58,20],[80,15],[98,18],[118,12]];

  function band(pattern, period, baseY, speed, color, phase){
    var off = (scroll * speed + phase) % period;
    ctx.fillStyle = color;
    ctx.beginPath();
    for(var s = -off - period; s < VW + period; s += period){
      for(var i = 0; i < pattern.length; i++){
        var c = pattern[i];
        ctx.moveTo(s + c[0] + c[1], baseY);
        ctx.arc(s + c[0], baseY, c[1], 0, Math.PI * 2);
      }
    }
    ctx.fill();
    ctx.fillRect(0, baseY, VW, GROUND_Y - baseY);
  }

  function drawBuildings(){
    var period = 196, base = 404, off = (scroll * 0.3) % period;
    ctx.fillStyle = '#c7ecd8';
    for(var s = -off - period; s < VW + period; s += period){
      for(var i = 0; i < BUILDINGS.length; i++){
        var b = BUILDINGS[i];
        ctx.fillRect(s + b[0], base - b[2], b[1], b[2]);
      }
    }
  }

  function pipePart(x, y, w, h){
    if(h <= 0) return;
    ctx.fillStyle = '#73bf2e'; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = '#9ce659'; ctx.fillRect(x + 4, y, 6, h);
    ctx.fillStyle = '#5a9a26'; ctx.fillRect(x + w - 12, y, 8, h);
    ctx.strokeStyle = '#2f4a1a';
    ctx.lineWidth = 2;
    ctx.strokeRect(x + 1, y + 1, w - 2, h - 2);
  }

  function drawPipes(){
    for(var i = 0; i < pipes.length; i++){
      var p = pipes[i];
      var lower = p.y + GAP;
      pipePart(p.x, -4, PIPE_W, p.y - CAP_H + 4);
      pipePart(p.x - 3, p.y - CAP_H, PIPE_W + 6, CAP_H);
      pipePart(p.x - 3, lower, PIPE_W + 6, CAP_H);
      pipePart(p.x, lower + CAP_H, PIPE_W, GROUND_Y - lower - CAP_H + 4);
    }
  }

  function drawGround(){
    ctx.fillStyle = '#ded895';
    ctx.fillRect(0, GROUND_Y, VW, GROUND_H);
    ctx.fillStyle = '#543847';
    ctx.fillRect(0, GROUND_Y, VW, 2);
    ctx.fillStyle = '#9ce659';
    ctx.fillRect(0, GROUND_Y + 2, VW, 11);

    var off = scroll % 14;
    ctx.fillStyle = '#73bf2e';
    ctx.beginPath();
    for(var x = -off - 14; x < VW + 14; x += 14){
      ctx.moveTo(x, GROUND_Y + 13);
      ctx.lineTo(x + 7, GROUND_Y + 2);
      ctx.lineTo(x + 14, GROUND_Y + 2);
      ctx.lineTo(x + 7, GROUND_Y + 13);
      ctx.closePath();
    }
    ctx.fill();

    ctx.fillStyle = '#558c22';
    ctx.fillRect(0, GROUND_Y + 13, VW, 3);
    ctx.fillStyle = '#d2c77a';
    ctx.fillRect(0, GROUND_Y + 16, VW, 4);
  }

  function drawBird(){
    var frozen = state === 'dying' || state === 'over';
    var frame = frozen ? 1 : Math.floor(t * (state === 'ready' ? 8 : 14)) % 4;
    var wingY = [-4, 0, 4, 0][frame];

    ctx.save();
    ctx.translate(BIRD_X, bird.y);
    ctx.rotate(bird.rot);
    ctx.lineWidth = 1.8;
    ctx.strokeStyle = '#3b2614';
    ctx.lineJoin = 'round';

    // body
    ctx.beginPath();
    ctx.ellipse(0, 0, 17, 12.5, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#f7d51d';
    ctx.fill();

    // belly, clipped to the body
    ctx.save();
    ctx.clip();
    ctx.fillStyle = '#fbe7a1';
    ctx.beginPath();
    ctx.ellipse(3, 9, 15, 7, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.beginPath();
    ctx.ellipse(0, 0, 17, 12.5, 0, 0, Math.PI * 2);
    ctx.stroke();

    // wing
    ctx.beginPath();
    ctx.ellipse(-6, wingY, 8.5, 5.5, -0.15, 0, Math.PI * 2);
    ctx.fillStyle = '#fff6d0';
    ctx.fill();
    ctx.stroke();

    // eye
    ctx.beginPath();
    ctx.ellipse(7.5, -4.5, 6, 6.5, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff';
    ctx.fill();
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(9.6, -4, 2.5, 0, Math.PI * 2);
    ctx.fillStyle = '#1c1c1c';
    ctx.fill();

    // beak, upper and lower
    ctx.beginPath();
    ctx.ellipse(15, 2, 8, 3.4, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#f36a1d';
    ctx.fill();
    ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(14, 6.2, 6.5, 2.6, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#e04f16';
    ctx.fill();
    ctx.stroke();

    ctx.restore();
  }

  function drawScore(){
    var s = String(score);
    ctx.font = '800 46px "Segoe UI", system-ui, -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.lineJoin = 'round';
    ctx.lineWidth = 8;
    ctx.strokeStyle = '#543847';
    ctx.strokeText(s, VW / 2, 34);
    ctx.fillStyle = '#ffffff';
    ctx.fillText(s, VW / 2, 34);
  }

  function render(){
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, VW, GROUND_Y);
    band(CLOUDS, 210, 364, 0.12, '#e6f7f8', 0);
    drawBuildings();
    band(BUSHES, 134, 400, 0.5, '#86dc62', 0);
    band(BUSHES, 134, 407, 0.62, '#66c443', 67);
    drawPipes();
    drawGround();
    drawBird();
    if(state !== 'ready' && state !== 'over') drawScore();
    if(flash > 0){
      ctx.fillStyle = 'rgba(255,255,255,' + (flash * 0.6).toFixed(3) + ')';
      ctx.fillRect(0, 0, VW, VH);
    }
  }

  // ---------- loop ----------
  function frame(now){
    requestAnimationFrame(frame);
    var dt = Math.min(0.25, Math.max(0, (now - last) / 1000));
    last = now;
    acc += dt;
    while(acc >= STEP){ update(STEP); acc -= STEP; }
    render();
  }

  // ---------- input ----------
  function press(){
    ensureAudio();
    if(state === 'ready'){ startGame(); flap(); }
    else if(state === 'playing'){ flap(); }
    else if(state === 'paused'){ resume(); }
  }

  stage.addEventListener('pointerdown', function(e){
    if(e.target.closest('button, a')) return;
    if(e.pointerType === 'mouse' && e.button !== 0) return;
    e.preventDefault();
    press();
  });

  stage.addEventListener('contextmenu', function(e){ e.preventDefault(); });

  window.addEventListener('keydown', function(e){
    var k = e.key;
    // a focused button or link handles its own Space/Enter
    if(e.target && (e.target.tagName === 'BUTTON' || e.target.tagName === 'A') && (k === ' ' || k === 'Enter')) return;

    if(k === ' ' || k === 'Spacebar' || k === 'ArrowUp' || k === 'w' || k === 'W'){
      e.preventDefault();
      if(e.repeat) return;              // holding the key shouldn't machine-gun flaps
      if(state === 'over') tryRestart();
      else press();
    } else if(k === 'Enter'){
      if(state === 'over'){ e.preventDefault(); tryRestart(); }
    } else if(k === 'p' || k === 'P' || k === 'Escape'){
      if(state === 'playing') pause();
      else if(state === 'paused') resume();
    } else if(k === 'm' || k === 'M'){
      toggleMute();
    }
  });

  againBtn.addEventListener('click', function(){ tryRestart(); againBtn.blur(); });
  muteBtn.addEventListener('click', function(){ ensureAudio(); toggleMute(); muteBtn.blur(); });

  document.addEventListener('visibilitychange', function(){ if(document.hidden) pause(); });
  window.addEventListener('blur', pause);
  window.addEventListener('resize', resize);

  // ---------- go ----------
  best = parseInt(load('flappy.best', '0'), 10) || 0;
  renderMute();
  toReady();
  resize();
  requestAnimationFrame(frame);

})();
</script>

<script>
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('../sw.js').catch(function(){});
</script>
