<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#83d85e">
<title>Hoppy Road</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Lilita+One&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#24322a;
    --font:'Fredoka', ui-rounded, 'SF Pro Rounded', 'Nunito', 'Segoe UI', system-ui, sans-serif;
    --display:'Lilita One', 'Fredoka', 'Arial Black', system-ui, sans-serif;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html,body{
    margin:0;
    height:100%;
    overflow:hidden;
    overscroll-behavior:none;
    background:#83d85e;
    color:#fff;
    font-family:var(--font);
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
  }

  #c{ position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  button{ font-family:var(--font); }

  /* ---- HUD ---- */
  .hud{
    position:fixed;
    top:0;
    left:0;
    right:0;
    z-index:5;
    display:flex;
    align-items:flex-start;
    gap:8px;
    padding:10px;
    padding-top:max(10px, env(safe-area-inset-top));
    pointer-events:none;
  }
  .hud > *{ pointer-events:auto; }
  .back{
    flex:none;
    padding:9px 12px;
    border-radius:12px;
    background:rgba(20,40,20,0.3);
    color:#fff;
    font-weight:600;
    font-size:15px;
    text-decoration:none;
    white-space:nowrap;
  }
  .back:focus-visible{ outline:3px solid #fff; }
  .score{
    font:400 46px/1 var(--display);
    margin:0 0 0 6px;
    color:#fff;
    text-shadow:0 3px 0 rgba(0,0,0,0.25);
    pointer-events:none;
  }
  .score[hidden]{ display:none; }
  .spacer{ flex:1; }
  .coins{
    flex:none;
    display:flex;
    align-items:center;
    gap:6px;
    padding:6px 12px 6px 7px;
    border-radius:999px;
    background:rgba(20,40,20,0.3);
    font:600 18px var(--font);
  }
  .coin-ico{
    width:22px;
    height:22px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #fff6b0, #ffd21f 45%, #e0a800);
    box-shadow:inset 0 0 0 2px #c98f00;
    flex:none;
  }
  .round{ width:40px; height:40px; flex:none; border:none; border-radius:50%; background:rgba(20,40,20,0.3); color:#fff; font-size:17px; cursor:pointer; }
  .round:focus-visible{ outline:3px solid #fff; }

  /* ---- screens ---- */
  .screen{
    position:fixed;
    inset:0;
    z-index:10;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:14px;
    padding:80px 20px 30px;
    text-align:center;
    background:linear-gradient(180deg, rgba(0,0,0,0) 30%, rgba(0,0,0,0.28) 100%);
  }
  .screen[hidden]{ display:none; }
  .logo{
    margin:0 0 4px;
    font:400 clamp(56px, 15vw, 110px)/0.88 var(--display);
    color:#fff;
    text-shadow:0 5px 0 #2e8a3a, 0 12px 20px rgba(0,0,0,0.3);
    transform:rotate(-4deg);
  }
  .logo span{ color:#ffd21f; }
  .tagline{ margin:0; font-size:18px; font-weight:600; text-shadow:0 2px 0 rgba(0,0,0,0.25); }
  .keys{ margin:0; font-size:15px; font-weight:500; opacity:0.95; text-shadow:0 1px 0 rgba(0,0,0,0.3); }
  .best{ margin:0; font:400 20px var(--display); letter-spacing:0.5px; color:#fff6b0; text-shadow:0 2px 0 rgba(0,0,0,0.3); min-height:22px; }
  .row{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
  .btn{
    font:400 22px var(--display);
    letter-spacing:0.5px;
    border:none;
    border-radius:18px;
    padding:13px 28px;
    color:#fff;
    background:linear-gradient(180deg, #ffb13b, #ff7a1a);
    box-shadow:0 6px 0 #c2530a;
    cursor:pointer;
    text-shadow:0 2px 0 rgba(0,0,0,0.2);
    transition:transform .08s ease;
  }
  .btn:active{ transform:translateY(4px); box-shadow:0 2px 0 #c2530a; }
  .btn:focus-visible{ outline:3px solid #fff; outline-offset:3px; }
  .btn.green{ background:linear-gradient(180deg, #6bd968, #2fae4a); box-shadow:0 6px 0 #1f7a33; }
  .btn.green:active{ box-shadow:0 2px 0 #1f7a33; }
  .btn.blue{ background:linear-gradient(180deg, #5ec8ff, #3a86ff); box-shadow:0 6px 0 #2459b8; }
  .btn.blue:active{ box-shadow:0 2px 0 #2459b8; }
  .btn.small{ font-size:18px; padding:10px 20px; }

  .card{
    width:min(100%, 390px);
    max-height:100%;
    overflow:auto;
    padding:20px 18px 20px;
    border-radius:26px;
    background:#fffaf0;
    color:var(--ink);
    box-shadow:0 20px 50px rgba(0,0,0,0.3);
    animation:pop .4s cubic-bezier(.2,.9,.3,1.3);
  }
  @keyframes pop{ from{ transform:scale(0.85); opacity:0; } to{ transform:none; opacity:1; } }
  .card h2{ margin:0 0 6px; font:400 30px var(--display); color:#ff7a1a; letter-spacing:0.5px; }
  .big{ font:400 64px/1 var(--display); color:var(--ink); margin:4px 0; }
  .label{ font-size:14px; font-weight:600; letter-spacing:2px; text-transform:uppercase; opacity:0.55; }
  .newbest{ display:inline-block; margin:6px 0 2px; padding:4px 12px; border-radius:999px; background:#ffd21f; color:#6b4b00; font:400 16px var(--display); letter-spacing:0.5px; animation:wiggle .6s ease-in-out infinite alternate; }
  .newbest[hidden]{ display:none; }
  @keyframes wiggle{ from{ transform:rotate(-4deg); } to{ transform:rotate(4deg) scale(1.05); } }
  .earned{ display:flex; align-items:center; justify-content:center; gap:6px; margin:8px 0 16px; font-size:17px; font-weight:600; }

  .chars{ display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; margin:12px 0 16px; }
  .char{
    border:3px solid transparent;
    border-radius:18px;
    background:#efe6d2;
    padding:8px 4px 8px;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
    font:600 14px var(--font);
    color:var(--ink);
    transition:transform .1s ease;
  }
  .char:active{ transform:scale(0.96); }
  .char canvas{ width:74px; height:74px; }
  .char .price{ display:flex; align-items:center; gap:4px; font-size:13px; min-height:18px; }
  .char .price .coin-ico{ width:15px; height:15px; box-shadow:inset 0 0 0 1.5px #c98f00; }
  .char.sel{ border-color:#ff7a1a; background:#ffe3c4; }
  .char.locked canvas{ filter:grayscale(0.9) brightness(0.75); }
  .char:focus-visible{ outline:3px solid #3a86ff; }
  .shake{ animation:shake .35s ease; }
  @keyframes shake{ 25%{ transform:translateX(-6px); } 75%{ transform:translateX(6px); } }
  .balance{ display:inline-flex; align-items:center; gap:6px; font-size:17px; font-weight:600; }

  @media (max-width:520px){
    .score{ font-size:40px; }
    .back{ padding:9px 10px; font-size:14px; }
    .round{ width:36px; height:36px; }
  }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div class="hud">
  <a class="back" href="../" aria-label="Back to games">&lsaquo; Games</a>
  <div class="score" id="score" hidden>0</div>
  <div class="spacer"></div>
  <div class="coins" aria-label="Coins"><span class="coin-ico"></span><span id="coins">0</span></div>
  <button type="button" class="round" id="mute" aria-label="Sound on" aria-pressed="false">🔊</button>
</div>

<div class="screen" id="title">
  <h1 class="logo">Hoppy<br><span>Road</span></h1>
  <p class="tagline">Hop across roads, rivers and train tracks!</p>
  <div class="row">
    <button type="button" class="btn green" id="play">▶ Play</button>
    <button type="button" class="btn blue" id="t-chars">🐣 Characters</button>
  </div>
  <p class="keys">Tap or ↑ to hop · swipe or ← → ↓ to turn</p>
  <p class="best" id="t-best"></p>
</div>

<div class="screen" id="over" hidden>
  <div class="card">
    <h2 id="o-title">Oops!</h2>
    <div class="label">Score</div>
    <div class="big" id="o-score">0</div>
    <div class="newbest" id="o-new" hidden>★ NEW BEST! ★</div>
    <div class="label" id="o-best">Best 0</div>
    <div class="earned"><span class="coin-ico"></span><span id="o-coins">+0</span></div>
    <div class="row">
      <button type="button" class="btn green" id="again">↻ Play again</button>
      <button type="button" class="btn blue small" id="o-chars">🐣</button>
    </div>
  </div>
</div>

<div class="screen" id="shop" hidden>
  <div class="card">
    <h2>Characters</h2>
    <div class="balance"><span class="coin-ico"></span><span id="s-coins">0</span></div>
    <div class="chars" id="chars"></div>
    <button type="button" class="btn small" id="s-close">Done</button>
  </div>
</div>

<script>
(function(){
  'use strict';

  // ---------- helpers ----------
  function clamp(v, a, b){ return v < a ? a : v > b ? b : v; }
  function lerp(a, b, t){ return a + (b - a) * t; }
  function rnd(){ return Math.random(); }
  function pick(a){ return a[(Math.random() * a.length) | 0]; }
  function $(id){ return document.getElementById(id); }
  function load(k, d){ try { var v = localStorage.getItem(k); return v === null ? d : v; } catch(e){ return d; } }
  function save(k, v){ try { localStorage.setItem(k, v); } catch(e){} }
  // a steady "random" number for a square, so scenery doesn't flicker
  function hash(a, b){ var h = (a * 73856093) ^ (b * 19349663); h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }

  // ---------- sound ----------
  var actx = null, master = null, muted = load('hop.muted', '0') === '1', lastSfx = {}, noiseBuf = null;
  function audio(){
    if(!actx){
      var AC = window.AudioContext || window.webkitAudioContext;
      if(AC){
        try {
          actx = new AC();
          master = actx.createGain();
          master.gain.value = 0.7;
          master.connect(actx.destination);
        } catch(e){ actx = null; }
      }
    }
    if(actx && actx.state === 'suspended') actx.resume();
    return actx;
  }
  function gate(a, key, gap){
    if(!key) return true;
    if(lastSfx[key] !== undefined && a.currentTime - lastSfx[key] < gap) return false;
    lastSfx[key] = a.currentTime;
    return true;
  }
  function tone(f0, f1, dur, type, vol, delay, key, gap){
    if(muted) return;
    var a = audio();
    if(!a || !gate(a, key, gap || 0.04)) return;
    var t0 = a.currentTime + (delay || 0), o = a.createOscillator(), g = a.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t0);
    o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + dur + 0.05);
  }
  function noise(dur, vol, freq, key, gap){
    if(muted) return;
    var a = audio();
    if(!a || !gate(a, key, gap || 0.04)) return;
    if(!noiseBuf){
      noiseBuf = a.createBuffer(1, a.sampleRate * 2, a.sampleRate);
      var d = noiseBuf.getChannelData(0);
      for(var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    var src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain(), t0 = a.currentTime;
    src.buffer = noiseBuf;
    f.type = 'lowpass';
    f.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(master);
    src.start(t0, Math.random());
    src.stop(t0 + dur + 0.05);
  }
  var sfx = {
    hop:    function(){ tone(460, 720, 0.07, 'square', 0.03, 0, 'hop', 0.03); },
    bump:   function(){ tone(170, 110, 0.09, 'sine', 0.09, 0, 'bump', 0.12); },
    coin:   function(){ tone(988, 988, 0.06, 'square', 0.045); tone(1319, 1319, 0.14, 'square', 0.045, 0.06); },
    squash: function(){ noise(0.25, 0.3, 900); tone(170, 55, 0.3, 'sawtooth', 0.08); },
    splash: function(){ noise(0.55, 0.3, 1600); tone(520, 140, 0.35, 'sine', 0.07); },
    bell:   function(){ tone(1568, 1568, 0.13, 'triangle', 0.05, 0, 'bell', 0.28); },
    train:  function(){ noise(1.1, 0.22, 500, 'train', 1); tone(220, 180, 0.6, 'sawtooth', 0.03, 0, 'horn', 1); },
    eagle:  function(){ tone(1900, 900, 0.55, 'sawtooth', 0.045); tone(1500, 700, 0.55, 'square', 0.025, 0.06); },
    over:   function(){ [523, 440, 349, 262].forEach(function(f, i){ tone(f, f * 0.98, 0.25, 'triangle', 0.07, i * 0.13); }); },
    buy:    function(){ [523, 659, 784, 1047].forEach(function(f, i){ tone(f, f, 0.18, 'triangle', 0.07, i * 0.07); }); },
    click:  function(){ tone(700, 900, 0.05, 'triangle', 0.05); },
    nope:   function(){ tone(220, 160, 0.14, 'square', 0.05); }
  };

  var muteBtn = $('mute');
  function renderMute(){
    muteBtn.textContent = muted ? '🔈' : '🔊';
    muteBtn.setAttribute('aria-pressed', muted ? 'true' : 'false');
    muteBtn.setAttribute('aria-label', muted ? 'Sound off' : 'Sound on');
  }
  muteBtn.addEventListener('click', function(){
    muted = !muted;
    save('hop.muted', muted ? '1' : '0');
    renderMute();
    if(!muted) sfx.click();
    muteBtn.blur();
  });

  // ---------- blocky 3D-ish boxes ----------
  // (x, y) is the middle of the box's footprint on the ground; the top face is lifted by its height
  function box(c, x, y, w, d, h, top, front, lift){
    lift = lift || 0;
    var x0 = x - w / 2;
    c.fillStyle = front;
    c.fillRect(x0, y + d / 2 - h - lift, w, h);
    c.fillStyle = top;
    c.fillRect(x0, y - d / 2 - h - lift, w, d);
  }

  // ---------- characters ----------
  var CHARS = [
    { id: 'chicken', name: 'Chicken', price: 0 },
    { id: 'frog', name: 'Frog', price: 40 },
    { id: 'cat', name: 'Cat', price: 80 },
    { id: 'penguin', name: 'Penguin', price: 120 },
    { id: 'robot', name: 'Robot', price: 200 },
    { id: 'unicorn', name: 'Unicorn', price: 300 }
  ];

  // draws a character standing on (x, y); lift = hop height, sq < 1 = squashed.
  // face is the way it's heading: 'up' shows its back, 'down' its face, 'left'/'right' its side
  function drawChar(c, id, x, y, T, lift, sq, face){
    sq = sq || 1;
    var flat = sq < 1 ? 1 + (1 - sq) * 0.9 : 1;
    var w = T * 0.58 * flat, d = T * 0.44, h = T * 0.54 * sq;
    var view = face === 'up' ? 'back' : face === 'left' || face === 'right' ? 'side' : 'front';
    var s = face === 'left' ? -1 : 1;   // which way the nose points in side view
    var fy, ft, top, es = Math.max(sq, 0.3);
    function dims(){ fy = y + d / 2 - lift; ft = fy - h; top = ft - d; }
    dims();
    function rect(col, rx, ry, rw, rh){ c.fillStyle = col; c.fillRect(rx, ry, rw, rh); }
    // two eyes on the front of the body
    function eyes(col, y0, size, gap){
      var z = size * w;
      rect(col, x - w * gap - z / 2, y0, z, z * 1.1 * es);
      rect(col, x + w * gap - z / 2, y0, z, z * 1.1 * es);
    }
    // one eye near the nose end in side view
    function sideEye(col, y0, size, pos){ var z = size * w; rect(col, x + s * w * pos - z / 2, y0, z, z * 1.1 * es); }
    // something poking out past the nose end (beak, snout, nose) in side view
    function snout(col, yRel, hRel, len){
      rect(col, s > 0 ? x + w / 2 - 1 : x - w / 2 - len + 1, ft + h * yRel, len, h * hRel);
    }
    // a beak peeking over the far edge of the head in back view
    function nub(col, wRel){ rect(col, x - w * wRel / 2, top - T * 0.05, w * wRel, T * 0.07); }
    function feet(col){
      if(view === 'side') rect(col, x + s * w * 0.1 - w * 0.16, fy - 2, w * 0.32, T * 0.06);
      else { rect(col, x - w * 0.3, fy - 2, w * 0.16, T * 0.06); rect(col, x + w * 0.14, fy - 2, w * 0.16, T * 0.06); }
    }

    if(id === 'frog'){
      w *= 1.1; h *= 0.78; dims();
      var eh = T * 0.13 * sq, pupil = '#1d2b1d';
      // eyes sit on top of the head; the head is at whichever end it's facing
      var frogEye = function(ex, ey, look){
        box(c, ex, ey, w * 0.28, d * 0.36, eh, '#ffffff', '#dedede', lift + h);
        if(look !== null) rect(pupil, ex - w * 0.05 + look * w * 0.06, ey + d * 0.18 - eh - lift - h + eh * 0.2, w * 0.1, eh * 0.7);
      };
      box(c, x, y, w, d, h, '#7be05a', '#48b23a', lift);
      if(view === 'front'){
        frogEye(x - w * 0.3, y - d * 0.1, 0);
        frogEye(x + w * 0.3, y - d * 0.1, 0);
        rect('#2c6b24', x - w * 0.2, ft + h * 0.5, w * 0.4, Math.max(1, h * 0.08));
        rect('#ff9fb0', x - w * 0.42, ft + h * 0.35, w * 0.12, h * 0.14);
        rect('#ff9fb0', x + w * 0.3, ft + h * 0.35, w * 0.12, h * 0.14);
      } else if(view === 'back'){
        rect('#3a9a2f', x - w * 0.28, ft + h * 0.25, w * 0.14, h * 0.22);
        rect('#3a9a2f', x + w * 0.08, ft + h * 0.5, w * 0.12, h * 0.2);
        rect('#3a9a2f', x + w * 0.24, ft + h * 0.18, w * 0.1, h * 0.16);
        frogEye(x - w * 0.3, y - d * 0.3, null);
        frogEye(x + w * 0.3, y - d * 0.3, null);
      } else {
        frogEye(x + s * w * 0.22, y - d * 0.24, s);
        frogEye(x + s * w * 0.22, y + d * 0.14, s);
        rect('#2c6b24', s > 0 ? x + w * 0.05 : x - w * 0.5, ft + h * 0.52, w * 0.45, Math.max(1, h * 0.08));
        rect('#ff9fb0', x + s * w * 0.28 - w * 0.06, ft + h * 0.3, w * 0.12, h * 0.14);
      }
      return;
    }

    if(id === 'penguin'){
      feet('#ff9a1f');
      h *= 1.1; dims();
      box(c, x, y, w, d, h, '#2e3342', '#1e2230', lift);
      if(view === 'front'){
        rect('#f4f4f4', x - w * 0.3, ft + h * 0.2, w * 0.6, h * 0.78);
        eyes('#1e2230', ft + h * 0.28, 0.1, 0.16);
        rect('#ff9a1f', x - w * 0.09, ft + h * 0.46, w * 0.18, h * 0.12);
      } else if(view === 'back'){
        rect('#3a4052', x - w * 0.5, ft + h * 0.3, w * 0.1, h * 0.5);
        rect('#3a4052', x + w * 0.4, ft + h * 0.3, w * 0.1, h * 0.5);
        nub('#ff9a1f', 0.18);
      } else {
        rect('#f4f4f4', s > 0 ? x : x - w * 0.5, ft + h * 0.22, w * 0.5, h * 0.76);
        sideEye('#f4f4f4', ft + h * 0.12, 0.14, 0.3);
        sideEye('#1e2230', ft + h * 0.15, 0.07, 0.33);
        snout('#ff9a1f', 0.38, 0.12, T * 0.1);
        rect('#3a4052', x - s * w * 0.1 - w * 0.1, ft + h * 0.3, w * 0.2, h * 0.45);
      }
      return;
    }

    if(id === 'robot'){
      box(c, x, y, w, d, h, '#d4dde7', '#a3afbd', lift);
      var ax = view === 'side' ? x - s * w * 0.15 : x;
      c.strokeStyle = '#7c8896';
      c.lineWidth = Math.max(1.5, T * 0.03);
      c.beginPath(); c.moveTo(ax, top + d * 0.5); c.lineTo(ax, top + d * 0.5 - T * 0.26 * sq); c.stroke();
      c.fillStyle = (Math.floor(Date.now() / 400) % 2) ? '#ff4040' : '#ff9f9f';
      c.beginPath(); c.arc(ax, top + d * 0.5 - T * 0.28 * sq, T * 0.055, 0, Math.PI * 2); c.fill();
      if(view === 'front'){
        rect('#2b3445', x - w * 0.38, ft + h * 0.18, w * 0.76, h * 0.34);
        eyes('#3df2ff', ft + h * 0.25, 0.12, 0.18);
        rect('#7c8896', x - w * 0.25, ft + h * 0.66, w * 0.5, Math.max(1, h * 0.08));
      } else if(view === 'back'){
        rect('#8c98a7', x - w * 0.3, ft + h * 0.18, w * 0.6, h * 0.56);

      box(c, x + w * 0.34, y - d * 0.28, w * 0.2, d * 0.3, T * 0.12 * sq, orange, dark, lift + h);
      if(view === 'back'){

      eyes('#3a8f2e', ft + h * 0.22, 0.12, 0.2);

      box(c, x + s * w * 0.14, y - d * 0.05, w * 0.36, d * 0.3, T * 0.12 * sq, '#ff4040', '#d62828', lift + h);
      rect('#dcdcdc', x - s * w * 0.1 - w * 0.2, ft + h * 0.38, w * 0.4, h * 0.34);
      sideEye('#222222', ft + h * 0.2, 0.1, 0.28);
      snout('#ff9a1f', 0.38, 0.16, T * 0.12);
      snout('#ff4040', 0.54, 0.14, T * 0.05);
      return;
    }
    rect('#e6e6e6', x - w * 0.5 - T * 0.05, ft + h * 0.35, T * 0.06, h * 0.4);
    rect('#e6e6e6', x + w * 0.5 - T * 0.01, ft + h * 0.35, T * 0.06, h * 0.4);
    if(view === 'back'){
      box(c, x, y - d * 0.05, w * 0.26, d * 0.34, T * 0.12 * sq, '#ff4040', '#d62828', lift + h);
      // the beak just peeks out past the comb
      rect('#ff9a1f', x - w * 0.1, top - T * 0.14 * sq, w * 0.2, T * 0.06);

    }
    box(c, x, y - d * 0.05, w * 0.26, d * 0.34, T * 0.12 * sq, '#ff4040', '#d62828', lift + h);
    eyes('#222222', ft + h * 0.2, 0.1, 0.2);
    rect('#ff9a1f', x - w * 0.11, ft + h * 0.42, w * 0.22, h * 0.15);
    rect('#ff4040', x - w * 0.05, ft + h * 0.57, w * 0.1, h * 0.13);

  // ---------- the world ----------
  // 9 columns you can walk on; rows count upwards from the start (row 0)
  var COLS = 9, LOOP_MIN = -9, LOOP = COLS + 18;
  var rows = new Map(), genTop = -1, plan = [];
  var cam = 0;
  var CAR_COLORS = [['#ff5d5d', '#d33c3c'], ['#4d8dff', '#2f63cc'], ['#ffd23f', '#d9a800'], ['#b56dff', '#8a45d6'], ['#3fd6a0', '#22a878'], ['#ff9f43', '#d97a1c'], ['#ff7eb6', '#d9558e']];

  // how tough things are at a given row: 0 at the start, 1 by row 160
  function diff(r){ return clamp(r / 160, 0, 1); }

  function resetWorld(){
    rows = new Map();
    genTop = -1;
    plan = [];
    genUpTo(24);
  }

  function getRow(r){
    if(r > genTop) genUpTo(r + 16);
    var row = rows.get(r);
    if(!row){
      // behind the start is a wall of trees
      row = { r: r, type: 'grass', trees: {}, coins: {}, items: [] };
      for(var c = 0; c < COLS; c++) row.trees[c] = hash(r, c) < 0.8 ? 'tree' : 'rock';
      rows.set(r, row);
    }
    return row;
  }

  // a block is a breather of grass followed by something dangerous
  function planBlock(r){
    var q = [], i;
    if(r < 5){
      for(i = r; i < 5; i++) q.push({ type: 'grass', safe: 4 });
      return q;
    }
    var d = diff(r), safe = (rnd() * COLS) | 0, g = rnd() < 0.55 - d * 0.35 ? 2 : 1;
    for(i = 0; i < g; i++) q.push({ type: 'grass', safe: safe });
    var roll = rnd();
    if(roll < 0.46){
      var n = 1 + Math.floor(rnd() * (2 + d * 3));
      for(i = 0; i < n; i++) q.push({ type: 'road' });
    } else if(roll < 0.8){
      var m = 1 + Math.floor(rnd() * (1.6 + d * 2));
      for(i = 0; i < m; i++) q.push({ type: 'river' });
    } else {
      q.push({ type: 'rail' });
      if(d > 0.4 && rnd() < 0.4) q.push({ type: 'rail' });
    }
    return q;
  }

  function makeRow(r, spec){
    var d = diff(r), row = { r: r, type: spec.type, trees: {}, coins: {}, items: [], dir: rnd() < 0.5 ? -1 : 1, speed: 0 }, c, x;
    if(spec.type === 'grass'){
      // trees and rocks, but a clear lane is always left open so there's a way forward
      var density = r < 5 ? 0.12 : 0.16 + d * 0.14;
      for(c = 0; c < COLS; c++){
        if(Math.abs(c - spec.safe) < (r < 5 ? 2 : 1)) continue;
        if(rnd() < density) row.trees[c] = rnd() < 0.8 ? 'tree' : 'rock';
      }
      if(r > 2 && rnd() < 0.14){
        var free = [];
        for(c = 0; c < COLS; c++) if(!row.trees[c]) free.push(c);
        if(free.length) row.coins[pick(free)] = true;
      }
    } else if(spec.type === 'road'){
      row.speed = 1.3 + d * 2.4 + rnd() * 0.9;
      var truck = 0.18 + d * 0.15;
      x = LOOP_MIN + rnd() * 3;
      while(x < LOOP_MIN + LOOP - 3){
        var len = rnd() < truck ? 2 : 1;
        row.items.push({ x: x, len: len, color: pick(CAR_COLORS), kind: len > 1 ? 'truck' : 'car', honk: 0 });
        x += len + 2 + rnd() * (4.6 - d * 2);
      }
      if(rnd() < 0.12) row.coins[(rnd() * COLS) | 0] = true;
    } else if(spec.type === 'river'){
      if(d > 0.12 && rnd() < 0.2){
        // a row of still lily pads
        row.pads = {};
        var count = 0;
        for(c = 0; c < COLS; c++) if(rnd() < 0.45){ row.pads[c] = true; count++; }
        while(count < 3){ c = (rnd() * COLS) | 0; if(!row.pads[c]){ row.pads[c] = true; count++; } }
      } else {
        row.speed = 0.8 + d * 1.4 + rnd() * 0.5;
        x = LOOP_MIN + rnd() * 2;
        while(x < LOOP_MIN + LOOP - 2){
          var ll = Math.max(2, 2 + Math.floor(rnd() * (3 - d * 1.2)));
          row.items.push({ x: x, len: ll });
          x += ll + 1 + rnd() * (1.8 + d * 1.5);
        }
      }
    } else if(spec.type === 'rail'){
      row.timer = 1.5 + rnd() * 5;
      row.train = null;
      row.warn = false;
      row.bellT = 0;
    }
    return row;
  }

  function genUpTo(target){
    while(genTop < target){
      if(!plan.length) plan = planBlock(genTop + 1);
      genTop++;
      rows.set(genTop, makeRow(genTop, plan.shift()));
    }
  }

  function visibleRow(r){ return r > cam - 5 && r < cam + 12; }

  function updateRows(dt){
    rows.forEach(function(row, r){
      if(r < cam - 8 || r > cam + 22) return;
      if(row.items.length && row.type !== 'rail'){
        row.items.forEach(function(it){
          it.x += row.dir * row.speed * dt;
          if(it.x > LOOP_MIN + LOOP) it.x -= LOOP;
          else if(it.x + it.len < LOOP_MIN) it.x += LOOP;
        });
      } else if(row.type === 'rail'){
        if(row.train){
          row.train.x += row.dir * 24 * dt;
          if((row.dir > 0 && row.train.x > COLS + 12) || (row.dir < 0 && row.train.x + row.train.len < -12)){
            row.train = null;
            row.timer = 3 + rnd() * 6;
          }
        } else {
          row.timer -= dt;
          row.warn = row.timer < 1.3;
          if(row.warn && visibleRow(r) && state !== 'title'){
            row.bellT -= dt;
            if(row.bellT <= 0){ sfx.bell(); row.bellT = 0.35; }
          }
          if(row.timer <= 0){
            row.train = { x: row.dir > 0 ? -12 - 12 : COLS + 12, len: 12 };
            row.warn = false;
            if(visibleRow(r) && state !== 'title') sfx.train();
          }
        }
      }
    });
    // forget rows far behind
    rows.forEach(function(row, r){ if(r < cam - 14) rows.delete(r); });
  }

  // the player takes up the middle of a square, a bit narrower than it
  function hitOnRow(row, x){
    var a = x + 0.22, b = x + 0.78, i, it;
    if(row.type === 'road'){
      for(i = 0; i < row.items.length; i++){ it = row.items[i]; if(it.x < b && it.x + it.len > a) return true; }
    } else if(row.type === 'rail' && row.train){
      if(row.train.x < b && row.train.x + row.train.len > a) return true;
    }
    return false;
  }

  function logUnder(row, x){
    var c = x + 0.5;
    for(var i = 0; i < row.items.length; i++){
      var it = row.items[i];
      if(c >= it.x - 0.08 && c <= it.x + it.len + 0.08) return it;
    }
    return null;
  }

  // ---------- the screen ----------
  var cv = $('c'), cx = cv.getContext('2d');
  var W = 0, H = 0, DPR = 1, T = 40, OX = 0, AY = 0;

  // ---------- the player ----------
  var HOP = 0.12;
  var state = 'title';   // title | play | dying | over
  var P = null, creep = false, score = 0, runCoins = 0, deathT = 0, eagle = null, shake = 0, parts = [], ripples = [];

  function newPlayer(){
    return { x: 4, r: 0, fromX: 4, fromR: 0, toX: 4, toR: 0, t: 1, face: 'down', alive: true, onLog: null, sq: 1, sqV: 0, queue: null, death: null, bumpT: 0 };
  }

  function tryMove(dir){
    audio();
    if(state === 'title'){ startRun(); }
    if(state !== 'play' || !P.alive) return;
    if(P.t < 1){ P.queue = dir; return; }
    doMove(dir);
  }

  function doMove(dir){
    var dx = dir === 'left' ? -1 : dir === 'right' ? 1 : 0, dr = dir === 'up' ? 1 : dir === 'down' ? -1 : 0;
    var nr = P.r + dr, row = getRow(nr), nx = P.x + dx;
    var floating = row.type === 'river' && !row.pads;
    var lx = floating ? nx : Math.round(nx), col = Math.round(lx);
    P.face = dir;
    if(col < 0 || col > COLS - 1 || (row.type === 'grass' && row.trees[col])){
      P.bumpT = 0.15;
      P.sq = 0.85;
      sfx.bump();
      return;
    }
    P.fromX = P.x;
    P.fromR = P.r;
    P.toX = lx;
    P.toR = nr;
    P.t = 0;
    P.onLog = null;
    P.sq = 1.18;
    creep = true;
    sfx.hop();
  }

  function land(){
    P.x = P.toX;
    P.r = P.toR;
    P.sq = 0.78;
    var row = getRow(P.r), col = Math.round(P.x);
    if(row.type === 'river'){
      if(row.pads){
        if(!row.pads[col]){ die('drown'); return; }
        P.x = col;
      } else {
        var log = logUnder(row, P.x);
        if(!log){ die('drown'); return; }
        P.onLog = log;
      }
    }
    if(row.coins[col] && row.type !== 'river'){
      delete row.coins[col];
      runCoins++;
      sfx.coin();
      var q = screenOf(col, P.r);
      burst(q[0], q[1] - T * 0.5, ['#ffd21f', '#fff6b0', '#ffb300'], 10, 160);
      updateHud();
    }
    if(P.r > score){ score = P.r; updateHud(); }
    if(P.queue){ var nq = P.queue; P.queue = null; doMove(nq); }
  }

  function updatePlayer(dt){
    if(!P.alive) return;
    if(P.t < 1){
      P.t = Math.min(1, P.t + dt / HOP);
      if(P.t >= 1){ land(); if(!P.alive) return; }
    } else if(P.onLog){
      var lr = getRow(P.r);
      P.x += lr.dir * lr.speed * dt;
      if(P.x < -0.45 || P.x > COLS - 0.55){ die('drift'); return; }
    }
    // cars and trains
    var hopping = P.t < 1, curR = hopping && P.t < 0.5 ? P.fromR : (hopping ? P.toR : P.r);
    var curX = hopping ? lerp(P.fromX, P.toX, P.t) : P.x, row = getRow(curR);
    if(hitOnRow(row, curX)){ die(row.type === 'rail' ? 'train' : 'car'); return; }
    // dawdle too long and the eagle gets you
    if(P.r < cam - 3.4) die('eagle');
  }

  function die(kind){
    if(!P.alive) return;
    P.alive = false;
    P.death = kind;
    P.queue = null;
    deathT = 0;
    state = 'dying';
    var q = playerScreen();
    if(kind === 'car' || kind === 'train'){
      P.sq = 0.22;
      P.sqV = 0;
      shake = kind === 'train' ? 16 : 10;
      sfx.squash();
      burst(q[0], q[1] - T * 0.3, charBits(), 16, 260);
    } else if(kind === 'drown' || kind === 'drift'){
      sfx.splash();
      burst(q[0], q[1], ['#bfe9ff', '#ffffff', '#7fd0ff'], 18, 220);
      ripples.push({ x: P.t < 1 ? P.toX : P.x, r: P.t < 1 ? P.toR : P.r, t: 0 });
    } else if(kind === 'eagle'){
      sfx.eagle();
      eagle = { t: 0, px: q[0], py: q[1] };
    }
  }

  function charBits(){
    var id = currentChar();
    return id === 'frog' ? ['#7be05a', '#48b23a', '#ffffff'] : id === 'penguin' ? ['#2e3342', '#f4f4f4', '#ff9a1f'] :
      id === 'robot' ? ['#d4dde7', '#3df2ff', '#7c8896'] : id === 'cat' ? ['#ffb35c', '#f08a24', '#ffffff'] :
      id === 'unicorn' ? ['#ffffff', '#ff5d8f', '#5ec8ff', '#ffe14d'] : ['#ffffff', '#ff4040', '#ff9a1f'];
  }

  function updateCam(dt){
    var target = Math.max(P.r, cam);
    cam += (target - cam) * Math.min(1, dt * 5);
    if(creep && state === 'play') cam += (0.26 + diff(score) * 0.42) * dt;
  }

  function burst(x, y, colors, n, speed){
    for(var i = 0; i < n; i++){
      var a = rnd() * Math.PI * 2, sp = 40 + rnd() * (speed || 200);
      parts.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 120, t: 0.5 + rnd() * 0.5, color: pick(colors), s: 3 + rnd() * 4 });
    }
  }

  // ---------- controls ----------
  var KEYS = { arrowup: 'up', w: 'up', ' ': 'up', arrowdown: 'down', s: 'down', arrowleft: 'left', a: 'left', arrowright: 'right', d: 'right' };
  window.addEventListener('keydown', function(e){
    var k = e.key.toLowerCase(), dir = KEYS[k];
    if(dir && (k.indexOf('arrow') === 0 || k === ' ')) e.preventDefault();
    if(e.repeat) return;
    if(!$('shop').hidden) { if(k === 'escape') closeShop(); return; }
    if(state === 'over' && !$('over').hidden && (k === 'enter' || k === ' ')){ e.preventDefault(); startRun(); return; }
    if(dir) tryMove(dir);
  });

  var touch = null;
  cv.addEventListener('pointerdown', function(e){
    audio();
    touch = { id: e.pointerId, x: e.clientX, y: e.clientY };
    e.preventDefault();
  });
  cv.addEventListener('pointerup', function(e){
    if(!touch || e.pointerId !== touch.id) return;

    else tryMove(dy > 0 ? 'down' : 'up');
  });
  cv.addEventListener('pointercancel', function(){ touch = null; });

  // ---------- layout ----------
  function layout(){
    W = window.innerWidth;
    H = window.innerHeight;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.max(1, Math.round(W * DPR));
    cv.height = Math.max(1, Math.round(H * DPR));
    T = Math.round(clamp(Math.min(W / (COLS + 2), H / 12.5), 24, 84));
    OX = Math.round((W - COLS * T) / 2);
    AY = Math.round(H * 0.64);
  }
  window.addEventListener('resize', layout);

  function rowY(r){ return AY - (r - cam) * T; }
  function colX(c){ return OX + c * T; }
  function screenOf(c, r){ return [colX(c) + T / 2, rowY(r) + T / 2]; }
  function playerScreen(){
    var hop = P.t < 1, x = hop ? lerp(P.fromX, P.toX, P.t) : P.x, r = hop ? lerp(P.fromR, P.toR, P.t) : P.r;
    return [colX(x) + T / 2, rowY(r) + T / 2];
  }
  function playerRow(){ return P.t < 1 ? (P.t < 0.5 ? P.fromR : P.toR) : P.r; }

  // ---------- drawing the world ----------
  var clock = 0;

  function drawGround(row, y, cMin, cMax){
    var t = row.type, c;
    if(t === 'grass'){
      cx.fillStyle = (row.r & 1) ? '#8ee066' : '#86d85f';
      cx.fillRect(0, y, W, T + 1);
    } else if(t === 'road'){
      cx.fillStyle = '#585d6a';
      cx.fillRect(0, y, W, T + 1);
      var up = rows.get(row.r + 1), dn = rows.get(row.r - 1);
      if(up && up.type === 'road'){
        cx.fillStyle = 'rgba(255,255,255,0.75)';
        for(c = cMin; c <= cMax; c++) cx.fillRect(colX(c) + T * 0.25, y - T * 0.03, T * 0.5, T * 0.06);
      } else {
        cx.fillStyle = '#a3a9b5';
        cx.fillRect(0, y, W, T * 0.07);
      }
      if(!dn || dn.type !== 'road'){
        cx.fillStyle = '#43474f';
        cx.fillRect(0, y + T * 0.93, W, T * 0.07 + 1);
      }
    } else if(t === 'river'){
      cx.fillStyle = '#4db6ff';
      cx.fillRect(0, y, W, T + 1);
      var span = T * 3, off = ((clock * (row.speed || 0.4) * (row.dir || 1) * T) % span + span) % span;
      cx.fillStyle = 'rgba(255,255,255,0.22)';
      for(var xx = -span + off; xx < W; xx += span){
        cx.fillRect(xx, y + T * 0.28, T * 0.8, T * 0.06);
        cx.fillRect(xx + T * 1.5, y + T * 0.7, T * 0.6, T * 0.05);
      }
      var above = rows.get(row.r + 1);
      if(!above || above.type !== 'river'){
        cx.fillStyle = 'rgba(0,60,120,0.25)';
        cx.fillRect(0, y, W, T * 0.12);
      }
    } else if(t === 'rail'){
      cx.fillStyle = '#a08c76';
      cx.fillRect(0, y, W, T + 1);
      cx.fillStyle = '#6e5642';
      for(c = cMin; c <= cMax; c++){
        cx.fillRect(colX(c) + T * 0.14, y + T * 0.16, T * 0.16, T * 0.68);
        cx.fillRect(colX(c) + T * 0.64, y + T * 0.16, T * 0.16, T * 0.68);
      }
      cx.fillStyle = '#d3d8df';
      cx.fillRect(0, y + T * 0.3, W, T * 0.07);
      cx.fillRect(0, y + T * 0.62, W, T * 0.07);
    }
    // off-limits edges are a little darker
    cx.fillStyle = 'rgba(0,0,0,0.13)';
    cx.fillRect(0, y, OX, T + 1);
    cx.fillRect(OX + COLS * T, y, W - OX - COLS * T, T + 1);
  }

  function drawTree(x, gy, tall){
    cx.fillStyle = 'rgba(0,0,0,0.12)';
    cx.fillRect(x - T * 0.3, gy + T * 0.08, T * 0.8, T * 0.26);
    box(cx, x, gy + T * 0.12, T * 0.22, T * 0.18, T * 0.24, '#a26f3e', '#7c5230', 0);
    var ch = T * (tall ? 1.0 : 0.62);
    box(cx, x, gy, T * 0.8, T * 0.62, ch, '#6bd24e', '#43a738', T * 0.22);
    cx.fillStyle = 'rgba(255,255,255,0.2)';
    cx.fillRect(x - T * 0.3, gy - T * 0.31 - ch - T * 0.22 + T * 0.06, T * 0.26, T * 0.18);
  }

  function drawRock(x, gy){
    cx.fillStyle = 'rgba(0,0,0,0.12)';
    cx.fillRect(x - T * 0.26, gy + T * 0.06, T * 0.66, T * 0.2);
    box(cx, x, gy, T * 0.64, T * 0.5, T * 0.3, '#c9ccd3', '#999da6', 0);
  }

  function drawCar(it, dir, gy){
    var x0 = colX(it.x), len = it.len * T;
    cx.fillStyle = 'rgba(0,0,0,0.18)';
    cx.fillRect(x0 + T * 0.12, gy + T * 0.16, len - T * 0.14, T * 0.18);
    cx.fillStyle = '#23262d';
    cx.fillRect(x0 + T * 0.16, gy + T * 0.18, T * 0.22, T * 0.15);
    cx.fillRect(x0 + len - T * 0.38, gy + T * 0.18, T * 0.22, T * 0.15);
    var lead = dir > 0 ? x0 + len - T * 0.1 : x0 + T * 0.1;
    if(it.kind === 'truck'){
      var cabW = T * 0.62, boxW = len - cabW - T * 0.2;
      var cabX = dir > 0 ? x0 + len - T * 0.07 - cabW / 2 : x0 + T * 0.07 + cabW / 2;
      var boxX = dir > 0 ? x0 + T * 0.07 + boxW / 2 : x0 + len - T * 0.07 - boxW / 2;
      box(cx, boxX, gy, boxW, T * 0.7, T * 0.64, '#f7f4ee', '#d8d2c6', T * 0.08);
      box(cx, cabX, gy, cabW, T * 0.7, T * 0.44, it.color[0], it.color[1], T * 0.08);
      cx.fillStyle = '#bfe6ff';
      cx.fillRect(cabX - cabW * 0.3, gy + T * 0.35 - T * 0.52 + T * 0.06, cabW * 0.6, T * 0.14);
    } else {
      var bw = len - T * 0.14;
      box(cx, x0 + len / 2, gy, bw, T * 0.66, T * 0.3, it.color[0], it.color[1], T * 0.08);
      box(cx, x0 + len / 2 - dir * T * 0.06, gy - T * 0.02, bw * 0.56, T * 0.5, T * 0.2, '#e4f6ff', '#9fd4f2', T * 0.38);
    }
    cx.fillStyle = '#fff3a0';
    cx.fillRect(lead - T * 0.05, gy + T * 0.33 - T * 0.08 - T * 0.2, T * 0.1, T * 0.08);
  }

  function drawLog(it, gy){
    var x0 = colX(it.x), len = it.len * T, top = gy - T * 0.31 - T * 0.2;
    box(cx, x0 + len / 2, gy, len - T * 0.1, T * 0.62, T * 0.2, '#b37b45', '#7d5128', 0);
    cx.fillStyle = '#9a6536';
    cx.fillRect(x0 + T * 0.2, top + T * 0.18, len - T * 0.5, T * 0.05);
    cx.fillRect(x0 + T * 0.35, top + T * 0.4, len - T * 0.7, T * 0.05);
    cx.fillStyle = '#e0b07a';
    cx.fillRect(x0 + T * 0.05, top, T * 0.12, T * 0.62);
    cx.fillRect(x0 + len - T * 0.17, top, T * 0.12, T * 0.62);
  }

  function drawPad(x, gy, c){
    var bob = Math.sin(clock * 2 + c) * T * 0.02;
    cx.fillStyle = '#3f9e46';
    cx.beginPath(); cx.ellipse(x, gy + T * 0.04 + bob, T * 0.4, T * 0.3, 0, 0, Math.PI * 2); cx.fill();
    cx.fillStyle = '#62cc55';
    cx.beginPath(); cx.ellipse(x, gy + bob, T * 0.4, T * 0.3, 0, 0.35, Math.PI * 2 - 0.35); cx.lineTo(x, gy + bob); cx.fill();
  }

  function drawSignal(x, gy, row){
    box(cx, x, gy, T * 0.1, T * 0.1, T * 0.95, '#8a8f99', '#6c717a', 0);
    box(cx, x, gy - T * 0.02, T * 0.46, T * 0.14, T * 0.26, '#2b2f37', '#1d2027', T * 0.74);
    var on = row.warn && Math.floor(clock * 6) % 2, yl = gy + T * 0.05 - T * 0.74 - T * 0.13;
    cx.fillStyle = row.warn && on ? '#ff3b3b' : '#5a1d1d';
    cx.beginPath(); cx.arc(x - T * 0.11, yl, T * 0.07, 0, Math.PI * 2); cx.fill();
    cx.fillStyle = row.warn && !on ? '#ff3b3b' : '#5a1d1d';
    cx.beginPath(); cx.arc(x + T * 0.11, yl, T * 0.07, 0, Math.PI * 2); cx.fill();
  }

  function drawTrain(row, gy){
    var t = row.train, x0 = colX(t.x), dir = row.dir, cars = Math.round(t.len / 3);
    for(var k = 0; k < cars; k++){
      var sx = x0 + k * 3 * T, w = 3 * T - T * 0.14, mx = sx + 1.5 * T;
      var leadCar = dir > 0 ? k === cars - 1 : k === 0;
      box(cx, mx, gy, w, T * 0.74, T * 0.78, leadCar ? '#ffd23f' : '#ef5350', leadCar ? '#d9a800' : '#c53a38', T * 0.06);
      cx.fillStyle = '#c9ecff';
      for(var wv = 0; wv < 4; wv++) cx.fillRect(sx + T * 0.3 + wv * T * 0.66, gy + T * 0.37 - T * 0.06 - T * 0.58, T * 0.4, T * 0.2);
      cx.fillStyle = 'rgba(255,255,255,0.35)';
      cx.fillRect(sx + T * 0.07, gy + T * 0.37 - T * 0.06 - T * 0.2, w, T * 0.06);
    }
  }

  function drawCoin(x, gy, seed){
    var s = Math.abs(Math.cos(clock * 3 + seed)), r = T * 0.17, bob = Math.sin(clock * 4 + seed) * T * 0.04;
    cx.fillStyle = 'rgba(0,0,0,0.15)';
    cx.beginPath(); cx.ellipse(x, gy + T * 0.08, r * 0.9, r * 0.35, 0, 0, Math.PI * 2); cx.fill();
    cx.fillStyle = '#e0a800';
    cx.beginPath(); cx.ellipse(x, gy - T * 0.3 + bob, r * s + 1.5, r, 0, 0, Math.PI * 2); cx.fill();
    cx.fillStyle = '#ffd21f';
    cx.beginPath(); cx.ellipse(x, gy - T * 0.3 + bob, (r * s + 1.5) * 0.72, r * 0.72, 0, 0, Math.PI * 2); cx.fill();
  }

  function drawObjects(row, y, cMin, cMax){
    var gy = y + T * 0.5, c;
    if(row.type === 'grass'){
      for(c = cMin; c <= cMax; c++){
        var kind;
        if(c >= 0 && c < COLS) kind = row.trees[c];
        else { var hs = hash(row.r, c); kind = hs < 0.5 ? 'tree' : hs < 0.58 ? 'rock' : null; }
        if(kind === 'tree') drawTree(colX(c) + T / 2, gy, hash(c + 31, row.r) < 0.3);
        else if(kind === 'rock') drawRock(colX(c) + T / 2, gy);
      }
    } else if(row.type === 'road'){
      row.items.forEach(function(it){ if(colX(it.x + it.len) > -T && colX(it.x) < W + T) drawCar(it, row.dir, gy); });
    } else if(row.type === 'river'){
      if(row.pads){ for(c = 0; c < COLS; c++) if(row.pads[c]) drawPad(colX(c) + T / 2, gy, c); }
      else row.items.forEach(function(it){ if(colX(it.x + it.len) > -T && colX(it.x) < W + T) drawLog(it, gy); });
    } else if(row.type === 'rail'){
      drawSignal(colX(-1) + T / 2, gy, row);
      if(row.train) drawTrain(row, gy);
    }
    for(var k in row.coins) if(row.coins[k]) drawCoin(colX(+k) + T / 2, gy, +k + row.r);
  }

  function drawPlayer(){
    if(P.death === 'eagle' && eagle && eagle.t > 0.42) return;
    if((P.death === 'drown' || P.death === 'drift') && deathT > 0.1) return;
    var hop = P.t < 1, x = hop ? lerp(P.fromX, P.toX, P.t) : P.x, r = hop ? lerp(P.fromR, P.toR, P.t) : P.r;
    var lift = hop ? Math.sin(Math.PI * P.t) * T * 0.34 : 0;
    var sx = colX(x) + T / 2, gy = rowY(r) + T / 2;
    if(P.bumpT > 0){
      var f = P.face === 'left' ? -1 : P.face === 'right' ? 1 : 0;
      sx += f * Math.sin(P.bumpT * 40) * T * 0.05;
      gy -= (P.face === 'up' ? 1 : P.face === 'down' ? -1 : 0) * Math.sin(P.bumpT * 40) * T * 0.05;
    }
    cx.fillStyle = 'rgba(0,0,0,0.22)';
    cx.beginPath(); cx.ellipse(sx, gy + T * 0.14, T * 0.3 * (1 - lift / T * 0.5), T * 0.1, 0, 0, Math.PI * 2); cx.fill();
    drawChar(cx, currentChar(), sx, gy, T, lift, P.sq, P.face);
  }

  function drawEagle(x, y, t){
    var flap = Math.sin(t * 22) * 0.6;
    cx.save();
    cx.translate(x, y);
    cx.fillStyle = '#5b3a1e';
    cx.beginPath();
    cx.moveTo(-T * 0.2, 0); cx.lineTo(-T * 1.5, -T * 0.4 - flap * T * 0.6); cx.lineTo(-T * 0.9, T * 0.2); cx.closePath(); cx.fill();
    cx.beginPath();
    cx.moveTo(T * 0.2, 0); cx.lineTo(T * 1.5, -T * 0.4 - flap * T * 0.6); cx.lineTo(T * 0.9, T * 0.2); cx.closePath(); cx.fill();
    cx.fillStyle = '#7a5130';
    cx.beginPath(); cx.ellipse(0, 0, T * 0.42, T * 0.55, 0, 0, Math.PI * 2); cx.fill();
    cx.fillStyle = '#ffffff';
    cx.beginPath(); cx.arc(0, -T * 0.5, T * 0.26, 0, Math.PI * 2); cx.fill();
    cx.fillStyle = '#ffc21f';
    cx.beginPath(); cx.moveTo(-T * 0.08, -T * 0.42); cx.lineTo(T * 0.08, -T * 0.42); cx.lineTo(0, -T * 0.24); cx.closePath(); cx.fill();
    cx.fillStyle = '#222';
    cx.fillRect(-T * 0.13, -T * 0.58, T * 0.06, T * 0.07);
    cx.fillRect(T * 0.07, -T * 0.58, T * 0.06, T * 0.07);
    cx.restore();
  }

  function render(dt){
    clock += dt;
    cx.setTransform(DPR, 0, 0, DPR, 0, 0);
    cx.fillStyle = '#86d85f';
    cx.fillRect(0, 0, W, H);
    if(shake) cx.translate((rnd() - 0.5) * shake, (rnd() - 0.5) * shake);
    var rTop = Math.floor(cam + (AY + T) / T) + 3, rBot = Math.floor(cam - (H - AY) / T) - 1;
    var cMin = Math.floor(-OX / T) - 1, cMax = Math.ceil((W - OX) / T) + 1, r;
    for(r = rTop; r >= rBot; r--) drawGround(getRow(r), rowY(r), cMin, cMax);
    var pRow = playerRow();
    for(r = rTop; r >= rBot; r--){
      drawObjects(getRow(r), rowY(r), cMin, cMax);
      if(r === pRow) drawPlayer();
    }

    // ripples where you fell in
    ripples.forEach(function(rp){
      rp.t += dt;
      var q = screenOf(rp.x, rp.r);
      cx.strokeStyle = 'rgba(255,255,255,' + clamp(1 - rp.t, 0, 1).toFixed(2) + ')';
      cx.lineWidth = 3;
      for(var k = 0; k < 2; k++){
        var rr = T * (0.2 + rp.t * 0.7 + k * 0.2);
        cx.beginPath(); cx.ellipse(q[0], q[1], rr, rr * 0.45, 0, 0, Math.PI * 2); cx.stroke();
      }
    });
    ripples = ripples.filter(function(rp){ return rp.t < 1.2; });

    // the eagle swoops in, then flies off with you
    if(eagle){
      eagle.t += dt;
      var e = eagle, ex, ey;
      if(e.t < 0.42){
        var k1 = e.t / 0.42;
        ex = e.px + (1 - k1) * T * 2.5;
        ey = lerp(-T * 3, e.py - T * 0.7, k1 * (2 - k1));
      } else {
        var k2 = e.t - 0.42;
        ex = e.px - k2 * T * 2.5;
        ey = e.py - T * 0.7 - k2 * k2 * H * 1.4;
        drawChar(cx, currentChar(), ex, ey + T * 0.95, T, 0, 1, 'down');
      }
      drawEagle(ex, ey, e.t);
    }

    parts.forEach(function(p){
      p.t -= dt;
      p.vy += 700 * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      cx.globalAlpha = clamp(p.t / 0.3, 0, 1);
      cx.fillStyle = p.color;
      cx.fillRect(p.x - p.s / 2, p.y - p.s / 2, p.s, p.s);
    });
    cx.globalAlpha = 1;
    parts = parts.filter(function(p){ return p.t > 0; });
  }

  // ---------- coins and characters you own ----------
  var coins = +load('hop.coins', '0') || 0, owned;
  try { owned = JSON.parse(load('hop.owned', '["chicken"]')); } catch(e){ owned = null; }
  if(!Array.isArray(owned)) owned = [];
  if(owned.indexOf('chicken') < 0) owned.push('chicken');
  var chosen = load('hop.char', 'chicken');
  if(owned.indexOf(chosen) < 0) chosen = 'chicken';
  function currentChar(){ return chosen; }

  function updateHud(){
    $('score').textContent = score;
    $('coins').textContent = coins + (state === 'play' || state === 'dying' ? runCoins : 0);
  }

  // ---------- screens ----------
  function freshRun(){
    resetWorld();
    P = newPlayer();
    cam = 0;
    creep = false;
    score = 0;
    runCoins = 0;
    eagle = null;
    ripples = [];
    parts = [];
    shake = 0;
  }

  function showTitle(){
    freshRun();
    state = 'title';
    $('title').hidden = false;
    $('over').hidden = true;
    $('score').hidden = true;
    var best = +load('hop.best', '0') || 0;
    $('t-best').textContent = best ? '★ Best: ' + best : '';
    updateHud();
  }

  function startRun(){
    // the title screen already has a fresh world waiting
    if(state !== 'title') freshRun();
    state = 'play';
    $('title').hidden = true;
    $('over').hidden = true;
    $('shop').hidden = true;
    $('score').hidden = false;
    updateHud();
  }

  var DEATH_TITLES = { car: ['Splat!', 'Beep beep!', 'Squish!'], train: ['Choo choo!', 'Train!'], drown: ['Splash!', 'Glub glub!'], drift: ['Washed away!', 'Splash!'], eagle: ['Eagle got you!', 'Too slow!'] };

  function gameOver(){
    state = 'over';
    coins += runCoins;
    save('hop.coins', String(coins));
    var best = +load('hop.best', '0') || 0, isBest = score > best;
    if(isBest) save('hop.best', String(score));
    $('o-title').textContent = pick(DEATH_TITLES[P.death] || ['Oops!']);
    $('o-score').textContent = score;
    $('o-new').hidden = !isBest;
    $('o-best').textContent = 'Best ' + Math.max(best, score);
    $('o-coins').textContent = '+' + runCoins + (runCoins === 1 ? ' coin' : ' coins');
    runCoins = 0;
    updateHud();
    $('over').hidden = false;
    sfx.over();
    $('again').focus();
  }

  // ---------- the character shop ----------
  function openShop(){ renderShop(); $('shop').hidden = false; }
  function closeShop(){ $('shop').hidden = true; }

  function renderShop(){
    $('s-coins').textContent = coins;
    var grid = $('chars');
    grid.innerHTML = '';
    CHARS.forEach(function(ch){
      var have = owned.indexOf(ch.id) >= 0, b = document.createElement('button');
      b.type = 'button';
      b.className = 'char' + (chosen === ch.id ? ' sel' : '') + (have ? '' : ' locked');
      var cvs = document.createElement('canvas');
      cvs.width = 148;
      cvs.height = 148;
      var g = cvs.getContext('2d');
      g.fillStyle = '#bfe8a8';
      g.beginPath(); g.ellipse(74, 118, 56, 20, 0, 0, Math.PI * 2); g.fill();
      drawChar(g, ch.id, 74, 100, 100, 0, 1, 'down');
      var name = document.createElement('span'), price = document.createElement('span');
      name.textContent = ch.name;
      price.className = 'price';
      if(chosen === ch.id) price.textContent = '✓ Playing';
      else if(have) price.textContent = 'Owned';
      else {
        var ico = document.createElement('span');
        ico.className = 'coin-ico';
        price.appendChild(ico);
        price.appendChild(document.createTextNode(ch.price));
      }
      b.appendChild(cvs);
      b.appendChild(name);
      b.appendChild(price);
      b.setAttribute('aria-label', ch.name + (have ? '' : ', costs ' + ch.price + ' coins'));
      b.addEventListener('click', function(){ chooseChar(ch, b, price); });
      grid.appendChild(b);
    });
  }

  function chooseChar(ch, b, price){
    if(owned.indexOf(ch.id) < 0){
      if(coins < ch.price){
        sfx.nope();
        b.classList.remove('shake');
        void b.offsetWidth;
        b.classList.add('shake');
        price.textContent = 'Need ' + (ch.price - coins) + ' more';
        return;
      }
      coins -= ch.price;
      owned.push(ch.id);
      save('hop.coins', String(coins));
      save('hop.owned', JSON.stringify(owned));
      sfx.buy();
    } else sfx.click();
    chosen = ch.id;
    save('hop.char', chosen);
    renderShop();
    updateHud();
  }

  $('play').addEventListener('click', function(){ sfx.click(); startRun(); this.blur(); });
  $('title').addEventListener('click', function(e){ if(e.target === this) tryMove('up'); });
  $('t-chars').addEventListener('click', function(){ sfx.click(); openShop(); });
  $('again').addEventListener('click', function(){ sfx.click(); startRun(); });
  $('o-chars').addEventListener('click', function(){ sfx.click(); openShop(); });
  $('s-close').addEventListener('click', function(){ sfx.click(); closeShop(); });

  // ---------- the loop ----------
  function step(dt){
    if(W <= 0 || H <= 0) return;
    updateRows(dt);
    if(state === 'play'){ updatePlayer(dt); updateCam(dt); }
    else if(state === 'dying'){
      deathT += dt;
      if(deathT > (P.death === 'eagle' ? 1.6 : 1.0)) gameOver();
    }
    // a little squash-and-stretch on every hop (but a flattened chicken stays flat)
    if(P.alive || (P.death !== 'car' && P.death !== 'train')){
      P.sqV += (1 - P.sq) * 260 * dt;
      P.sqV *= Math.exp(-14 * dt);
      P.sq += P.sqV * dt;
    }
    if(P.bumpT > 0) P.bumpT -= dt;
    shake *= Math.exp(-dt * 9);
    if(shake < 0.4) shake = 0;
    render(dt);
  }

  var last = 0;
  function frame(now){
    requestAnimationFrame(frame);
    var dt = last ? Math.min(0.05, (now - last) / 1000) : 0.016;
    last = now;
    step(dt);
  }

  // ---------- go! ----------
  renderMute();
  layout();
  showTitle();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
