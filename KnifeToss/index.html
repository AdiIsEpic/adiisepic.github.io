<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#23283d">
<title>Knife Toss</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Lilita+One&display=swap" rel="stylesheet">
<style>
  :root{ --font:'Fredoka', ui-rounded, 'Segoe UI', system-ui, sans-serif; --display:'Lilita One', 'Fredoka', system-ui, sans-serif; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; overflow:hidden; overscroll-behavior:none; background:#23283d; color:#fff; font-family:var(--font); -webkit-user-select:none; user-select:none; }
  #c{ position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:pointer; }
  .hud{ position:fixed; top:0; left:0; right:0; z-index:5; display:flex; align-items:center; gap:8px; padding:10px; padding-top:max(10px, env(safe-area-inset-top)); pointer-events:none; }
  .hud > *{ pointer-events:auto; }
  .back{ padding:8px 12px; border-radius:12px; background:rgba(255,255,255,0.1); color:#fff; font-weight:600; font-size:15px; text-decoration:none; white-space:nowrap; }
  .stat{ padding:4px 12px; border-radius:14px; background:rgba(255,255,255,0.1); text-align:center; line-height:1.05; min-width:60px; }
  .stat small{ display:block; font-size:10px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; opacity:0.75; }
  .stat b{ font:400 22px var(--display); }
  .spacer{ flex:1; }
  .round{ width:40px; height:40px; border:none; border-radius:50%; background:rgba(255,255,255,0.1); color:#fff; font-size:17px; cursor:pointer; flex:none; }
  .overlay{ position:fixed; inset:0; z-index:10; display:flex; align-items:center; justify-content:center; padding:16px; background:rgba(10,12,25,0.55); }
  .overlay[hidden]{ display:none; }
  .card{ width:min(100%, 350px); padding:24px 20px; border-radius:26px; text-align:center; background:#fff7ec; color:#3a2a1a; box-shadow:0 20px 50px rgba(0,0,0,0.45); animation:pop .35s cubic-bezier(.2,.9,.3,1.3); }
  @keyframes pop{ from{ transform:scale(0.85); opacity:0; } }
  .card h1{ margin:0 0 8px; font:400 42px var(--display); color:#c0662a; }
  .card p{ margin:0 0 14px; font-size:16px; line-height:1.4; opacity:0.85; }
  .card .big{ font:400 56px/1 var(--display); color:#e0483b; margin:0 0 8px; }
  .card .best{ color:#b07a00; font-weight:700; opacity:1; }
  .btn{ font:400 22px var(--display); border:none; border-radius:18px; padding:13px 32px; color:#fff; cursor:pointer; background:linear-gradient(180deg, #ff8a4c, #e0572b); box-shadow:0 6px 0 #a63a17; }
  .btn:active{ transform:translateY(4px); box-shadow:0 2px 0 #a63a17; }
  .btn:focus-visible, .round:focus-visible, .back:focus-visible{ outline:3px solid #fff; outline-offset:2px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">
  <a class="back" href="../" aria-label="Back to games">&lsaquo; Games</a>
  <div class="spacer"></div>
  <div class="stat"><small>Score</small><b id="score">0</b></div>
  <div class="stat"><small>🍎</small><b id="apples">0</b></div>
  <div class="spacer"></div>
  <button type="button" class="round" id="mute" aria-label="Sound on">🔊</button>
</div>
<div class="overlay" id="ov">
  <div class="card">
    <h1 id="ov-title">Knife Toss</h1>
    <div class="big" id="ov-score" hidden>0</div>
    <p id="ov-text">Tap to throw knives into the spinning log. Don't hit another knife! Stick them all to break the log. Hit apples for bonus points.</p>
    <p class="best" id="ov-best"></p>
    <button type="button" class="btn" id="ov-btn">Play</button>
  </div>
</div>
<script>
(function(){
  'use strict';
  function $(id){ return document.getElementById(id); }
  function load(k, d){ try { var v = localStorage.getItem(k); return v === null ? d : v; } catch(e){ return d; } }
  function save(k, v){ try { localStorage.setItem(k, v); } catch(e){} }

  var actx = null, muted = load('knife.muted', '0') === '1';
  function tone(f0, f1, dur, type, vol, delay){
    if(muted) return;
    try {
      if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if(actx.state === 'suspended') actx.resume();
      var t0 = actx.currentTime + (delay || 0), o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(actx.destination); o.start(t0); o.stop(t0 + dur + 0.05);
    } catch(e){}
  }
  var muteBtn = $('mute');
  function renderMute(){ muteBtn.textContent = muted ? '🔈' : '🔊'; muteBtn.setAttribute('aria-label', muted ? 'Sound off' : 'Sound on'); }
  muteBtn.addEventListener('click', function(){ muted = !muted; save('knife.muted', muted ? '1' : '0'); renderMute(); muteBtn.blur(); });
  renderMute();

  var TAU = Math.PI * 2, HALF = Math.PI / 2;
  var cv = $('c'), cx = cv.getContext('2d'), W = 0, H = 0, DPR = 1, sc = 1, offX = 0, VH = 640;
  var LX = 180, LY = 250, R = 80, KL = 92, SINK = 20, GAP = 0.2;
  var state = 'menu', stage = 1, score = 0, apples = 0, best = +load('knife.best', '0') || 0;
  var rot = 0, t = 0, cfg = null, stuck = [], appleList = [], flying = [], falling = [], chips = [], left = 0, hitT = 0, clearT = 0, failT = 0, bannerT = 0;
  var ov = $('ov'), scoreEl = $('score'), applesEl = $('apples');

  function layout(){
    W = window.innerWidth; H = window.innerHeight; DPR = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.max(1, Math.round(W * DPR)); cv.height = Math.max(1, Math.round(H * DPR));
    sc = Math.max(0.3, Math.min(W / 360, H / 640)); offX = (W - 360 * sc) / 2; VH = H / sc;
    LY = Math.max(210, Math.min(VH * 0.36, 300));
  }
  window.addEventListener('resize', layout);
  layout();

  function rand(a, b){ return a + Math.random() * (b - a); }
  function angDiff(a, b){ var d = ((a - b) % TAU + TAU) % TAU; return d > Math.PI ? TAU - d : d; }
  function makeStage(n){
    var boss = n % 5 === 0;
    cfg = {
      boss: boss,
      knives: boss ? 9 : 5 + Math.min(4, Math.floor((n - 1) / 2)),
      pattern: n <= 2 ? 0 : boss ? (Math.random() < 0.5 ? 1 : 3) : Math.floor(Math.random() * 4),
      spd: Math.min(3.4, 1.7 + n * 0.08) * (Math.random() < 0.5 ? -1 : 1)
    };
    stuck = []; appleList = []; flying = []; falling = []; left = cfg.knives; rot = rand(0, TAU); t = 0;
    var pre = n === 1 ? 0 : Math.min(4, Math.floor(rand(0, 1.5 + n / 3)));
    var tries = 0;
    while(stuck.length < pre && tries++ < 200){
      var a = rand(0, TAU), ok = true;
      for(var i = 0; i < stuck.length; i++) if(angDiff(a, stuck[i].a) < 0.6) ok = false;
      if(ok) stuck.push({ a: a, pre: true });
    }
    var na = (Math.random() < 0.6 ? 1 : 0) + (boss ? 1 : 0);
    tries = 0;
    while(appleList.length < na && tries++ < 200){
      var b = rand(0, TAU), ok2 = true;
      for(i = 0; i < stuck.length; i++) if(angDiff(b, stuck[i].a) < 0.45) ok2 = false;
      for(i = 0; i < appleList.length; i++) if(angDiff(b, appleList[i].a) < 0.6) ok2 = false;
      if(ok2) appleList.push({ a: b });
    }
    bannerT = 1.2;
  }
  function speedNow(){
    var s = cfg.spd;
    if(cfg.pattern === 1) return s * 1.5 * Math.sin(t * 1.2);
    if(cfg.pattern === 2) return s * (0.35 + Math.abs(Math.sin(t * 1.6)) * 1.3);
    if(cfg.pattern === 3) return s * 1.2 * Math.max(-1, Math.min(1, Math.sin(t * 1.5) * 3));
    return s;
  }

  function startGame(){
    stage = 1; score = 0; apples = 0; chips = [];
    scoreEl.textContent = '0'; applesEl.textContent = '0';
    makeStage(stage); state = 'play'; ov.hidden = true;
  }
  function throwKnife(){
    if(state !== 'play' || left <= 0) return;
    left--;
    flying.push({ y: VH - 150 });
    tone(900, 500, 0.08, 'sine', 0.04);
  }
  function impact(k){
    var a = ((HALF - rot) % TAU + TAU) % TAU;
    for(var i = 0; i < stuck.length; i++){
      if(angDiff(a, stuck[i].a) < GAP){
        falling.push({ x: LX, y: LY + R + 10, vx: rand(-160, 160), vy: 380, r: 0, vr: rand(-12, 12) });
        fail(); return;
      }
    }
    stuck.push({ a: a });
    score++; scoreEl.textContent = String(score);
    hitT = 0.12;
    tone(220, 120, 0.08, 'square', 0.07);
    for(i = 0; i < 6; i++) chips.push({ x: LX + rand(-10, 10), y: LY + R, vx: rand(-150, 150), vy: rand(60, 220), life: 0.5, c: '#c98b4f', s: 4 });
    for(i = appleList.length - 1; i >= 0; i--){
      if(angDiff(a, appleList[i].a) < 0.24){
        var p = world(appleList[i].a, R + 12);
        for(var j = 0; j < 10; j++) chips.push({ x: p[0], y: p[1], vx: rand(-200, 200), vy: rand(-250, 50), life: 0.8, c: j % 2 ? '#ff4d4d' : '#fff2c8', s: 6 });
        appleList.splice(i, 1); apples++; score += 2;
        applesEl.textContent = String(apples); scoreEl.textContent = String(score);
        tone(1000, 1600, 0.12, 'triangle', 0.06);
      }
    }
    if(left === 0 && flying.length === 0) clearStage();
  }
  function world(a, r){ var th = a + rot; return [LX + Math.cos(th) * r, LY + Math.sin(th) * r]; }
  function clearStage(){
    state = 'clear'; clearT = 0;
    for(var i = 0; i < 30; i++){ var an = rand(0, TAU), sp = rand(100, 380); chips.push({ x: LX + Math.cos(an) * R * 0.6, y: LY + Math.sin(an) * R * 0.6, vx: Math.cos(an) * sp, vy: Math.sin(an) * sp - 120, life: 1.1, c: cfg.boss ? (i % 2 ? '#ffd23f' : '#ff6b3d') : (i % 2 ? '#b9773f' : '#e0a56a'), s: rand(5, 11) }); }
    for(i = 0; i < stuck.length; i++){ var th = stuck[i].a + rot; falling.push({ x: LX + Math.cos(th) * (R + 20), y: LY + Math.sin(th) * (R + 20), vx: Math.cos(th) * 260, vy: Math.sin(th) * 260 - 150, r: th - HALF, vr: rand(-8, 8) }); }
    stuck = []; appleList = [];
    tone(523, 1047, 0.2, 'triangle', 0.07); tone(784, 1568, 0.25, 'triangle', 0.05, 0.1);
  }
  function fail(){
    state = 'fail'; failT = 0; flying = [];
    tone(400, 90, 0.35, 'sawtooth', 0.08);
    if(score > best){ best = score; save('knife.best', String(best)); }
  }
  function showOver(){
    state = 'over';
    $('ov-title').textContent = stage >= 10 ? 'Knife master!' : stage >= 5 ? 'Sharp!' : 'Clang!';
    $('ov-score').hidden = false; $('ov-score').textContent = String(score);
    $('ov-text').textContent = 'You reached stage ' + stage + ' and hit ' + apples + ' apple' + (apples === 1 ? '' : 's') + '.';
    $('ov-best').textContent = (score === best && score > 0 ? 'New best! ' : 'Best: ') + best;
    $('ov-btn').textContent = 'Play again';
    ov.hidden = false;
  }

  function step(dt){
    var i;
    for(i = chips.length - 1; i >= 0; i--){ var c = chips[i]; c.life -= dt; c.x += c.vx * dt; c.y += c.vy * dt; c.vy += 700 * dt; if(c.life <= 0) chips.splice(i, 1); }
    for(i = falling.length - 1; i >= 0; i--){ var f = falling[i]; f.x += f.vx * dt; f.y += f.vy * dt; f.vy += 1400 * dt; f.r += f.vr * dt; if(f.y > VH + 200) falling.splice(i, 1); }
    if(hitT > 0) hitT -= dt;
    if(bannerT > 0) bannerT -= dt;
    if(!cfg) return;
    if(state === 'play' || state === 'fail'){ t += dt; rot += speedNow() * dt; }
    if(state === 'play'){
      for(i = flying.length - 1; i >= 0; i--){
        var k = flying[i]; k.y -= 2600 * dt;
        if(k.y <= LY + R){ flying.splice(i, 1); impact(k); if(state !== 'play') return; }
      }
    } else if(state === 'clear'){
      clearT += dt;
      if(clearT > 1){ stage++; makeStage(stage); state = 'play'; }
    } else if(state === 'fail'){
      failT += dt; if(failT > 1.1) showOver();
    }
  }

  function knife(x, y, ang, alpha){
    cx.save(); cx.translate(x, y); cx.rotate(ang); cx.globalAlpha = alpha == null ? 1 : alpha;
    cx.fillStyle = '#e8edf5';
    cx.beginPath(); cx.moveTo(0, 0); cx.quadraticCurveTo(7, 10, 7, 30); cx.lineTo(7, 54); cx.lineTo(-6, 54); cx.lineTo(-6, 12); cx.quadraticCurveTo(-5, 4, 0, 0); cx.fill();
    cx.fillStyle = '#b9c3d3'; cx.fillRect(-6, 14, 3.5, 40);
    cx.fillStyle = '#5a5f6e'; cx.fillRect(-10, 54, 20, 6);
    cx.fillStyle = '#7b3f1e'; cx.beginPath(); cx.moveTo(-6, 60); cx.lineTo(6, 60); cx.lineTo(7, 88); cx.quadraticCurveTo(0, 94, -7, 88); cx.closePath(); cx.fill();
    cx.fillStyle = '#9c5a30'; cx.fillRect(-3, 64, 3, 22);
    cx.restore(); cx.globalAlpha = 1;
  }
  function drawLog(y){
    cx.save(); cx.translate(LX, y); cx.rotate(rot);
    if(cfg && cfg.boss){
      var cols = ['#ff6b3d', '#fff3d6', '#ff6b3d', '#fff3d6', '#ffd23f'];
      for(var i = 0; i < 5; i++){ cx.fillStyle = cols[i]; cx.beginPath(); cx.arc(0, 0, R * (1 - i * 0.19), 0, TAU); cx.fill(); }
      cx.strokeStyle = 'rgba(0,0,0,0.12)'; cx.lineWidth = 3; cx.beginPath(); cx.moveTo(-R, 0); cx.lineTo(R, 0); cx.stroke();
    } else {
      var g = cx.createRadialGradient(0, 0, 4, 0, 0, R);
      g.addColorStop(0, '#f2c58c'); g.addColorStop(0.8, '#d49558'); g.addColorStop(1, '#8a5325');
      cx.fillStyle = g; cx.beginPath(); cx.arc(0, 0, R, 0, TAU); cx.fill();
      cx.strokeStyle = 'rgba(120,70,30,0.35)'; cx.lineWidth = 2;
      for(var r2 = 18; r2 < R - 8; r2 += 16){ cx.beginPath(); cx.arc(3, -2, r2, 0, TAU); cx.stroke(); }
      cx.strokeStyle = 'rgba(90,50,20,0.4)'; cx.lineWidth = 3;
      cx.beginPath(); cx.moveTo(10, 10); cx.lineTo(R * 0.7, R * 0.3); cx.moveTo(-14, -6); cx.lineTo(-R * 0.6, -R * 0.5); cx.stroke();
      cx.strokeStyle = '#6b3d18'; cx.lineWidth = 6; cx.beginPath(); cx.arc(0, 0, R - 3, 0, TAU); cx.stroke();
    }
    cx.restore();
  }
  function drawApple(x, y, ang){
    cx.save(); cx.translate(x, y); cx.rotate(ang + HALF);
    cx.fillStyle = '#ff4d4d'; cx.beginPath(); cx.arc(-5, 0, 11, 0, TAU); cx.arc(5, 0, 11, 0, TAU); cx.fill();
    cx.fillStyle = 'rgba(255,255,255,0.4)'; cx.beginPath(); cx.arc(-7, -4, 3.5, 0, TAU); cx.fill();
    cx.fillStyle = '#5b3a1e'; cx.fillRect(-1, -16, 2.5, 7);
    cx.fillStyle = '#5ccf5c'; cx.beginPath(); cx.ellipse(6, -14, 6, 3, -0.5, 0, TAU); cx.fill();
    cx.restore();
  }

  function render(){
    if(!W || !H) return;
    cx.setTransform(DPR, 0, 0, DPR, 0, 0);
    var g = cx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#2d3452'); g.addColorStop(1, '#171a29');
    cx.fillStyle = g; cx.fillRect(0, 0, W, H);
    cx.setTransform(DPR * sc, 0, 0, DPR * sc, DPR * offX, 0);
    if(!cfg) return;
    var i, y = LY - (hitT > 0 ? hitT * 40 : 0);
    // stage dots
    var g5 = Math.floor((stage - 1) / 5) * 5;
    for(i = 0; i < 5; i++){
      var n = g5 + i + 1, dx = LX - 48 + i * 24;
      cx.fillStyle = n === stage ? (n % 5 === 0 ? '#ff6b3d' : '#ffd23f') : n < stage ? 'rgba(255,210,63,0.5)' : 'rgba(255,255,255,0.18)';
      cx.beginPath(); cx.arc(dx, 84, n % 5 === 0 ? 7 : 5, 0, TAU); cx.fill();
    }
    cx.fillStyle = 'rgba(255,255,255,0.85)'; cx.font = '600 15px Fredoka, sans-serif'; cx.textAlign = 'center';
    cx.fillText(cfg.boss ? 'BOSS STAGE ' + stage : 'Stage ' + stage, LX, 112);
    if(state !== 'clear'){
      for(i = 0; i < stuck.length; i++){ var th = stuck[i].a + rot; knife(LX + Math.cos(th) * (R - SINK), y + Math.sin(th) * (R - SINK), th - HALF); }
      for(i = 0; i < appleList.length; i++){ var ta = appleList[i].a + rot; drawApple(LX + Math.cos(ta) * (R + 12), y + Math.sin(ta) * (R + 12), ta); }
      drawLog(y);
    }
    for(i = 0; i < flying.length; i++) knife(LX, flying[i].y, 0);
    if(state === 'play' && left > 0) knife(LX, VH - 150 + (flying.length ? 30 : 0), 0);
    for(i = 0; i < falling.length; i++){ var f = falling[i]; knife(f.x, f.y, f.r, 0.95); }
    for(i = 0; i < chips.length; i++){ var c = chips[i]; cx.globalAlpha = Math.max(0, Math.min(1, c.life * 2)); cx.fillStyle = c.c; cx.fillRect(c.x - c.s / 2, c.y - c.s / 2, c.s, c.s); }
    cx.globalAlpha = 1;
    // knives left
    for(i = 0; i < cfg.knives; i++){
      var kx = 22, ky = VH - 40 - i * 22;
      cx.fillStyle = i < left ? '#fff' : 'rgba(255,255,255,0.2)';
      cx.save(); cx.translate(kx, ky); cx.rotate(-Math.PI / 4);
      cx.fillRect(-2, -10, 4, 12); cx.fillRect(-3, 2, 6, 7);
      cx.restore();
    }
    if(bannerT > 0 && state === 'play'){
      cx.globalAlpha = Math.min(1, bannerT * 2); cx.fillStyle = cfg.boss ? '#ff6b3d' : '#ffd23f';
      cx.font = '400 34px "Lilita One", sans-serif';
      cx.fillText(cfg.boss ? 'BOSS!' : 'Stage ' + stage, LX, LY + R + 90);
      cx.globalAlpha = 1;
    }
  }

  var last = 0;
  function frame(ts){
    var dt = Math.min(0.033, Math.max(0, (ts - last) / 1000)); last = ts;
    step(dt); render();
    requestAnimationFrame(frame);
  }
  cv.addEventListener('pointerdown', function(e){ e.preventDefault(); throwKnife(); });
  $('ov-btn').addEventListener('click', startGame);
  window.addEventListener('keydown', function(e){
    if(e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'Enter'){
      e.preventDefault();
      if(e.repeat) return;
      if(state === 'play') throwKnife(); else if(!ov.hidden) startGame();
    }
  });

  makeStage(1);
  $('ov-best').textContent = best ? 'Best: ' + best : '';
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
