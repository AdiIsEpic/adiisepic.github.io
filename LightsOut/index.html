<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#141733">
<title>Lights Out</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Lilita+One&display=swap" rel="stylesheet">
<style>
  :root{ --font:'Fredoka', ui-rounded, 'Segoe UI', system-ui, sans-serif; --display:'Lilita One', 'Fredoka', system-ui, sans-serif; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; min-height:100%; background:radial-gradient(circle at 50% 30%, #262a5c, #141733 70%); color:#fff; font-family:var(--font); -webkit-user-select:none; user-select:none; }
  body{ display:flex; flex-direction:column; align-items:center; padding:10px 10px 20px; padding-top:max(10px, env(safe-area-inset-top)); min-height:100vh; }
  .hud{ width:min(100%, 480px); display:flex; align-items:center; gap:8px; }
  .back{ padding:8px 12px; border-radius:12px; background:rgba(255,255,255,0.1); color:#fff; font-weight:600; font-size:15px; text-decoration:none; white-space:nowrap; }
  .spacer{ flex:1; }
  h1{ margin:0; font:400 26px var(--display); color:#ffe066; text-shadow:0 0 16px rgba(255,224,102,0.5); white-space:nowrap; }
  .round{ width:40px; height:40px; border:none; border-radius:50%; background:rgba(255,255,255,0.1); color:#fff; font-size:17px; cursor:pointer; flex:none; }
  .bar{ width:min(100%, 480px); display:flex; align-items:center; justify-content:space-between; margin:14px 0 12px; gap:8px; }
  .lvnav{ display:flex; align-items:center; gap:6px; }
  .lvnav button{ width:34px; height:34px; border:none; border-radius:10px; background:rgba(255,255,255,0.1); color:#fff; font-size:18px; cursor:pointer; }
  .lvnav button:disabled{ opacity:0.25; cursor:default; }
  #lvl{ font:400 22px var(--display); min-width:92px; text-align:center; }
  .stat{ font-weight:600; font-size:15px; opacity:0.9; white-space:nowrap; }
  #grid{ --n:3; --size:min(92vw, calc(100vh - 250px), 460px); width:var(--size); height:var(--size); min-width:250px; min-height:250px; display:grid; grid-template-columns:repeat(var(--n),1fr); grid-template-rows:repeat(var(--n),1fr); gap:calc(var(--size) / var(--n) * 0.1); padding:calc(var(--size) / var(--n) * 0.1); background:#0d0f24; border-radius:22px; box-shadow:inset 0 0 0 2px rgba(255,255,255,0.05), 0 20px 50px rgba(0,0,0,0.4); }
  .light{ border:none; border-radius:22%; background:#262a4d; box-shadow:inset 0 -5px 0 rgba(0,0,0,0.3); cursor:pointer; position:relative; transition:background .18s, box-shadow .18s, transform .1s; padding:0; }
  .light.on{ background:radial-gradient(circle at 50% 40%, #fffbe0, #ffe066 45%, #ffb300); box-shadow:0 0 18px 4px rgba(255,210,60,0.6), inset 0 -5px 0 rgba(180,100,0,0.35); }
  .light:active{ transform:scale(0.94); }
  .light.hint::after{ content:''; position:absolute; inset:-5px; border-radius:26%; border:3px solid #6ff7ff; animation:pulse .8s ease-in-out infinite alternate; }
  @keyframes pulse{ from{ opacity:0.3; transform:scale(0.95); } to{ opacity:1; transform:scale(1.04); } }
  .light:focus-visible{ outline:3px solid #6ff7ff; outline-offset:2px; }
  .tools{ display:flex; gap:10px; margin-top:16px; }
  .tool{ font:600 16px var(--font); border:none; border-radius:14px; padding:10px 18px; background:rgba(255,255,255,0.12); color:#fff; cursor:pointer; }
  .tool:active{ transform:translateY(2px); }
  .overlay{ position:fixed; inset:0; z-index:10; display:flex; align-items:center; justify-content:center; padding:16px; background:rgba(10,10,30,0.55); }
  .overlay[hidden]{ display:none; }
  .card{ width:min(100%, 330px); padding:24px 20px; border-radius:26px; text-align:center; background:#fff; color:#141733; box-shadow:0 20px 50px rgba(0,0,0,0.45); animation:pop .35s cubic-bezier(.2,.9,.3,1.3); }
  @keyframes pop{ from{ transform:scale(0.85); opacity:0; } }
  .card h2{ margin:0 0 6px; font:400 36px var(--display); color:#f0a500; }
  .stars{ font-size:40px; letter-spacing:4px; margin:4px 0 8px; }
  .stars .off{ filter:grayscale(1); opacity:0.3; }
  .card p{ margin:0 0 14px; font-size:16px; }
  .btn{ font:400 21px var(--display); border:none; border-radius:18px; padding:12px 30px; color:#fff; cursor:pointer; background:linear-gradient(180deg, #ffcf3f, #f0a500); box-shadow:0 6px 0 #b07800; }
  .btn:active{ transform:translateY(4px); box-shadow:0 2px 0 #b07800; }
  button:focus-visible, .back:focus-visible{ outline:3px solid #6ff7ff; outline-offset:2px; }
</style>
</head>
<body>
<div class="hud">
  <a class="back" href="../" aria-label="Back to games">&lsaquo; Games</a>
  <div class="spacer"></div>
  <h1>Lights Out</h1>
  <div class="spacer"></div>
  <button type="button" class="round" id="mute" aria-label="Sound on">🔊</button>
</div>
<div class="bar">
  <div class="lvnav"><button type="button" id="prev" aria-label="Previous level">‹</button><div id="lvl">Level 1</div><button type="button" id="next" aria-label="Next level">›</button></div>
  <div class="stat" id="moves">Moves 0 · Best 0</div>
</div>
<div id="grid" role="grid" aria-label="Lights"></div>
<div class="tools">
  <button type="button" class="tool" id="restart">↺ Restart</button>
  <button type="button" class="tool" id="hint">💡 Hint</button>
</div>
<div class="overlay" id="ov" hidden>
  <div class="card">
    <h2>Lights out!</h2>
    <div class="stars" id="stars"></div>
    <p id="ov-text"></p>
    <button type="button" class="btn" id="ov-btn">Next level ›</button>
  </div>
</div>
<script>
(function(){
  'use strict';
  function $(id){ return document.getElementById(id); }
  function load(k, d){ try { var v = localStorage.getItem(k); return v === null ? d : v; } catch(e){ return d; } }
  function save(k, v){ try { localStorage.setItem(k, v); } catch(e){} }

  var actx = null, muted = load('lights.muted', '0') === '1';
  function tone(f0, f1, dur, type, vol, delay){
    if(muted) return;
    try {
      if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if(actx.state === 'suspended') actx.resume();
      var t0 = actx.currentTime + (delay || 0), o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(actx.destination); o.start(t0); o.stop(t0 + dur + 0.05);
    } catch(e){}
  }
  var muteBtn = $('mute');
  function renderMute(){ muteBtn.textContent = muted ? '🔈' : '🔊'; muteBtn.setAttribute('aria-label', muted ? 'Sound off' : 'Sound on'); }
  muteBtn.addEventListener('click', function(){ muted = !muted; save('lights.muted', muted ? '1' : '0'); renderMute(); muteBtn.blur(); });
  renderMute();

  function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function sizeFor(n){ return n <= 5 ? 3 : n <= 15 ? 4 : n <= 35 ? 5 : 6; }
  function startOf(s){ return s === 3 ? 1 : s === 4 ? 6 : s === 5 ? 16 : 36; }

  // Minimal set of presses that clears `cells` (GF(2) elimination + null-space search).
  function solveMin(cells, n){
    var N = n * n, rows = [], i, j, r, c;
    for(i = 0; i < N; i++){
      var row = new Array(N + 1).fill(0);
      r = (i / n) | 0; c = i % n;
      [[0, 0], [1, 0], [-1, 0], [0, 1], [0, -1]].forEach(function(d){
        var rr = r + d[0], cc = c + d[1];
        if(rr >= 0 && rr < n && cc >= 0 && cc < n) row[rr * n + cc] = 1;
      });
      row[N] = cells[i] ? 1 : 0;
      rows.push(row);
    }
    var pivotCol = [], rank = 0, where = new Array(N).fill(-1);
    for(c = 0; c < N && rank < N; c++){
      var p = -1;
      for(r = rank; r < N; r++) if(rows[r][c]){ p = r; break; }
      if(p < 0) continue;
      var tmp = rows[p]; rows[p] = rows[rank]; rows[rank] = tmp;
      for(r = 0; r < N; r++) if(r !== rank && rows[r][c]) for(j = 0; j <= N; j++) rows[r][j] ^= rows[rank][j];
      where[c] = rank; pivotCol.push(c); rank++;
    }
    for(r = rank; r < N; r++) if(rows[r][N]) return null;
    var free = [];
    for(c = 0; c < N; c++) if(where[c] < 0) free.push(c);
    var best = null, bestCount = Infinity, combos = free.length <= 10 ? 1 << free.length : 1;
    for(var mask = 0; mask < combos; mask++){
      var x = new Array(N).fill(0);
      for(j = 0; j < free.length; j++) x[free[j]] = (mask >> j) & 1;
      for(c = 0; c < N; c++){
        if(where[c] < 0) continue;
        var row2 = rows[where[c]], v = row2[N];
        for(j = 0; j < free.length; j++) if(row2[free[j]] && x[free[j]]) v ^= 1;
        x[c] = v;
      }
      var cnt = x.reduce(function(a, b){ return a + b; }, 0);
      if(cnt < bestCount){ bestCount = cnt; best = x; }
    }
    return best;
  }
  function makeLevel(lv){
    var n = sizeFor(lv), rnd = mulberry32(lv * 7919 + 104729), cells = new Array(n * n).fill(0);
    var presses = Math.min(Math.floor(n * n * 0.6), 3 + Math.floor((lv - startOf(n)) / 2) + (n - 3));
    var used = {};
    function pressAt(i){ var r = (i / n) | 0, c = i % n; [[0, 0], [1, 0], [-1, 0], [0, 1], [0, -1]].forEach(function(d){ var rr = r + d[0], cc = c + d[1]; if(rr >= 0 && rr < n && cc >= 0 && cc < n) cells[rr * n + cc] ^= 1; }); }
    var k = 0;
    while(k < presses){ var i = Math.floor(rnd() * n * n); if(used[i]) continue; used[i] = 1; pressAt(i); k++; }
    var guard = 0;
    while(cells.every(function(v){ return !v; }) && guard++ < 50){ pressAt(Math.floor(rnd() * n * n)); }
    var sol = solveMin(cells, n);
    return { n: n, cells: cells, par: sol ? sol.reduce(function(a, b){ return a + b; }, 0) : presses };
  }

  var prog = { level: 1, max: 1, stars: {} };
  try { var sv = JSON.parse(load('lights.progress', 'null')); if(sv && sv.level >= 1) prog = { level: sv.level | 0, max: Math.max(sv.max | 0, sv.level | 0), stars: sv.stars || {} }; } catch(e){}
  var L = null, moves = 0, won = false, hintIdx = -1, gridEl = $('grid'), btns = [];

  function persist(){ save('lights.progress', JSON.stringify(prog)); }
  function startLevel(lv){
    prog.level = lv; persist();
    L = makeLevel(lv); moves = 0; won = false; hintIdx = -1;
    L.start = L.cells.slice();
    gridEl.style.setProperty('--n', L.n);
    gridEl.innerHTML = ''; btns = [];
    for(var i = 0; i < L.n * L.n; i++){
      var b = document.createElement('button'); b.type = 'button'; b.className = 'light';
      (function(idx){ b.addEventListener('click', function(){ press(idx); }); })(i);
      gridEl.appendChild(b); btns.push(b);
    }
    $('ov').hidden = true;
    render();
  }
  function press(i){
    if(won) return;
    var n = L.n, r = (i / n) | 0, c = i % n;
    [[0, 0], [1, 0], [-1, 0], [0, 1], [0, -1]].forEach(function(d){ var rr = r + d[0], cc = c + d[1]; if(rr >= 0 && rr < n && cc >= 0 && cc < n) L.cells[rr * n + cc] ^= 1; });
    moves++; hintIdx = -1;
    tone(L.cells[i] ? 660 : 440, L.cells[i] ? 880 : 330, 0.08, 'sine', 0.05);
    render();
    if(L.cells.every(function(v){ return !v; })) win();
  }
  function win(){
    won = true;
    var st = moves <= L.par ? 3 : moves <= Math.ceil(L.par * 1.6) + 1 ? 2 : 1;
    var key = String(prog.level);
    prog.stars[key] = Math.max(prog.stars[key] || 0, st);
    if(prog.level >= prog.max) prog.max = prog.level + 1;
    persist();
    [523, 659, 784, 1047].forEach(function(f, k){ tone(f, f, 0.18, 'triangle', 0.06, k * 0.09); });
    var s = '';
    for(var k = 0; k < 3; k++) s += k < st ? '⭐' : '<span class="off">⭐</span>';
    $('stars').innerHTML = s;
    $('ov-text').textContent = 'Solved in ' + moves + ' move' + (moves === 1 ? '' : 's') + ' (best possible: ' + L.par + ').';
    setTimeout(function(){ if(won) $('ov').hidden = false; }, 450);
  }
  function hint(){
    if(won) return;
    var sol = solveMin(L.cells, L.n);
    if(!sol) return;
    var opts = [];
    sol.forEach(function(v, i){ if(v) opts.push(i); });
    if(!opts.length) return;
    hintIdx = opts[0]; render();
    tone(900, 1200, 0.1, 'triangle', 0.04);
  }
  function render(){
    for(var i = 0; i < btns.length; i++){
      btns[i].classList.toggle('on', !!L.cells[i]);
      btns[i].classList.toggle('hint', i === hintIdx);
      btns[i].setAttribute('aria-label', 'Light ' + (i + 1) + (L.cells[i] ? ' on' : ' off'));
    }
    var st = prog.stars[String(prog.level)] || 0;
    $('lvl').textContent = 'Level ' + prog.level;
    $('moves').textContent = 'Moves ' + moves + ' · Par ' + L.par + (st ? ' · ' + '★'.repeat(st) : '');
    $('prev').disabled = prog.level <= 1;
    $('next').disabled = prog.level >= prog.max;
  }
  $('restart').addEventListener('click', function(){ L.cells = L.start.slice(); moves = 0; won = false; hintIdx = -1; $('ov').hidden = true; render(); });
  $('hint').addEventListener('click', hint);
  $('prev').addEventListener('click', function(){ if(prog.level > 1) startLevel(prog.level - 1); });
  $('next').addEventListener('click', function(){ if(prog.level < prog.max) startLevel(prog.level + 1); });
  $('ov-btn').addEventListener('click', function(){ startLevel(prog.level + 1); });
  startLevel(prog.level);
})();
</script>
</body>
</html>
