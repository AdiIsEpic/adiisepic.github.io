<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#7fd8d0">
<title>Memory Match</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Lilita+One&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#1f4b57; --font:'Fredoka', ui-rounded, 'Segoe UI', system-ui, sans-serif; --display:'Lilita One', 'Fredoka', system-ui, sans-serif; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; min-height:100%; background:linear-gradient(180deg, #9be8de 0%, #7fc8f0 100%); color:var(--ink); font-family:var(--font); -webkit-user-select:none; user-select:none; }
  body{ display:flex; flex-direction:column; align-items:center; min-height:100vh; min-height:100dvh; padding-bottom:20px; }
  button{ font-family:var(--font); color:var(--ink); }
  .top{ width:100%; display:flex; align-items:center; gap:8px; padding:10px; padding-top:max(10px, env(safe-area-inset-top)); }
  .chip{ background:rgba(255,255,255,0.8); border:none; border-radius:14px; box-shadow:0 3px 0 rgba(31,75,87,0.15); }
  .back{ padding:9px 12px; font-weight:600; font-size:15px; color:var(--ink); text-decoration:none; white-space:nowrap; }
  .spacer{ flex:1; }
  .level{ display:flex; align-items:center; padding:2px; }
  .level button{ width:34px; height:36px; border:none; background:none; font-size:22px; cursor:pointer; border-radius:10px; }
  .level button:disabled{ opacity:0.25; cursor:default; }
  .level b{ font:400 19px var(--display); min-width:84px; text-align:center; }
  .round{ width:40px; height:40px; border-radius:50%; font-size:17px; cursor:pointer; }
  .stats{ display:flex; gap:10px; margin:4px 0 12px; }
  .stat{ padding:6px 14px; border-radius:14px; background:rgba(255,255,255,0.75); text-align:center; min-width:78px; }
  .stat small{ display:block; font-size:11px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; opacity:0.6; }
  .stat b{ font:400 22px var(--display); }
  .board{ display:grid; gap:var(--gap); width:var(--bw); }
  .cardbtn{ position:relative; border:none; padding:0; background:none; aspect-ratio:3 / 4; cursor:pointer; perspective:700px; }
  .cardbtn:focus-visible{ outline:3px solid #fff; outline-offset:3px; border-radius:14px; }
  .inner{ position:absolute; inset:0; transform-style:preserve-3d; transition:transform .38s cubic-bezier(.2,.8,.3,1.25); }
  .cardbtn.up .inner, .cardbtn.done .inner{ transform:rotateY(180deg); }
  .face{ position:absolute; inset:0; border-radius:14px; display:flex; align-items:center; justify-content:center; -webkit-backface-visibility:hidden; backface-visibility:hidden; box-shadow:0 4px 0 rgba(31,75,87,0.18); }
  .back-face{ background:linear-gradient(135deg, #6c8bff, #b56dff); color:rgba(255,255,255,0.85); font:400 calc(var(--cw) * 0.42) var(--display); border:3px solid rgba(255,255,255,0.6); }
  .front-face{ background:#fff; transform:rotateY(180deg); font-size:calc(var(--cw) * 0.56); line-height:1; }
  .cardbtn.done .front-face{ background:#e6fff0; box-shadow:0 0 0 3px #5fd68a, 0 4px 0 rgba(31,75,87,0.18); animation:yay .5s ease; }
  .cardbtn.miss .front-face{ animation:nope .4s ease; }
  @keyframes yay{ 40%{ transform:rotateY(180deg) scale(1.12); } }
  @keyframes nope{ 25%{ transform:rotateY(180deg) translateX(-6px); } 75%{ transform:rotateY(180deg) translateX(6px); } }
  .combo{ position:fixed; left:50%; top:30%; transform:translate(-50%, -50%); font:400 44px var(--display); color:#ff5fa2; text-shadow:0 3px 0 #fff, 0 6px 14px rgba(0,0,0,0.2); pointer-events:none; animation:combo 1s ease forwards; z-index:6; white-space:nowrap; }
  @keyframes combo{ 0%{ opacity:0; transform:translate(-50%, -30%) scale(0.6); } 20%{ opacity:1; transform:translate(-50%, -50%) scale(1.1); } 80%{ opacity:1; } 100%{ opacity:0; transform:translate(-50%, -70%); } }
  .overlay{ position:fixed; inset:0; z-index:10; display:flex; align-items:center; justify-content:center; padding:16px; background:rgba(20,60,70,0.4); }
  .overlay[hidden]{ display:none; }
  .card{ width:min(100%, 360px); padding:24px 20px; border-radius:26px; text-align:center; background:#fffdf7; box-shadow:0 20px 50px rgba(0,0,0,0.3); animation:pop .35s cubic-bezier(.2,.9,.3,1.3); }
  @keyframes pop{ from{ transform:scale(0.85); opacity:0; } }
  .card h2{ margin:0 0 6px; font:400 32px var(--display); color:#6c5cff; }
  .card p{ margin:0 0 16px; font-size:17px; opacity:0.8; }
  .stars{ font-size:42px; letter-spacing:6px; }
  .stars i{ font-style:normal; color:rgba(31,75,87,0.15); }
  .stars i.on{ color:#ffc21f; text-shadow:0 0 14px rgba(255,190,0,0.6); }
  .row{ display:flex; gap:10px; justify-content:center; }
  .btn{ font:400 20px var(--display); border:none; border-radius:16px; padding:12px 24px; color:#fff; cursor:pointer; background:linear-gradient(180deg, #7b8cff, #5b5ce6); box-shadow:0 5px 0 #3d3eb0; }
  .btn.alt{ background:linear-gradient(180deg, #5fd6c9, #2fae9f); box-shadow:0 5px 0 #1f7f74; }
  .btn:active{ transform:translateY(3px); box-shadow:none; }
  .btn:focus-visible, .round:focus-visible, .back:focus-visible, .level button:focus-visible{ outline:3px solid #fff; outline-offset:2px; }
  .bit{ position:fixed; top:-20px; width:10px; height:14px; z-index:11; pointer-events:none; animation:fall linear forwards; }
  @keyframes fall{ to{ transform:translateY(110vh) rotate(720deg); } }
</style>
</head>
<body>
<div class="top">
  <a class="back chip" href="../" aria-label="Back to games">&lsaquo; Games</a>
  <div class="spacer"></div>
  <div class="level chip">
    <button type="button" id="prev" aria-label="Previous level">‹</button>
    <b id="lv">Level 1</b>
    <button type="button" id="next" aria-label="Next level">›</button>
  </div>
  <div class="spacer"></div>
  <button type="button" class="round chip" id="mute" aria-label="Sound on">🔊</button>
</div>
<div class="stats">
  <div class="stat"><small>Moves</small><b id="moves">0</b></div>
  <div class="stat"><small>Time</small><b id="time">0:00</b></div>
  <div class="stat"><small>Pairs</small><b id="pairs">0/0</b></div>
</div>
<div class="board" id="board"></div>
<div class="overlay" id="win" hidden>
  <div class="card">
    <div class="stars" id="stars"><i>★</i><i>★</i><i>★</i></div>
    <h2 id="win-title">Great memory!</h2>
    <p id="win-text"></p>
    <div class="row">
      <button type="button" class="btn alt" id="replay">Replay</button>
      <button type="button" class="btn" id="go-next">Next level ›</button>
    </div>
  </div>
</div>
<script>
(function(){
  'use strict';
  function $(id){ return document.getElementById(id); }
  function load(k, d){ try { var v = localStorage.getItem(k); return v === null ? d : v; } catch(e){ return d; } }
  function save(k, v){ try { localStorage.setItem(k, v); } catch(e){} }

  var actx = null, muted = load('memory.muted', '0') === '1';
  function tone(f0, f1, dur, type, vol, delay){
    if(muted) return;
    try {
      if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if(actx.state === 'suspended') actx.resume();
      var t0 = actx.currentTime + (delay || 0), o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(actx.destination); o.start(t0); o.stop(t0 + dur + 0.05);
    } catch(e){}
  }
  var sfx = {
    flip: function(){ tone(500, 700, 0.06, 'triangle', 0.05); },
    match: function(n){ var f = 523 * Math.pow(1.12, Math.min(n, 8)); tone(f, f, 0.12, 'triangle', 0.07); tone(f * 1.5, f * 1.5, 0.16, 'triangle', 0.06, 0.08); },
    miss: function(){ tone(260, 200, 0.14, 'sine', 0.06); },
    win: function(){ [523, 659, 784, 1047, 1319].forEach(function(f, i){ tone(f, f, 0.2, 'triangle', 0.07, i * 0.09); }); }
  };
  var muteBtn = $('mute');
  function renderMute(){ muteBtn.textContent = muted ? '🔈' : '🔊'; muteBtn.setAttribute('aria-label', muted ? 'Sound off' : 'Sound on'); }
  muteBtn.addEventListener('click', function(){ muted = !muted; save('memory.muted', muted ? '1' : '0'); renderMute(); muteBtn.blur(); });

  var THEMES = [
    ['🐶', '🐱', '🐭', '🐹', '🐰', '🦊', '🐻', '🐼', '🐨', '🐯', '🦁', '🐮', '🐷', '🐸', '🐵', '🐔', '🐧', '🦄'],
    ['🍎', '🍌', '🍇', '🍓', '🍒', '🍑', '🍍', '🥝', '🍉', '🍋', '🥥', '🍐', '🍊', '🥭', '🍅', '🥑', '🌽', '🥕'],
    ['🍩', '🍪', '🎂', '🧁', '🍭', '🍬', '🍫', '🍦', '🍰', '🥧', '🍮', '🍯', '🥞', '🧇', '🍿', '🥨', '🍡', '🥐'],
    ['🚀', '🛸', '🌙', '⭐', '🪐', '☄️', '🌍', '👽', '🌞', '🌈', '⚡', '🔭', '🛰️', '🌟', '💫', '🌠', '🌕', '🌋'],
    ['🐳', '🐬', '🐟', '🐠', '🐡', '🦈', '🐙', '🦑', '🦀', '🦞', '🦐', '🐚', '🐢', '🦭', '⚓', '🌊', '🏝️', '⛵']
  ];
  // [columns, rows] for each level; after level 5 it stays 6 by 6 and the pictures keep changing
  var SIZES = [[4, 3], [4, 4], [4, 5], [5, 6], [6, 6]];

  var prog = { max: 1, cur: 1, stars: {} };
  try { var sp = JSON.parse(load('memory.progress', 'null')); if(sp && sp.max >= 1){ prog.max = Math.floor(sp.max); prog.cur = Math.min(Math.max(1, Math.floor(sp.cur) || 1), prog.max); prog.stars = sp.stars || {}; } } catch(e){}
  function saveProg(){ save('memory.progress', JSON.stringify(prog)); }

  var level = 1, cols = 4, rows = 3, cards = [], open = [], lock = false, moves = 0, found = 0, pairs = 0, combo = 0, t0 = 0, timer = null, elapsed = 0;

  function fmt(s){ return Math.floor(s / 60) + ':' + ('0' + Math.floor(s % 60)).slice(-2); }

  function sizeBoard(){
    var gap = Math.max(6, Math.min(12, window.innerWidth * 0.02));
    var availW = Math.min(window.innerWidth - 24, 620), availH = window.innerHeight - 170;
    var cw = Math.floor(Math.min((availW - gap * (cols - 1)) / cols, ((availH - gap * (rows - 1)) / rows) * 0.75));
    cw = Math.max(40, cw);
    var b = $('board');
    b.style.setProperty('--gap', gap + 'px');
    b.style.setProperty('--cw', cw + 'px');
    b.style.setProperty('--bw', (cw * cols + gap * (cols - 1)) + 'px');
    b.style.gridTemplateColumns = 'repeat(' + cols + ', 1fr)';
  }
  window.addEventListener('resize', sizeBoard);

  function startLevel(n){
    level = n;
    var sz = SIZES[Math.min(n, SIZES.length) - 1];
    cols = sz[0]; rows = sz[1]; pairs = cols * rows / 2;
    var theme = THEMES[(n - 1) % THEMES.length].slice();
    // a different mix of pictures each time
    for(var i = theme.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)), t = theme[i]; theme[i] = theme[j]; theme[j] = t; }
    var deck = theme.slice(0, pairs).concat(theme.slice(0, pairs));
    for(var k = deck.length - 1; k > 0; k--){ var m = Math.floor(Math.random() * (k + 1)), u = deck[k]; deck[k] = deck[m]; deck[m] = u; }
    var b = $('board');
    b.innerHTML = '';
    cards = deck.map(function(face, idx){
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'cardbtn';
      btn.setAttribute('aria-label', 'Hidden card');
      btn.innerHTML = '<span class="inner"><span class="face back-face">?</span><span class="face front-face"></span></span>';
      btn.querySelector('.front-face').textContent = face;
      var card = { face: face, el: btn, up: false, done: false, i: idx };
      btn.addEventListener('click', function(){ flip(card); });
      b.appendChild(btn);
      return card;
    });
    open = []; lock = false; moves = 0; found = 0; combo = 0; elapsed = 0; t0 = 0;
    clearInterval(timer); timer = null;
    prog.cur = n; saveProg();
    $('win').hidden = true;
    sizeBoard(); updateStats();
  }

  function updateStats(){
    $('lv').textContent = 'Level ' + level;
    $('moves').textContent = moves;
    $('pairs').textContent = found + '/' + pairs;
    $('time').textContent = fmt(elapsed);
    $('prev').disabled = level <= 1;
    $('next').disabled = level >= prog.max;
  }

  function flip(card){
    if(lock || card.up || card.done) return;
    if(!timer){ t0 = Date.now(); timer = setInterval(function(){ elapsed = (Date.now() - t0) / 1000; $('time').textContent = fmt(elapsed); }, 250); }
    card.up = true;
    card.el.classList.add('up');
    card.el.setAttribute('aria-label', card.face);
    sfx.flip();
    open.push(card);
    if(open.length < 2) return;
    moves++;
    var a = open[0], b = open[1];
    open = [];
    if(a.face === b.face){
      a.done = b.done = true;
      a.el.classList.add('done'); b.el.classList.add('done');
      found++; combo++;
      sfx.match(combo);
      if(combo >= 2) shout(combo === 2 ? 'Nice!' : combo === 3 ? 'Awesome!' : 'On fire! 🔥');
      if(found === pairs) setTimeout(win, 450);
    } else {
      combo = 0;
      lock = true;
      setTimeout(function(){ a.el.classList.add('miss'); b.el.classList.add('miss'); sfx.miss(); }, 350);
      setTimeout(function(){
        [a, b].forEach(function(c){ c.up = false; c.el.classList.remove('up', 'miss'); c.el.setAttribute('aria-label', 'Hidden card'); });
        lock = false;
      }, 900);
    }
    updateStats();
  }

  function shout(text){
    var d = document.createElement('div');
    d.className = 'combo'; d.textContent = text;
    document.body.appendChild(d);
    setTimeout(function(){ d.remove(); }, 1000);
  }

  function win(){
    clearInterval(timer); timer = null;
    elapsed = t0 ? (Date.now() - t0) / 1000 : 0;
    var st = moves <= Math.ceil(pairs * 1.5) ? 3 : moves <= pairs * 2.2 ? 2 : 1;
    prog.stars[level] = Math.max(prog.stars[level] || 0, st);
    prog.max = Math.max(prog.max, level + 1);
    saveProg(); updateStats(); sfx.win();
    var el = $('stars').children;
    for(var i = 0; i < 3; i++) el[i].className = i < st ? 'on' : '';
    $('win-title').textContent = st === 3 ? 'Super memory! 🧠' : st === 2 ? 'Great job!' : 'You did it!';
    $('win-text').textContent = 'All ' + pairs + ' pairs in ' + moves + ' moves and ' + fmt(elapsed) + '.';
    $('win').hidden = false;
    $('go-next').focus();
    var colors = ['#ff5fa2', '#ffd23f', '#6bd968', '#5ec8ff', '#b56dff', '#ff9f43'];
    for(var k = 0; k < 40; k++){
      var s = document.createElement('span');
      s.className = 'bit';
      s.style.left = (Math.random() * 100) + 'vw';
      s.style.background = colors[k % colors.length];
      s.style.animationDuration = (1.6 + Math.random() * 1.6) + 's';
      s.style.animationDelay = (Math.random() * 0.4) + 's';
      document.body.appendChild(s);
      setTimeout(function(n){ return function(){ n.remove(); }; }(s), 3600);
    }
  }

  $('replay').addEventListener('click', function(){ startLevel(level); });
  $('go-next').addEventListener('click', function(){ startLevel(level + 1); });
  $('prev').addEventListener('click', function(){ if(level > 1) startLevel(level - 1); });
  $('next').addEventListener('click', function(){ if(level < prog.max) startLevel(level + 1); });

  renderMute();
  startLevel(prog.cur);
})();
</script>
</body>
</html>
