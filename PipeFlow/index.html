<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1d3b2f">
<title>Pipe Flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Lilita+One&display=swap" rel="stylesheet">
<style>
  :root{ --font:'Fredoka', ui-rounded, 'Segoe UI', system-ui, sans-serif; --display:'Lilita One', 'Fredoka', system-ui, sans-serif; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; overflow:hidden; background:radial-gradient(circle at 50% 30%, #2f6b50, #1d3b2f 75%); color:#fff; font-family:var(--font); -webkit-user-select:none; user-select:none; }
  body{ display:flex; flex-direction:column; align-items:center; padding:10px; padding-top:max(10px, env(safe-area-inset-top)); }
  .hud{ width:min(100%, 560px); display:flex; align-items:center; gap:8px; }
  .back{ padding:8px 12px; border-radius:12px; background:rgba(0,0,0,0.22); color:#fff; font-weight:600; font-size:15px; text-decoration:none; white-space:nowrap; }
  .spacer{ flex:1; }
  h1{ margin:0; font:400 26px var(--display); color:#8ff0c8; white-space:nowrap; }
  .round{ width:40px; height:40px; border:none; border-radius:50%; background:rgba(0,0,0,0.22); color:#fff; font-size:17px; cursor:pointer; flex:none; }
  .bar{ width:min(100%, 560px); display:flex; align-items:center; justify-content:space-between; margin:12px 0 10px; gap:8px; }
  .lvnav{ display:flex; align-items:center; gap:6px; }
  .lvnav button{ width:34px; height:34px; border:none; border-radius:10px; background:rgba(0,0,0,0.22); color:#fff; font-size:18px; cursor:pointer; }
  .lvnav button:disabled{ opacity:0.25; cursor:default; }
  #lvl{ font:400 22px var(--display); min-width:92px; text-align:center; }
  .stat{ font-weight:600; font-size:15px; white-space:nowrap; }
  #c{ display:block; touch-action:manipulation; cursor:pointer; border-radius:20px; box-shadow:0 18px 40px rgba(0,0,0,0.35); }
  .tools{ display:flex; gap:10px; margin-top:14px; }
  .tool{ font:600 16px var(--font); border:none; border-radius:14px; padding:10px 18px; background:rgba(0,0,0,0.22); color:#fff; cursor:pointer; }
  .tool:active{ transform:translateY(2px); }
  .overlay{ position:fixed; inset:0; z-index:10; display:flex; align-items:center; justify-content:center; padding:16px; background:rgba(5,25,15,0.5); }
  .overlay[hidden]{ display:none; }
  .card{ width:min(100%, 330px); padding:24px 20px; border-radius:26px; text-align:center; background:#fff; color:#1d3b2f; box-shadow:0 20px 50px rgba(0,0,0,0.4); animation:pop .35s cubic-bezier(.2,.9,.3,1.3); }
  @keyframes pop{ from{ transform:scale(0.85); opacity:0; } }
  .card h2{ margin:0 0 8px; font:400 36px var(--display); color:#1fb57a; }
  .card p{ margin:0 0 14px; font-size:16px; line-height:1.4; }
  .btn{ font:400 21px var(--display); border:none; border-radius:18px; padding:12px 30px; color:#fff; cursor:pointer; background:linear-gradient(180deg, #3fd99a, #1fb57a); box-shadow:0 6px 0 #127a51; }
  .btn:active{ transform:translateY(4px); box-shadow:0 2px 0 #127a51; }
  button:focus-visible, .back:focus-visible{ outline:3px solid #8ff0c8; outline-offset:2px; }
</style>
</head>
<body>
<div class="hud">
  <a class="back" href="../" aria-label="Back to games">&lsaquo; Games</a>
  <div class="spacer"></div>
  <h1>Pipe Flow</h1>
  <div class="spacer"></div>
  <button type="button" class="round" id="mute" aria-label="Sound on">🔊</button>
</div>
<div class="bar">
  <div class="lvnav"><button type="button" id="prev" aria-label="Previous level">‹</button><div id="lvl">Level 1</div><button type="button" id="next" aria-label="Next level">›</button></div>
  <div class="stat" id="info">🌸 0/0 · Moves 0</div>
</div>
<canvas id="c" aria-label="Pipe board: tap a pipe to turn it"></canvas>
<div class="tools">
  <button type="button" class="tool" id="restart">↺ Restart</button>
</div>
<div class="overlay" id="ov" hidden>
  <div class="card">
    <h2>All watered!</h2>
    <p id="ov-text"></p>
    <button type="button" class="btn" id="ov-btn">Next level ›</button>
  </div>
</div>
<script>
(function(){
  'use strict';
  function $(id){ return document.getElementById(id); }
  function load(k, d){ try { var v = localStorage.getItem(k); return v === null ? d : v; } catch(e){ return d; } }
  function save(k, v){ try { localStorage.setItem(k, v); } catch(e){} }

  var actx = null, muted = load('pipes.muted', '0') === '1';
  function tone(f0, f1, dur, type, vol, delay){
    if(muted) return;
    try {
      if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if(actx.state === 'suspended') actx.resume();
      var t0 = actx.currentTime + (delay || 0), o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(actx.destination); o.start(t0); o.stop(t0 + dur + 0.05);
    } catch(e){}
  }
  var muteBtn = $('mute');
  function renderMute(){ muteBtn.textContent = muted ? '🔈' : '🔊'; muteBtn.setAttribute('aria-label', muted ? 'Sound off' : 'Sound on'); }
  muteBtn.addEventListener('click', function(){ muted = !muted; save('pipes.muted', muted ? '1' : '0'); renderMute(); muteBtn.blur(); });
  renderMute();

  function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  // Directions: N=1, E=2, S=4, W=8
  var DIRS = [[1, -1, 0, 4], [2, 0, 1, 8], [4, 1, 0, 1], [8, 0, -1, 2]];
  function rotMask(m, k){ k = ((k % 4) + 4) % 4; for(var i = 0; i < k; i++) m = ((m << 1) | (m >> 3)) & 15; return m; }
  function bitCount(m){ var c = 0; while(m){ c += m & 1; m >>= 1; } return c; }
  function sizeFor(lv){ return lv <= 3 ? 4 : lv <= 10 ? 5 : lv <= 25 ? 6 : lv <= 50 ? 7 : 8; }

  function makeLevel(lv){
    var n = sizeFor(lv), rnd = mulberry32(lv * 7919 + 1301), N = n * n, conn = new Array(N).fill(0), inTree = new Array(N).fill(false);
    var src = Math.floor(n / 2) * n + Math.floor((n - 1) / 2), frontier = [];
    function addFrontier(i){
      var r = (i / n) | 0, c = i % n;
      DIRS.forEach(function(d){ var rr = r + d[1], cc = c + d[2]; if(rr >= 0 && rr < n && cc >= 0 && cc < n && !inTree[rr * n + cc]) frontier.push([i, rr * n + cc, d[0], d[3]]); });
    }
    inTree[src] = true; addFrontier(src);
    var count = 1, tries = 0;
    while(count < N && frontier.length && tries++ < N * 200){
      var k = Math.floor(rnd() * frontier.length), e = frontier[k];
      if(inTree[e[1]]){ frontier[k] = frontier[frontier.length - 1]; frontier.pop(); continue; }
      // Prefer growing from cells with fewer pipes so there are fewer 4-way crosses.
      if(bitCount(conn[e[0]]) >= 3 && rnd() < 0.75) continue;
      frontier[k] = frontier[frontier.length - 1]; frontier.pop();
      conn[e[0]] |= e[2]; conn[e[1]] |= e[3]; inTree[e[1]] = true; count++; addFrontier(e[1]);
    }
    while(count < N && frontier.length){
      var f = frontier.pop();
      if(inTree[f[1]]) continue;
      conn[f[0]] |= f[2]; conn[f[1]] |= f[3]; inTree[f[1]] = true; count++; addFrontier(f[1]);
    }
    var rot = [];
    for(var i = 0; i < N; i++) rot.push(Math.floor(rnd() * 4));
    var base = conn.map(function(m, j){ return rotMask(m, -rot[j]); });
    return { n: n, src: src, base: base, sol: rot, turns: new Array(N).fill(0), vis: new Array(N).fill(0) };
  }
  function maskAt(L, i){ return rotMask(L.base[i], L.turns[i]); }
  function flow(L){
    var n = L.n, N = n * n, seen = new Array(N).fill(false), q = [L.src], ok = true;
    seen[L.src] = true;
    while(q.length){
      var i = q.shift(), m = maskAt(L, i), r = (i / n) | 0, c = i % n;
      for(var k = 0; k < 4; k++){
        var d = DIRS[k];
        if(!(m & d[0])) continue;
        var rr = r + d[1], cc = c + d[2];
        if(rr < 0 || rr >= n || cc < 0 || cc >= n){ ok = false; continue; }
        var j = rr * n + cc;
        if(!(maskAt(L, j) & d[3])){ ok = false; continue; }
        if(!seen[j]){ seen[j] = true; q.push(j); }
      }
    }
    var all = seen.every(function(v){ return v; });
    return { wet: seen, solved: all && ok && looseEnds(L) === 0 };
  }
  function looseEnds(L){
    var n = L.n, bad = 0;
    for(var i = 0; i < n * n; i++){
      var m = maskAt(L, i), r = (i / n) | 0, c = i % n;
      for(var k = 0; k < 4; k++){
        var d = DIRS[k]; if(!(m & d[0])) continue;
        var rr = r + d[1], cc = c + d[2];
        if(rr < 0 || rr >= n || cc < 0 || cc >= n || !(maskAt(L, rr * n + cc) & d[3])) bad++;
      }
    }
    return bad;
  }

  var prog = { level: 1, max: 1 };
  try { var sv = JSON.parse(load('pipes.progress', 'null')); if(sv && sv.level >= 1) prog = { level: sv.level | 0, max: Math.max(sv.max | 0, sv.level | 0) }; } catch(e){}
  var cv = $('c'), cx = cv.getContext('2d'), DPR = 1, SZ = 300, L = null, F = null, moves = 0, won = false, clock = 0, ends = 0;

  function layout(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    SZ = Math.max(240, Math.min(window.innerWidth - 24, window.innerHeight - 210, 560));
    cv.style.width = SZ + 'px'; cv.style.height = SZ + 'px';
    cv.width = Math.round(SZ * DPR); cv.height = Math.round(SZ * DPR);
  }
  window.addEventListener('resize', layout);
  layout();

  function persist(){ save('pipes.progress', JSON.stringify(prog)); }
  function startLevel(lv){
    prog.level = lv; persist();
    L = makeLevel(lv);
    // make sure the scramble isn't already solved
    var guard = 0;
    while(flow(L).solved && guard++ < 10){ L.turns[(guard * 7) % (L.n * L.n)] += 1; }
    for(var i = 0; i < L.turns.length; i++) L.vis[i] = L.turns[i];
    L.startTurns = L.turns.slice();
    moves = 0; won = false; $('ov').hidden = true;
    ends = 0; for(i = 0; i < L.base.length; i++) if(bitCount(L.base[i]) === 1 && i !== L.src) ends++;
    F = flow(L); renderInfo();
  }
  function renderInfo(){
    var wetEnds = 0;
    for(var i = 0; i < L.base.length; i++) if(i !== L.src && bitCount(L.base[i]) === 1 && F.wet[i]) wetEnds++;
    $('lvl').textContent = 'Level ' + prog.level;
    $('info').textContent = '🌸 ' + wetEnds + '/' + ends + ' · Moves ' + moves;
    $('prev').disabled = prog.level <= 1;
    $('next').disabled = prog.level >= prog.max;
  }
  function tap(i){
    if(won || !L) return;
    L.turns[i]++; moves++;
    var before = F.wet.filter(Boolean).length;
    F = flow(L);
    var after = F.wet.filter(Boolean).length;
    tone(after > before ? 700 : 420, after > before ? 980 : 380, 0.07, after > before ? 'triangle' : 'sine', 0.05);
    renderInfo();
    if(F.solved) win();
  }
  function win(){
    won = true;
    if(prog.level >= prog.max) prog.max = prog.level + 1;
    persist(); renderInfo();
    [523, 659, 784, 1047].forEach(function(f, k){ tone(f, f, 0.18, 'triangle', 0.06, k * 0.09); });
    $('ov-text').textContent = 'Every flower got water in ' + moves + ' moves. Nice plumbing!';
    setTimeout(function(){ if(won) $('ov').hidden = false; }, 700);
  }

  function rr(x, y, w, h, r){ cx.beginPath(); cx.moveTo(x + r, y); cx.arcTo(x + w, y, x + w, y + h, r); cx.arcTo(x + w, y + h, x, y + h, r); cx.arcTo(x, y + h, x, y, r); cx.arcTo(x, y, x + w, y, r); cx.closePath(); }
  function render(dt){
    clock += dt;
    cx.setTransform(DPR, 0, 0, DPR, 0, 0);
    cx.clearRect(0, 0, SZ, SZ);
    cx.fillStyle = '#14291f'; rr(0, 0, SZ, SZ, 20); cx.fill();
    if(!L) return;
    var n = L.n, pad = 8, cs = (SZ - pad * 2) / n, lw = cs * 0.24;
    for(var i = 0; i < n * n; i++){
      L.vis[i] += (L.turns[i] - L.vis[i]) * Math.min(1, dt * 16);
      if(Math.abs(L.turns[i] - L.vis[i]) < 0.002) L.vis[i] = L.turns[i];
      var r = (i / n) | 0, c = i % n, x = pad + c * cs, y = pad + r * cs, wet = F.wet[i];
      cx.fillStyle = wet ? (won ? '#2f7d5a' : '#25543f') : '#1f3a2d'; rr(x + 2, y + 2, cs - 4, cs - 4, cs * 0.18); cx.fill();
      cx.save(); cx.translate(x + cs / 2, y + cs / 2); cx.rotate(L.vis[i] * Math.PI / 2);
      var m = L.base[i], col = wet ? '#4fd8ff' : '#8a9b92';
      cx.lineCap = 'round'; cx.strokeStyle = wet ? '#1e7fb0' : '#5f6f67'; cx.lineWidth = lw + 5;
      for(var k = 0; k < 4; k++) if(m & DIRS[k][0]){ cx.beginPath(); cx.moveTo(0, 0); cx.lineTo(DIRS[k][2] * cs / 2, DIRS[k][1] * cs / 2); cx.stroke(); }
      cx.strokeStyle = col; cx.lineWidth = lw;
      for(k = 0; k < 4; k++) if(m & DIRS[k][0]){ cx.beginPath(); cx.moveTo(0, 0); cx.lineTo(DIRS[k][2] * (cs / 2 + 1), DIRS[k][1] * (cs / 2 + 1)); cx.stroke(); }
      if(wet){ cx.strokeStyle = 'rgba(255,255,255,0.5)'; cx.lineWidth = lw * 0.25; for(k = 0; k < 4; k++) if(m & DIRS[k][0]){ var t = (clock * 1.5) % 1; cx.beginPath(); cx.moveTo(DIRS[k][2] * cs * 0.5 * t * 0.3, DIRS[k][1] * cs * 0.5 * t * 0.3); cx.lineTo(DIRS[k][2] * cs * 0.5 * (t * 0.3 + 0.2), DIRS[k][1] * cs * 0.5 * (t * 0.3 + 0.2)); cx.stroke(); } }
      cx.restore();
      if(i === L.src){
        cx.fillStyle = '#ffd23f'; cx.beginPath(); cx.arc(x + cs / 2, y + cs / 2, cs * 0.27, 0, Math.PI * 2); cx.fill();
        cx.fillStyle = '#3aa0ff'; cx.beginPath(); var cxp = x + cs / 2, cyp = y + cs / 2 + cs * 0.04, s = cs * 0.14;
        cx.moveTo(cxp, cyp - s * 1.5); cx.quadraticCurveTo(cxp + s * 1.1, cyp, cxp, cyp + s * 0.9); cx.quadraticCurveTo(cxp - s * 1.1, cyp, cxp, cyp - s * 1.5); cx.fill();
      } else if(bitCount(m) === 1){
        var fx = x + cs / 2, fy = y + cs / 2, pr = cs * 0.13;
        if(wet){
          var bob = Math.sin(clock * 3 + i) * 0.08 + 1, hue = (i * 47) % 360;
          cx.fillStyle = 'hsl(' + hue + ',90%,72%)';
          for(var p = 0; p < 5; p++){ var a = p / 5 * Math.PI * 2 + clock * 0.5; cx.beginPath(); cx.arc(fx + Math.cos(a) * pr * bob, fy + Math.sin(a) * pr * bob, pr * 0.9, 0, Math.PI * 2); cx.fill(); }
          cx.fillStyle = '#ffd23f'; cx.beginPath(); cx.arc(fx, fy, pr * 0.8, 0, Math.PI * 2); cx.fill();
        } else {
          cx.fillStyle = '#6b5a3a'; cx.beginPath(); cx.arc(fx, fy, pr * 1.5, 0, Math.PI * 2); cx.fill();
          cx.fillStyle = '#4a8a3a'; cx.beginPath(); cx.ellipse(fx - pr * 0.4, fy - pr * 0.2, pr * 0.5, pr * 0.25, -0.6, 0, Math.PI * 2); cx.fill();
          cx.beginPath(); cx.ellipse(fx + pr * 0.4, fy - pr * 0.2, pr * 0.5, pr * 0.25, 0.6, 0, Math.PI * 2); cx.fill();
        }
      }
    }
  }
  var last = 0;
  function frame(ts){ var dt = Math.min(0.05, Math.max(0, (ts - last) / 1000)); last = ts; render(dt); requestAnimationFrame(frame); }
  cv.addEventListener('click', function(e){
    if(!L) return;
    var b = cv.getBoundingClientRect(), n = L.n, pad = 8, cs = (SZ - pad * 2) / n;
    var c = Math.floor((e.clientX - b.left - pad) / cs), r = Math.floor((e.clientY - b.top - pad) / cs);
    if(r >= 0 && r < n && c >= 0 && c < n) tap(r * n + c);
  });
  $('restart').addEventListener('click', function(){ if(!L) return; L.turns = L.startTurns.slice(); moves = 0; won = false; $('ov').hidden = true; F = flow(L); renderInfo(); });
  $('prev').addEventListener('click', function(){ if(prog.level > 1) startLevel(prog.level - 1); });
  $('next').addEventListener('click', function(){ if(prog.level < prog.max) startLevel(prog.level + 1); });
  $('ov-btn').addEventListener('click', function(){ startLevel(prog.level + 1); });
  startLevel(prog.level);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
