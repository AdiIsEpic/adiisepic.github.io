<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1d1d21">
<title>Powder</title>
<style>
  :root{
    --page:#141416;
    --panel:#1d1d21;
    --line:rgba(255,255,255,0.08);
    --ink:#ecebe8;
    --dim:#8f8c86;
    --accent:#f0ac53;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html,body{
    margin:0;
    height:100%;
    background:var(--page);
    color:var(--ink);
    font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    overflow:hidden;
    overscroll-behavior:none;
    -webkit-user-select:none;
    user-select:none;
  }

  body{ display:flex; flex-direction:column; height:100vh; height:100dvh; }

  /* ---- top bar ---- */
  .bar{
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px 12px;
    padding-top:max(8px, env(safe-area-inset-top));
    background:var(--panel);
    border-bottom:1px solid var(--line);
    flex-wrap:wrap;
  }
  .bar h1{ margin:0 4px 0 0; font-size:16px; font-weight:800; letter-spacing:0.3px; }
  .back{
    margin-left:-4px;
    padding:6px 10px;
    border-radius:8px;
    color:var(--dim);
    text-decoration:none;
    font-size:13px;
    font-weight:700;
    transition:color .15s ease, background .15s ease;
  }
  .back:hover{ color:var(--ink); background:#2a2a30; }
  .back:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }
  .spacer{ flex:1; }
  .ctl{ display:flex; align-items:center; gap:8px; font-size:12px; color:var(--dim); }
  .num{ font-variant-numeric:tabular-nums; min-width:1.6em; }
  .info{ font-variant-numeric:tabular-nums; }
  .info b{ color:var(--ink); font-weight:700; }
  .info .t{ color:var(--accent); font-weight:700; }
  input[type=range]{ width:110px; accent-color:var(--accent); }

  button{
    font:inherit;
    font-size:13px;
    font-weight:700;
    color:var(--ink);
    background:#2a2a30;
    border:1px solid var(--line);
    border-radius:8px;
    padding:6px 12px;
    cursor:pointer;
  }
  button:hover{ background:#34343b; }
  button:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }
  #heatview[aria-pressed="true"]{ background:linear-gradient(90deg, #3a0ca3, #e53935 60%, #fdd835); border-color:transparent; }

  /* ---- canvas ---- */
  .view{
    position:relative;
    flex:1;
    min-height:0;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:8px;
  }

  canvas{
    display:block;
    image-rendering:pixelated;
    image-rendering:crisp-edges;
    touch-action:none;
    cursor:crosshair;
    border-radius:6px;
    box-shadow:0 0 0 1px var(--line);
  }

  .start-hint{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%, -50%);
    padding:10px 16px;
    border-radius:10px;
    background:rgba(20,20,24,0.8);
    color:var(--dim);
    font-size:13px;
    text-align:center;
    line-height:1.5;
    pointer-events:none;
    transition:opacity .3s ease;
  }
  .start-hint b{ color:var(--ink); }
  .start-hint.gone{ opacity:0; }

  /* heat view legend */
  .legend{
    position:absolute;
    right:16px;
    bottom:14px;
    display:flex;
    align-items:center;
    gap:6px;
    padding:5px 9px;
    border-radius:8px;
    background:rgba(20,20,24,0.8);
    color:var(--dim);
    font-size:11px;
    pointer-events:none;
  }
  .legend[hidden]{ display:none; }
  .legend .scale{
    width:140px;
    height:8px;
    border-radius:4px;
    background:linear-gradient(90deg, #12002b, #3a0ca3 12%, #1f4bff 22%, #33a1fd 30%, #1d3b2a 36%, #7cb342 46%, #fdd835 58%, #fb8c00 70%, #e53935 82%, #ff80ab 92%, #ffffff);
  }

  /* ---- element picker: section tabs, then that section's elements ---- */
  .tools{
    display:flex;
    flex-direction:column;
    gap:7px;
    padding:8px 10px calc(8px + env(safe-area-inset-bottom));
    background:var(--panel);
    border-top:1px solid var(--line);
  }
  .row{ display:flex; gap:6px; overflow-x:auto; scrollbar-width:thin; padding-bottom:2px; }

  .cat{
    flex:none;
    font-size:12px;
    padding:5px 12px;
    border-radius:999px;
    background:transparent;
    color:var(--dim);
  }
  .cat .n{ opacity:0.55; margin-left:4px; font-weight:600; }
  .cat[aria-pressed="true"]{ background:#34302a; color:var(--ink); border-color:var(--accent); }

  .tool{
    flex:none;
    display:flex;
    align-items:center;
    gap:7px;
    padding:6px 11px;
    background:#26262b;
    border:1px solid transparent;
    font-weight:600;
  }
  .tool .sw{
    width:14px;
    height:14px;
    border-radius:4px;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,0.18);
  }
  .tool[aria-pressed="true"]{ border-color:var(--accent); background:#34302a; }
  .tool.eraser{ margin-right:6px; }

  @media (max-width:760px){
    .keys{ display:none; }
    input[type=range]{ width:80px; }
  }
</style>
</head>
<body>

<div class="bar">
  <a class="back" href="../" aria-label="Back to games">&lsaquo; Games</a>
  <h1>Powder</h1>
  <button id="pause" type="button">Pause</button>
  <button id="clear" type="button">Clear</button>
  <button id="heatview" type="button" aria-pressed="false" title="Colour everything by temperature (H)">Heat view</button>
  <label class="ctl">Brush <input type="range" id="size" min="1" max="24" value="4"><span class="num" id="size-val">4</span></label>
  <div class="spacer"></div>
  <div class="ctl keys">Right-click erases &middot; scroll resizes &middot; Space pauses &middot; H heat view</div>
  <div class="ctl info" id="info">0 particles</div>
</div>

<div class="view" id="view">
  <canvas id="c"></canvas>
  <div class="start-hint" id="hint">Pick a section, then an element, and <b>draw</b>.<br>Hover to read temperatures. Try fire under a copper bar, or corn on a heater.</div>
  <div class="legend" id="legend" hidden><span>&minus;273&deg;</span><span class="scale"></span><span>6000&deg;C</span></div>
</div>

<div class="tools">
  <div class="row" id="cats" role="tablist" aria-label="Sections"></div>
  <div class="row" id="els"></div>
</div>

<script>
(function(){
  'use strict';

  // ---------- element ids ----------
  var NAMES = [
    'Empty','Wall','Sand','Water','Wood','Fire','Oil','Lava','Stone','Plant','Acid','Steam','Smoke','Gunpowder','Ice',
    'Snow','Salt','Dust','Ash','Coal','Dirt','Gravel','Sawdust','Glass Shards','Rust','Clay','Sugar','Cement','Glitter',
    'Saltwater','Mud','Honey','Mercury','Liquid Nitrogen','Molten Glass','Molten Metal','Slime','Alcohol','Tar','Glue','Liquid Wax',
    'Nitrogen','Hydrogen','Methane','Oxygen','Helium','Chlorine','CO2','Cloud',
    'Metal','Glass','Brick','Concrete','Diamond','Obsidian','Gold','Crystal','Sponge','Wax',
    'Plasma','Cold Fire','Ember','Spark','Lightning',
    'TNT','C-4','Nitro','Thermite','Firework','Bomb','Fuse',
    'Seed','Flower','Grass','Vine','Moss','Mushroom','Virus',
    'Clone','Void','Antimatter','Heater','Cooler',
    'Wet Sponge','Dried Glue','Molten Gold','Burning Thermite','Rocket','Sparkle','Stem','Burning Fuse','Burning Wood',
    'Copper','Molten Copper','Tungsten','Insulator','Butter','Melted Butter','Chocolate','Melted Chocolate','Corn','Popcorn',
    'Paper','Dry Ice','Liquid Oxygen','Magnesium','Burning Magnesium','Sodium','Uranium','Propane','Gasoline','Soap','Bubbles','Neon'
  ];
  var ID = {};
  NAMES.forEach(function(n, i){ ID[n] = i; });
  var LABEL = { 'CO2': 'CO₂' };

  var SECTIONS = [
    ['Powders',       ['Sand','Stone','Snow','Salt','Dust','Ash','Coal','Dirt','Gravel','Sawdust','Glass Shards','Rust','Clay','Sugar','Cement','Glitter','Corn','Popcorn','Magnesium','Sodium','Uranium']],
    ['Liquids',       ['Water','Saltwater','Oil','Gasoline','Acid','Lava','Mud','Honey','Mercury','Liquid Nitrogen','Liquid Oxygen','Molten Glass','Molten Metal','Molten Copper','Slime','Alcohol','Tar','Glue','Liquid Wax','Melted Butter','Melted Chocolate','Soap']],
    ['Gases',         ['Steam','Smoke','Nitrogen','Hydrogen','Methane','Propane','Oxygen','Helium','Neon','Chlorine','CO2','Cloud','Bubbles']],
    ['Solids',        ['Wall','Wood','Paper','Ice','Dry Ice','Metal','Copper','Tungsten','Gold','Glass','Brick','Concrete','Insulator','Diamond','Obsidian','Crystal','Sponge','Wax','Butter','Chocolate']],
    ['Fire & Energy', ['Fire','Cold Fire','Plasma','Ember','Spark','Lightning']],
    ['Explosives',    ['Gunpowder','TNT','C-4','Nitro','Thermite','Firework','Bomb','Fuse']],
    ['Life',          ['Plant','Seed','Flower','Grass','Vine','Moss','Mushroom','Virus']],
    ['Special',       ['Clone','Void','Antimatter','Heater','Cooler']],
    ['Tools',         ['Heat','Cool']]
  ];

  // hot-path ids
  var EMPTY = 0, WALL = ID.Wall, WATER = ID.Water, FIRE = ID.Fire, LAVA = ID.Lava, STEAM = ID.Steam, SMOKE = ID.Smoke,
      ICE = ID.Ice, SALTWATER = ID.Saltwater, CO2 = ID.CO2, PLASMA = ID.Plasma, OBSIDIAN = ID.Obsidian,
      DIRT = ID.Dirt, MUD = ID.Mud, GRASS = ID.Grass, PLANT = ID.Plant, STEM = ID.Stem, FLOWER = ID.Flower,
      VINE = ID.Vine, VIRUS = ID.Virus, CLONE = ID.Clone, VOID = ID.Void, ANTIMATTER = ID.Antimatter,
      BOMB = ID.Bomb, SPARK = ID.Spark, SPARKLE = ID.Sparkle, ROCKET = ID.Rocket, LIGHTNING = ID.Lightning,
      ACID = ID.Acid, WOOD = ID.Wood;

  // tools, not elements
  var ERASE = 250, HEAT = 251, COOL = 252;
  var TOOL_IDS = { 'Heat': HEAT, 'Cool': COOL };
  var NONE = 255;       // "no change" in the property tables
  var AMBIENT = 22;     // room temperature, °C

  // ---------- property tables, one slot per element ----------
  var POWDER = 1, LIQUID = 2, GAS = 3, SOLID = 4, FLAME = 5;
  function u8(fill){ var a = new Uint8Array(256); if(fill) a.fill(fill); return a; }
  function f32(){ return new Float32Array(256); }

  var KIND = u8(), DENS = f32(), MOVES = u8();
  // temperature
  var TEMP0 = f32(), COND = f32(), AIRLOSS = f32(), FIXED = u8(), GLOWS = u8();
  var HI_T = f32(), HI_TO = u8(NONE), HI_P = f32(), HI_ALT = u8(NONE), HI_ALT_P = f32();
  var LO_T = f32(), LO_TO = u8(NONE), LO_P = f32();
  var IGN_T = f32(), FLAM = f32(), BURN_TO = u8(NONE), BURN_MIN = u8(), BURN_MAX = u8();
  // everything else
  var DECAY_TO = u8(NONE), DECAY_P = f32(), LIFE_MIN = u8(), LIFE_MAX = u8();
  var DEATH_A = u8(NONE), DEATH_AP = f32(), DEATH_B = u8(NONE), DEATH_BP = f32();
  var VISC = f32(), SPREAD = u8(), HEAVY = u8(), JUMP = u8();
  var EXPLODE = u8(), IGNITE_P = f32();
  var RESIST = f32(), BLAST_TO = u8(NONE), ACIDPROOF = u8();
  var STATIC = u8(), RMODE = u8(), HAS_REACT = u8();
  var PAL = new Uint32Array(256 * 4), FPAL = [], SWATCH = [], CUSTOM = [];

  // pairwise contact reactions: [self][neighbour] -> what each becomes, and how often
  var RX_TO = new Uint8Array(65536).fill(NONE), RX_OTHER = new Uint8Array(65536).fill(NONE), RX_P = new Float32Array(65536);

  // render modes
  var R_FLAT = 0, R_FLAME = 1, R_FLICKER = 2, R_GLITTER = 3, R_SPARKLE = 4;

  // ---------- colour helpers ----------
  function hexRGB(h){ var n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
  function toHex(r, g, b){
    return '#' + [r, g, b].map(function(v){
      v = Math.max(0, Math.min(255, Math.round(v)));
      return (v < 16 ? '0' : '') + v.toString(16);
    }).join('');
  }
  function shadesOf(hex){
    var c = hexRGB(hex);
    return [1, 1.07, 0.92, 1.03].map(function(k){ return toHex(c[0] * k, c[1] * k, c[2] * k); });
  }
  function abgr(hex){
    var n = parseInt(hex.slice(1), 16);
    return ((255 << 24) | ((n & 255) << 16) | (n & 0xff00) | ((n >> 16) & 255)) >>> 0;
  }
  function pack(r, g, b){ return ((255 << 24) | (b << 16) | (g << 8) | r) >>> 0; }

  // builds a lookup table by blending between colour stops
  function ramp(stops, size){
    var out = new Uint32Array(size);
    for(var k = 0; k < size; k++){
      var v = k / (size - 1), s = 0;
      while(s < stops.length - 2 && v > stops[s + 1][0]) s++;
      var a = stops[s], b = stops[s + 1], f = Math.max(0, Math.min(1, (v - a[0]) / (b[0] - a[0])));
      var ca = hexRGB(a[1]), cb = hexRGB(b[1]);
      out[k] = pack(Math.round(ca[0] + (cb[0] - ca[0]) * f), Math.round(ca[1] + (cb[1] - ca[1]) * f), Math.round(ca[2] + (cb[2] - ca[2]) * f));
    }
    return out;
  }

  var FIRE_PAL    = ['#5a1a08','#8c2208','#c2310c','#e84a12','#ff6a1a','#ff8c2a','#ffb347','#ffe07a'];
  var PLASMA_PAL  = ['#3a0a4a','#5a1470','#7d23a0','#a238c8','#c65ae0','#e288f0','#f4b8fa','#ffffff'];
  var COLD_PAL    = ['#06283a','#0b4a66','#0f6f93','#1897bd','#34bde0','#6bd8f2','#a8ecfb','#e6fbff'];
  var SPARK_PAL   = ['#5a3a00','#8c5a00','#c28200','#f0aa10','#ffc83a','#ffe070','#fff2b0','#ffffff'];
  var BOLT_PAL    = ['#6f7cff','#8f9cff','#b0bbff','#d0d8ff','#e8ecff','#ffffff','#ffffff','#ffffff'];
  var EMBER_PAL   = ['#8c2208','#c2310c','#e84a12','#ff6a1a','#ff8c2a'];
  var THERMITE_PAL= ['#ff9a2a','#ffb347','#ffd27a','#ffe9b0','#ffffff'];
  var MAGNESIUM_PAL = ['#ffffff','#f4f8ff','#e2ecff','#ffffff','#d6e4ff'];
  var URANIUM_PAL = ['#3fd94a','#5cf066','#2fbf3a','#7dff86','#49e054'];
  var NEON_PAL    = ['#ff4fa3','#ff6ab5','#ff86c4','#ff5aac','#ff9fd0'];
  var SPARKLE_COLORS = ['#ff5a5a','#ffd166','#6ee06e','#6ee7f9','#b794f6','#ff7eb6'];
  var SPARKLE_PAL = new Uint32Array(6 * 8);
  SPARKLE_COLORS.forEach(function(hex, f){
    var c = hexRGB(hex);
    for(var lv = 0; lv < 8; lv++){
      var k = 0.25 + lv * 0.107;   // fades toward the background as it burns out
      SPARKLE_PAL[f * 8 + lv] = abgr(toHex(12 + (c[0] - 12) * k, 12 + (c[1] - 12) * k, 14 + (c[2] - 14) * k));
    }
  });
  var WHITE = abgr('#ffffff');

  // hot things glow: dull red, then orange, yellow, and finally white
  var GLOW_LUT = ramp([[0, '#6a0c00'], [0.3, '#d02000'], [0.55, '#ff7a10'], [0.8, '#ffd850'], [1, '#fffbe8']], 128);

  // heat view: -273 °C .. 6000 °C, squeezed so the everyday range gets most of the colours
  var HEAT_LUT = ramp([[0, '#12002b'], [0.12, '#3a0ca3'], [0.22, '#1f4bff'], [0.3, '#33a1fd'], [0.36, '#1d3b2a'],
                       [0.46, '#7cb342'], [0.58, '#fdd835'], [0.7, '#fb8c00'], [0.82, '#e53935'], [0.92, '#ff80ab'], [1, '#ffffff']], 512);
  function heatIndex(t){
    // piecewise: cold, room, hot, very hot
    var v;
    if(t < 0) v = 0.3 * (t + 273) / 273;
    else if(t < 100) v = 0.3 + 0.16 * t / 100;
    else if(t < 1500) v = 0.46 + 0.36 * (t - 100) / 1400;
    else v = 0.82 + 0.18 * Math.min(1, (t - 1500) / 4500);
    return Math.max(0, Math.min(511, Math.round(v * 511)));
  }

  // ---------- defining elements ----------
  function def(name, o){
    var id = ID[name], kind = o.kind || 0;
    KIND[id] = kind;
    DENS[id] = o.dens != null ? o.dens
             : kind === SOLID ? 99 : kind === POWDER ? 2 : kind === LIQUID ? 1 : kind === GAS ? 0.1 : 0.05;
    MOVES[id] = (id === EMPTY || kind === LIQUID || kind === GAS || kind === FLAME) ? 1 : 0;

    TEMP0[id] = o.temp != null ? o.temp : AMBIENT;
    COND[id] = o.cond != null ? o.cond
             : kind === SOLID ? 0.3 : kind === POWDER ? 0.2 : kind === LIQUID ? 0.35 : kind === GAS ? 0.1 : 0.4;
    AIRLOSS[id] = o.airloss != null ? o.airloss
             : kind === GAS ? 0.02 : kind === FLAME ? 0 : 0.005;
    FIXED[id] = o.fixed ? 1 : 0;
    GLOWS[id] = (kind === SOLID || kind === POWDER || kind === LIQUID) && !o.noglow ? 1 : 0;
    if(o.hi){
      HI_T[id] = o.hi[0]; HI_TO[id] = ID[o.hi[1]]; HI_P[id] = o.hi[2] || 1;
      if(o.hi[3]){ HI_ALT[id] = ID[o.hi[3]]; HI_ALT_P[id] = o.hi[4]; }
    }
    if(o.lo){ LO_T[id] = o.lo[0]; LO_TO[id] = ID[o.lo[1]]; LO_P[id] = o.lo[2] || 1; }

    FLAM[id] = o.flam || 0;
    IGN_T[id] = o.ign || (o.flam || o.explode ? 300 : 0);
    BURN_TO[id] = o.burnTo ? ID[o.burnTo] : FIRE;
    var bl = o.burnLife || [20, 40];
    BURN_MIN[id] = bl[0]; BURN_MAX[id] = bl[1];

    if(o.decay){ DECAY_TO[id] = ID[o.decay[0]]; DECAY_P[id] = o.decay[1]; }
    if(o.life){ LIFE_MIN[id] = o.life[0]; LIFE_MAX[id] = o.life[1]; }
    if(o.death){
      DEATH_A[id] = ID[o.death[0]]; DEATH_AP[id] = o.death[1];
      if(o.death[2]){ DEATH_B[id] = ID[o.death[2]]; DEATH_BP[id] = o.death[3]; }
    }
    VISC[id] = o.visc || 0;
    SPREAD[id] = o.spread || (kind === LIQUID ? 3 : 0);
    HEAVY[id] = o.heavy ? 1 : 0;
    JUMP[id] = o.jump ? 1 : 0;
    if(o.explode){ EXPLODE[id] = o.explode; IGNITE_P[id] = o.ignite || 0.5; }
    RESIST[id] = o.resist || 0;
    if(o.blast) BLAST_TO[id] = ID[o.blast];
    ACIDPROOF[id] = o.acidproof ? 1 : 0;
    RMODE[id] = o.render != null ? o.render : (kind === FLAME ? R_FLAME : R_FLAT);
    var cols = o.colors || shadesOf(o.color || '#000000');
    for(var k = 0; k < 4; k++) PAL[id * 4 + k] = abgr(cols[k]);
    // flames have no fixed colour, so their swatch takes a bright step from the flame palette
    SWATCH[id] = o.swatch || (!o.color && !o.colors && o.flame ? o.flame[Math.min(5, o.flame.length - 1)] : cols[0]);
    if(o.flame) FPAL[id] = o.flame.map(abgr);
    if(o.custom) CUSTOM[id] = o.custom;
  }

  function react(a, b, toA, toB, p){
    var k = ID[a] * 256 + ID[b];
    RX_TO[k] = toA ? ID[toA] : NONE;
    RX_OTHER[k] = toB ? ID[toB] : NONE;
    RX_P[k] = p;
    HAS_REACT[ID[a]] = 1;
  }

  // ---------- the elements ----------
  // temp: what it's made at (°C). cond: how fast heat moves through it. hi/lo: [°C, what it turns into, chance per tick].
  // ign: the temperature it catches fire (or goes off) at. fixed: a heat source that holds its temperature.
  def('Empty',  { kind: 0, dens: 0, color: '#0c0c0e', cond: 0, airloss: 0 });

  // powders
  def('Sand',        { kind: POWDER, dens: 3,   color: '#e2c275', hi: [1700, 'Molten Glass', 0.05] });
  def('Stone',       { kind: POWDER, dens: 3.5, color: '#6e6a66', cond: 0.3, hi: [1200, 'Lava', 0.05], blast: 'Gravel' });
  def('Snow',        { kind: POWDER, dens: 0.9, color: '#eef5fb', temp: -5, hi: [0.5, 'Water', 0.3], blast: 'Water', noglow: true });
  def('Salt',        { kind: POWDER, dens: 2.2, color: '#f2f2ee' });
  def('Dust',        { kind: POWDER, dens: 1.2, color: '#bfb39d', flam: 0.6, ign: 200, burnLife: [6, 14] });
  def('Ash',         { kind: POWDER, dens: 1.1, color: '#8c8a86' });
  def('Coal',        { kind: POWDER, dens: 2.0, color: '#2e2c2a', flam: 0.05, ign: 400, burnTo: 'Ember', burnLife: [150, 250] });
  def('Dirt',        { kind: POWDER, dens: 2.5, color: '#6b4a2e' });
  def('Gravel',      { kind: POWDER, dens: 3.2, color: '#7d7a74', cond: 0.3 });
  def('Sawdust',     { kind: POWDER, dens: 0.8, color: '#d8b889', flam: 0.3, ign: 250, burnLife: [15, 30] });
  def('Glass Shards',{ kind: POWDER, dens: 2.6, color: '#cfe8ef', hi: [1400, 'Molten Glass', 0.05], acidproof: true });

  // things that never change and don't carry heat can skip their update entirely
  for(var sid = 0; sid < NAMES.length; sid++){
    if(KIND[sid] === SOLID && !COND[sid] && !LIFE_MAX[sid] && DECAY_TO[sid] === NONE && !CUSTOM[sid] && !FLAM[sid] &&
       HI_TO[sid] === NONE && LO_TO[sid] === NONE && !EXPLODE[sid] && !HAS_REACT[sid]){
      STATIC[sid] = 1;
    }
  }

  // ---------- grid, sized from the space available ----------
  var view = document.getElementById('view');
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var W = 0, H = 0, N = 0, built = false;
  var grid, life, shade, stamp, temp, img, buf;   // stamp: which tick last moved a cell, so nothing moves twice
  var tick = 1;

  // returns false while the view has no real size yet (background tab, hidden frame)
  function build(){
    var aw = view.clientWidth - 16, ah = view.clientHeight - 16;
    if(aw < 100 || ah < 80) return false;
    var cell = window.innerWidth < 700 ? 3 : 4;
    var w = Math.floor(aw / cell), h = Math.floor(ah / cell);
    while(w * h > 70000){ cell++; w = Math.floor(aw / cell); h = Math.floor(ah / cell); }

    W = w; H = h; N = W * H;
    canvas.width = W;
    canvas.height = H;
    grid  = new Uint8Array(N);
    life  = new Uint8Array(N);
    shade = new Uint8Array(N);
    stamp = new Uint8Array(N);
    temp  = new Float32Array(N).fill(AMBIENT);
    img = ctx.createImageData(W, H);
    buf = new Uint32Array(img.data.buffer);
    built = true;
    return true;
  }

  function isEmpty(){
    for(var i = 0; i < N; i++) if(grid[i] !== EMPTY) return false;
    return true;
  }

  // reshape the grid to the new space, but only while there's nothing on it to lose
  function onResize(){
    if(!built || isEmpty()) build();
    fit();
  }

  function fit(){
    var aw = view.clientWidth - 16, ah = view.clientHeight - 16;
    if(!built || aw <= 0 || ah <= 0) return;
    var s = Math.min(aw / W, ah / H);
    canvas.style.width = Math.floor(W * s) + 'px';
    canvas.style.height = Math.floor(H * s) + 'px';
  }

  // ---------- cell helpers ----------
  // turns a cell into something else. It keeps the heat it had, nudged into the range where
  // the new material makes sense (fresh stone from lava is still hot; steam from water is 100°+).
  function set(i, t){
    grid[i] = t;
    life[i] = LIFE_MAX[t] ? LIFE_MIN[t] + (Math.random() * (LIFE_MAX[t] - LIFE_MIN[t] + 1) | 0) : 0;
    shade[i] = Math.random() * 4 | 0;
    stamp[i] = tick;
    if(FIXED[t]){ temp[i] = TEMP0[t]; return; }
    if(HI_TO[t] !== NONE && temp[i] >= HI_T[t]) temp[i] = HI_T[t] - 20;
    if(LO_TO[t] !== NONE && temp[i] <= LO_T[t]) temp[i] = LO_T[t] + 5;
  }

  // brand-new material, at its usual temperature
  function spawn(i, t){
    set(i, t);
    if(!FIXED[t]) temp[i] = TEMP0[t];
  }

  function swap(i, j){
    var v = grid[i]; grid[i] = grid[j]; grid[j] = v;
    v = life[i]; life[i] = life[j]; life[j] = v;
    v = shade[i]; shade[i] = shade[j]; shade[j] = v;
    v = temp[i]; temp[i] = temp[j]; temp[j] = v;
    stamp[i] = tick; stamp[j] = tick;
  }

  function canEnter(a, b){ return b === EMPTY || (MOVES[b] && DENS[b] < DENS[a]); }

  function moveTo(i, j){
    if(canEnter(grid[i], grid[j])){ swap(i, j); return true; }
    return false;
  }

  var NX = [0, 1, 0, -1, 1, 1, -1, -1];
  var NY = [-1, 0, 1, 0, -1, 1, 1, -1];

  function neighbour(x, y){
    var k = Math.random() * 8 | 0;
    var nx = x + NX[k], ny = y + NY[k];
    if(nx < 0 || nx >= W || ny < 0 || ny >= H) return -1;
    return ny * W + nx;
  }

  function ignite(i){
    var t = grid[i];
    if(EXPLODE[t]){ explode(i % W, (i / W) | 0, EXPLODE[t]); return; }
    set(i, BURN_TO[t]);
    if(BURN_MAX[t]) life[i] = BURN_MIN[t] + (Math.random() * (BURN_MAX[t] - BURN_MIN[t] + 1) | 0);
  }

  function die(i, t){
    var r = Math.random();
    if(DEATH_A[t] !== NONE && r < DEATH_AP[t]) set(i, DEATH_A[t]);
    else if(DEATH_B[t] !== NONE && r < DEATH_AP[t] + DEATH_BP[t]) set(i, DEATH_B[t]);
    else grid[i] = EMPTY;
  }

  // popcorn jumps when it pops
  function hop(i, x, y){
    var ci = i, cx = x, cy = y;
    for(var s = 0; s < 4; s++){
      var nx = cx + (Math.random() * 3 | 0) - 1, ny = cy - 1;
      if(ny < 0 || nx < 0 || nx >= W) break;
      var j = ny * W + nx;
      if(grid[j] !== EMPTY) break;
      swap(ci, j);
      ci = j; cx = nx; cy = ny;
    }
  }

  // a crater of plasma in the middle, a fireball around it; tough materials survive but get hot
  function explode(cx, cy, r){
    var r2 = r * r, core = r2 * 0.2;
    for(var dy = -r; dy <= r; dy++){
      var y = cy + dy;
      if(y < 0 || y >= H) continue;
      for(var dx = -r; dx <= r; dx++){
        var d2 = dx * dx + dy * dy;
        if(d2 > r2) continue;
        var x = cx + dx;
        if(x < 0 || x >= W) continue;
        var j = y * W + x, n = grid[j];
        var heat = 500 * (1 - d2 / r2);
        if(RESIST[n] >= 1 || (RESIST[n] > 0 && Math.random() < RESIST[n])){
          if(n && !FIXED[n]) temp[j] += heat;
          continue;
        }
        if(BLAST_TO[n] !== NONE){ set(j, BLAST_TO[n]); continue; }
        if(EXPLODE[n]){ set(j, FIRE); life[j] = 3 + (Math.random() * 5 | 0); continue; }   // sets off the next charge
        var heavy = KIND[n] === SOLID || KIND[n] === POWDER || KIND[n] === LIQUID;
        if(heavy && !FLAM[n] && d2 > core){
          if(!FIXED[n]) temp[j] += heat;
          continue;
        }
        if(d2 <= core && Math.random() < 0.6) set(j, PLASMA);
        else if(Math.random() < 0.75){ set(j, FIRE); life[j] = 8 + (Math.random() * 22 | 0); }
        else grid[j] = EMPTY;
      }
    }
  }

  // ---------- heat and change: each particle looks at one random neighbour per tick ----------
  function interact(i, x, y, t){
    var j = neighbour(x, y);
    if(j < 0) return checkTemp(i, x, y, t);
    var n = grid[j];

    // out in the open, things drift back toward room temperature (conduction between
    // touching particles happens in its own pass, see conduct())
    if(n === EMPTY && AIRLOSS[t]) temp[i] += (AMBIENT - temp[i]) * AIRLOSS[t];

    var key = t * 256 + n, p = RX_P[key];
    if(p && Math.random() < p){
      var a = RX_TO[key], b = RX_OTHER[key];
      if(b !== NONE) set(j, b);
      if(a !== NONE){ set(i, a); return true; }
    }
    return checkTemp(i, x, y, t);
  }

  function checkTemp(i, x, y, t){
    var T = temp[i];
    if(IGN_T[t] && T >= IGN_T[t]){
      if(EXPLODE[t]){
        if(Math.random() < IGNITE_P[t]){ explode(x, y, EXPLODE[t]); return true; }
      } else if(FLAM[t] && Math.random() < FLAM[t]){ ignite(i); return true; }
    }
    if(HI_TO[t] !== NONE && T >= HI_T[t] && Math.random() < HI_P[t]){
      var to = HI_ALT[t] !== NONE && Math.random() < HI_ALT_P[t] ? HI_ALT[t] : HI_TO[t];
      set(i, to);
      if(JUMP[to]) hop(i, x, y);
      return true;
    }
    if(LO_TO[t] !== NONE && T <= LO_T[t] && Math.random() < LO_P[t]){ set(i, LO_TO[t]); return true; }
    return false;
  }

  // flames also light things they touch directly, two looks per tick
  function flameTouch(i, x, y, t){
    var hot = TEMP0[t] >= 3000;
    for(var k = 0; k < 2; k++){
      var j = neighbour(x, y);
      if(j < 0) continue;
      var n = grid[j];
      if(n === WATER || n === SALTWATER){
        set(j, STEAM);
        if(!hot){ grid[i] = EMPTY; return true; }   // water puts out ordinary fire; plasma just boils it
        continue;
      }
      if(n === CO2 && !hot){ set(i, SMOKE); return true; }
      if(EXPLODE[n] && Math.random() < IGNITE_P[n]){ explode(j % W, (j / W) | 0, EXPLODE[n]); return true; }
      if(FLAM[n] && Math.random() < FLAM[n] * (hot ? 3 : 1)) ignite(j);
    }
    return false;
  }

  // cold fire freezes what it touches outright, on top of chilling it
  function coldTouch(i, x, y){
    for(var k = 0; k < 2; k++){
      var j = neighbour(x, y);
      if(j < 0) continue;
      var n = grid[j];
      if(n === FIRE || n === PLASMA) set(j, SMOKE);
      else if(n === WATER || n === SALTWATER) set(j, ICE);
      else if(n === LAVA) set(j, OBSIDIAN);
      else if(n === STEAM) set(j, WATER);
    }
    return false;
  }

  // ---------- special behaviours ----------
  // burning wood glows in place, spreads to what it touches and sends flames up; water puts it out
  function burningUpdate(i, x, y){
    for(var k = 0; k < 2; k++){
      var j = neighbour(x, y);
      if(j < 0) continue;
      var n = grid[j];
      if(n === WATER || n === SALTWATER){ set(j, STEAM); set(i, WOOD); temp[i] = 150; return true; }
      if(n === CO2){ set(i, WOOD); temp[i] = 150; return true; }
      if(EXPLODE[n] && Math.random() < IGNITE_P[n]){ explode(j % W, (j / W) | 0, EXPLODE[n]); return true; }
      if(FLAM[n] && Math.random() < FLAM[n]) ignite(j);
    }
    if(y > 0 && grid[i - W] === EMPTY && Math.random() < 0.3) set(i - W, FIRE);
    return true;
  }

  // uranium keeps warming itself; a big enough pile gets very hot
  function uraniumUpdate(i){
    if(temp[i] < 2500) temp[i] += 0.8;
    return false;
  }

  function bubbleUpdate(i, x, y){
    if(y > 0 && Math.random() < 0.5){
      var nx = x + (Math.random() * 3 | 0) - 1;
      if(nx >= 0 && nx < W && grid[(y - 1) * W + nx] === EMPTY) swap(i, (y - 1) * W + nx);
    }
    return true;
  }

  function acidUpdate(i, x, y){
    var j = neighbour(x, y);
    if(j < 0) return false;
    var n = grid[j];
    if(n !== EMPTY && n !== ACID && !ACIDPROOF[n] && KIND[n] !== GAS && KIND[n] !== FLAME &&
       Math.random() < 0.08 * (1 - RESIST[n])){
      if(Math.random() < 0.3) set(j, SMOKE); else grid[j] = EMPTY;
      if(Math.random() < 0.35){ grid[i] = EMPTY; return true; }   // acid gets used up
    }
    return false;
  }

  function cloudUpdate(i, x, y){
    if(y + 1 < H && grid[i + W] === EMPTY && Math.random() < 0.004) spawn(i + W, WATER);   // rain
    if(Math.random() < 0.04){
      var s = Math.random() < 0.5 ? -1 : 1;
      if(x + s >= 0 && x + s < W && grid[i + s] === EMPTY) swap(i, i + s);
    }
    return true;
  }

  function sparkUpdate(i, x, y, t){
    if(flameTouch(i, x, y, t)) return true;
    var k = Math.random() * 8 | 0, nx = x + NX[k], ny = y + NY[k];
    if(nx >= 0 && nx < W && ny >= 0 && ny < H && grid[ny * W + nx] === EMPTY) swap(i, ny * W + nx);
    return true;
  }

  // rips downward a few cells a tick, leaving a flash of plasma, and blasts whatever it hits
  function lightningUpdate(i, x, y){
    var ci = i, cx = x, cy = y;
    for(var s = 0; s < 4; s++){
      var nx = Math.max(0, Math.min(W - 1, cx + (Math.random() * 3 | 0) - 1)), ny = cy + 1;
      if(ny >= H){ set(ci, PLASMA); return true; }
      var j = ny * W + nx, n = grid[j];
      if(n === EMPTY || KIND[n] === GAS){
        swap(ci, j);
        set(ci, PLASMA);
        life[ci] = 3 + (Math.random() * 5 | 0);
        ci = j; cx = nx; cy = ny;
      } else {
        explode(nx, ny, 3);
        if(grid[ci] === LIGHTNING) set(ci, PLASMA);
        return true;
      }
    }
    return true;
  }

  function rocketUpdate(i, x, y){
    var ci = i, cx = x, cy = y;
    for(var s = 0; s < 2; s++){
      if(life[ci] <= 3 || cy <= 1){ burst(cx, cy); return true; }
      var nx = cx + (Math.random() < 0.2 ? (Math.random() < 0.5 ? -1 : 1) : 0);
      if(nx < 0 || nx >= W) nx = cx;
      var j = (cy - 1) * W + nx, n = grid[j];
      if(n !== EMPTY && KIND[n] !== GAS){ burst(cx, cy); return true; }
      swap(ci, j);
      if(Math.random() < 0.6) set(ci, SPARK);   // a trail of sparks behind it
      ci = j; cx = nx; cy = cy - 1;
    }
    return true;
  }

  function burst(cx, cy){
    var fam = Math.random() * SPARKLE_COLORS.length | 0, r = 5 + (Math.random() * 3 | 0);
    for(var dy = -r; dy <= r; dy++){
      for(var dx = -r; dx <= r; dx++){
        if(dx * dx + dy * dy > r * r || Math.random() > 0.45) continue;
        var x = cx + dx, y = cy + dy;
        if(x < 0 || x >= W || y < 0 || y >= H) continue;
        var j = y * W + x, n = grid[j];
        if(n !== EMPTY && KIND[n] !== GAS && n !== ROCKET && n !== SPARK) continue;
        set(j, SPARKLE);
        shade[j] = fam;
        life[j] = 18 + (Math.random() * 26 | 0);
      }
    }
    set(cy * W + cx, PLASMA);
  }

  function sparkleUpdate(i, x, y){
    if(Math.random() < 0.35 && y + 1 < H){
      var nx = x + (Math.random() * 3 | 0) - 1;
      if(nx >= 0 && nx < W && grid[(y + 1) * W + nx] === EMPTY) swap(i, (y + 1) * W + nx);
    }
    return true;
  }

  // bombs go off the moment they land on something
  function bombUpdate(i, x, y){
    if(y + 1 >= H){ explode(x, y, EXPLODE[BOMB]); return true; }
    var b = grid[i + W];
    if(b !== EMPTY && b !== BOMB && KIND[b] !== GAS && KIND[b] !== FLAME){ explode(x, y, EXPLODE[BOMB]); return true; }
    return false;
  }

  function seedUpdate(i, x, y){
    if(y + 1 < H){
      var b = grid[i + W];
      if((b === DIRT || b === MUD || b === GRASS) && Math.random() < 0.01){
        set(i, STEM);
        life[i] = 6 + (Math.random() * 14 | 0);   // how tall it'll grow
        return true;
      }
    }
    return false;
  }

  // a stem grows upward one cell at a time, putting out leaves, then flowers at the top
  function stemUpdate(i, x, y){
    var h = life[i];
    if(h > 0 && y > 0 && Math.random() < 0.05){
      var up = i - W;
      if(grid[up] === EMPTY){
        if(h <= 1) bloom(x, y - 1);
        else {
          spawn(up, STEM);
          life[up] = h - 1;
          if(Math.random() < 0.3){
            var s = Math.random() < 0.5 ? -1 : 1;
            if(x + s >= 0 && x + s < W && grid[i + s] === EMPTY) spawn(i + s, PLANT);
          }
        }
      }
      life[i] = 0;
    }
    return true;
  }

  function bloom(fx, fy){
    var fam = Math.random() < 0.5 ? 0 : (Math.random() < 0.5 ? 2 : 3);
    var petals = [[-1, 0], [1, 0], [0, -1], [-1, -1], [1, -1]];
    for(var k = 0; k < petals.length; k++){
      var x = fx + petals[k][0], y = fy + petals[k][1];
      if(x < 0 || x >= W || y < 0 || y >= H) continue;
      var j = y * W + x;
      if(grid[j] === EMPTY){ spawn(j, FLOWER); shade[j] = fam; }
    }
    var c = fy * W + fx;
    spawn(c, FLOWER);
    shade[c] = 1;   // yellow middle
  }

  function vineUpdate(i, x, y){
    if(!life[i]) life[i] = 20 + (Math.random() * 30 | 0);   // how far this vine will hang
    if(life[i] > 1 && y + 1 < H && Math.random() < 0.02){
      var b = i + W;
      if(grid[b] === EMPTY){ spawn(b, VINE); life[b] = life[i] - 1; }
      life[i] = 1;
    }
    return true;
  }

  function virusUpdate(i, x, y){
    var j = neighbour(x, y);
    if(j < 0) return false;
    var n = grid[j];
    if(n !== EMPTY && n !== VIRUS && RESIST[n] < 1 && KIND[n] !== GAS && KIND[n] !== FLAME && Math.random() < 0.05) set(j, VIRUS);
    return false;
  }

  // clone remembers the first thing that touches it (in its life slot), then keeps making more
  function cloneUpdate(i, x, y){
    if(!life[i]){
      // not set yet: check every neighbour, so a single drop landing on it isn't missed
      for(var k = 0; k < 8; k++){
        var nx = x + NX[k], ny = y + NY[k];
        if(nx < 0 || nx >= W || ny < 0 || ny >= H) continue;
        var m = grid[ny * W + nx];
        if(m !== EMPTY && m !== CLONE && m !== WALL && m !== VOID){ life[i] = m; break; }
      }
      return true;
    }
    var j = neighbour(x, y);
    if(j >= 0 && grid[j] === EMPTY && Math.random() < 0.3) spawn(j, life[i]);
    return true;
  }

  function voidUpdate(i, x, y){
    for(var k = 0; k < 2; k++){
      var j = neighbour(x, y);
      if(j < 0) continue;
      var n = grid[j];
      if(n !== EMPTY && n !== WALL && n !== VOID && n !== CLONE) grid[j] = EMPTY;
    }
    return true;
  }

  function antimatterUpdate(i, x, y){
    var j = neighbour(x, y);
    if(j < 0) return false;
    var n = grid[j];
    if(n !== EMPTY && n !== ANTIMATTER && n !== WALL && n !== VOID && n !== CLONE && KIND[n] !== FLAME){
      set(i, PLASMA);
      set(j, PLASMA);
      return true;
    }
    return false;
  }

  // ---------- movement ----------
  function updPowder(i, x, y){
    if(y + 1 >= H) return;
    var below = i + W;
    if(moveTo(i, below)) return;
    var d = Math.random() < 0.5 ? -1 : 1;
    if(x + d >= 0 && x + d < W && moveTo(i, below + d)) return;
    if(x - d >= 0 && x - d < W) moveTo(i, below - d);
  }

  function slide(i, x, y, d, reach){
    var cur = i, cx = x, moved = false;
    for(var s = 0; s < reach; s++){
      var nx = cx + d;
      if(nx < 0 || nx >= W) break;
      var j = cur + d;
      if(!canEnter(grid[cur], grid[j])) break;
      swap(cur, j);
      cur = j; cx = nx; moved = true;
      if(y + 1 < H && grid[j + W] === EMPTY) break;   // found a drop; gravity takes it next tick
    }
    return moved;
  }

  function updLiquid(i, x, y, t){
    if(y + 1 < H){
      var below = i + W;
      if(moveTo(i, below)) return;
      var d = Math.random() < 0.5 ? -1 : 1;
      if(x + d >= 0 && x + d < W && moveTo(i, below + d)) return;
      if(x - d >= 0 && x - d < W && moveTo(i, below - d)) return;
    }
    if(VISC[t] && Math.random() < VISC[t]) return;   // thick liquids spread slowly
    var dir = Math.random() < 0.5 ? -1 : 1;
    if(!slide(i, x, y, dir, SPREAD[t])) slide(i, x, y, -dir, SPREAD[t]);
  }

  function updGas(i, x, y, t){
    var dir = HEAVY[t] ? 1 : -1;               // chlorine, CO2 and propane sink; everything else rises
    if(HEAVY[t] && Math.random() < 0.5) return;
    var ny = y + dir;
    if(ny >= 0 && ny < H){
      var d = (Math.random() * 3 | 0) - 1;
      if(x + d >= 0 && x + d < W && moveTo(i, i + dir * W + d)) return;
      if(moveTo(i, i + dir * W)) return;
    }
    var s = Math.random() < 0.5 ? -1 : 1;
    if(x + s >= 0 && x + s < W) moveTo(i, i + s);
  }

  function updFlame(i, x, y, t){
    if(TEMP0[t] < 0) coldTouch(i, x, y);
    else if(flameTouch(i, x, y, t)) return;
    if(y > 0 && Math.random() < 0.55){          // flicker upward
      var d = (Math.random() * 3 | 0) - 1;
      if(x + d >= 0 && x + d < W){
        var up = i - W + d;
        if(grid[up] === EMPTY) swap(i, up);
      }
    }
  }

  // heat spreads between touching particles: each pair (right and below) swaps a share of
  // the difference, three passes a tick so it visibly runs along a metal bar in seconds
  function conduct(){
    for(var pass = 0; pass < 3; pass++){
      for(var y = 0; y < H; y++){
        var row = y * W;
        for(var x = 0; x < W; x++){
          var i = row + x, a = grid[i];
          if(a === EMPTY) continue;
          var ca = COND[a];
          if(!ca) continue;
          var fa = FIXED[a];
          if(x + 1 < W){
            var j = i + 1, b = grid[j];
            if(b !== EMPTY && COND[b]){
              var d = (temp[j] - temp[i]) * (ca < COND[b] ? ca : COND[b]) * 0.2;
              if(!fa) temp[i] += d;
              if(!FIXED[b]) temp[j] -= d;
            }
          }
          if(y + 1 < H){
            var j2 = i + W, b2 = grid[j2];
            if(b2 !== EMPTY && COND[b2]){
              var d2 = (temp[j2] - temp[i]) * (ca < COND[b2] ? ca : COND[b2]) * 0.2;
              if(!fa) temp[i] += d2;
              if(!FIXED[b2]) temp[j2] -= d2;
            }
          }
        }
      }
    }
  }

  function step(){
    tick = tick === 255 ? 1 : tick + 1;
    conduct();
    var ltr = (tick & 1) === 1;                // alternate scan direction so nothing drifts one way
    for(var y = H - 1; y >= 0; y--){
      var row = y * W;
      for(var k = 0; k < W; k++){
        var x = ltr ? k : W - 1 - k;
        var i = row + x, t = grid[i];
        if(t === EMPTY || STATIC[t] || stamp[i] === tick) continue;
        stamp[i] = tick;
        // plain, poorly-conducting solids only need to look around now and then
        if(KIND[t] === SOLID && !LIFE_MAX[t] && !CUSTOM[t] && COND[t] < 0.5 && Math.random() > 0.3) continue;

        if(LIFE_MAX[t]){
          if(life[i] <= 1){ die(i, t); continue; }
          life[i]--;
        }
        if(DECAY_P[t] && Math.random() < DECAY_P[t]){ set(i, DECAY_TO[t]); continue; }
        if(interact(i, x, y, t)) continue;
        var c = CUSTOM[t];
        if(c && c(i, x, y, t)) continue;

        switch(KIND[t]){
          case POWDER: updPowder(i, x, y); break;
          case LIQUID: updLiquid(i, x, y, t); break;
          case GAS:    updGas(i, x, y, t); break;
          case FLAME:  updFlame(i, x, y, t); break;
        }
      }
    }
  }

  // ---------- drawing ----------
  var tool = ID.Sand, brush = 4, paused = false, section = 0, heatView = false;
  var pointer = { x: -1, y: -1, down: false, erase: false, inside: false };
  var lastPaint = null;
  var BG = PAL[0], HEAT_BG = abgr('#050507'), FROST = hexRGB('#e2f5ff');

  function mix(c, r2, g2, b2, a){
    var r = c & 255, g = (c >> 8) & 255, b = (c >> 16) & 255;
    return pack((r + (r2 - r) * a) | 0, (g + (g2 - g) * a) | 0, (b + (b2 - b) * a) | 0);
  }

  function render(){
    var count = 0;
    for(var i = 0; i < N; i++){
      var t = grid[i];
      if(t === EMPTY){ buf[i] = heatView ? HEAT_BG : BG; continue; }
      count++;
      if(heatView){ buf[i] = HEAT_LUT[heatIndex(temp[i])]; continue; }

      var c;
      switch(RMODE[t]){
        case R_FLAME:   // colour follows remaining life: dim embers up to bright young flame
          var p = FPAL[t], f = (life[i] >> 2) - 1 + shade[i];
          c = p[f < 0 ? 0 : f > 7 ? 7 : f];
          break;
        case R_FLICKER:
          var q = FPAL[t];
          c = q[(Math.random() * q.length) | 0];
          break;
        case R_GLITTER:
          c = Math.random() < 0.04 ? WHITE : PAL[t * 4 + shade[i]];
          break;
        case R_SPARKLE:
          var lv = life[i] >> 2;
          c = SPARKLE_PAL[(shade[i] % 6) * 8 + (lv > 7 ? 7 : lv)];
          break;
        default:
          c = PAL[t * 4 + shade[i]];
      }

      // hot things glow red, then orange, then white; very cold things frost over
      if(GLOWS[t]){
        var T = temp[i];
        if(T > 400){
          var h = (T - 400) / 1100;
          if(h > 1) h = 1;
          var g = GLOW_LUT[(h * 127) | 0];
          c = mix(c, g & 255, (g >> 8) & 255, (g >> 16) & 255, Math.min(0.95, 0.22 + h * 1.1));
        } else if(T < -40){
          c = mix(c, FROST[0], FROST[1], FROST[2], Math.min(0.5, (-40 - T) / 300));
        }
      }
      buf[i] = c;
    }
    ctx.putImageData(img, 0, 0);

    if(pointer.inside){
      ctx.strokeStyle = tool === HEAT ? 'rgba(255,120,60,0.8)' : tool === COOL ? 'rgba(110,200,255,0.8)' : 'rgba(255,255,255,0.45)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(pointer.x + 0.5, pointer.y + 0.5, Math.max(0.5, brush - 0.5), 0, Math.PI * 2);
      ctx.stroke();
    }
    return count;
  }

  // ---------- painting ----------
  function paint(cx, cy, t){
    if(t === LIGHTNING){   // one bolt per stroke, from the cursor down
      if(cx >= 0 && cx < W && cy >= 0 && cy < H && grid[cy * W + cx] === EMPTY) spawn(cy * W + cx, LIGHTNING);
      return;
    }
    var r = brush - 1;
    var k = KIND[t];
    var sparse = t < ERASE && (k === POWDER || k === LIQUID || k === GAS || k === FLAME);
    for(var dy = -r; dy <= r; dy++){
      for(var dx = -r; dx <= r; dx++){
        if(dx * dx + dy * dy > r * r + r) continue;
        var x = cx + dx, y = cy + dy;
        if(x < 0 || x >= W || y < 0 || y >= H) continue;
        var j = y * W + x, n = grid[j];
        if(t === ERASE){ grid[j] = EMPTY; continue; }
        if(t === HEAT || t === COOL){
          // the heat and cool brushes change the temperature of whatever's under them
          if(n && !FIXED[n]) temp[j] = Math.max(-273, Math.min(9999, temp[j] + (t === HEAT ? 25 : -25)));
          continue;
        }
        if(n !== EMPTY){
          // painting fire onto fuel lights it
          if(t === FIRE && FLAM[n] && Math.random() < 0.3) ignite(j);
          continue;
        }
        if(sparse && Math.random() < 0.55) continue;
        spawn(j, t);
      }
    }
  }

  function paintLine(x0, y0, x1, y1, t){
    if(t === LIGHTNING){ paint(x1, y1, t); return; }
    var dx = x1 - x0, dy = y1 - y0;
    var steps = Math.max(1, Math.ceil(Math.max(Math.abs(dx), Math.abs(dy)) / Math.max(1, brush / 2)));
    for(var s = 0; s <= steps; s++){
      paint(Math.round(x0 + dx * s / steps), Math.round(y0 + dy * s / steps), t);
    }
  }

  function activeTool(){ return pointer.erase ? ERASE : tool; }

  function toCell(e){
    var r = canvas.getBoundingClientRect();
    return {
      x: Math.floor((e.clientX - r.left) / r.width * W),
      y: Math.floor((e.clientY - r.top) / r.height * H)
    };
  }

  // ---------- UI: section tabs and element buttons ----------
  var catsEl = document.getElementById('cats');
  var elsEl = document.getElementById('els');
  var hint = document.getElementById('hint');
  var infoEl = document.getElementById('info');
  var sizeEl = document.getElementById('size');
  var sizeVal = document.getElementById('size-val');
  var pauseBtn = document.getElementById('pause');
  var heatBtn = document.getElementById('heatview');
  var legendEl = document.getElementById('legend');

  function load(key){ try { return localStorage.getItem(key); } catch(e){ return null; } }
  function save(key, v){ try { localStorage.setItem(key, String(v)); } catch(e){} }

  function labelOf(id){ var n = NAMES[id]; return LABEL[n] || n; }
  function idOf(name){ return TOOL_IDS[name] !== undefined ? TOOL_IDS[name] : ID[name]; }
  var TOOL_SWATCH = {};
  TOOL_SWATCH[HEAT] = 'linear-gradient(135deg, #ffcf5a, #ff5a2a)';
  TOOL_SWATCH[COOL] = 'linear-gradient(135deg, #e6fbff, #4fa8ff)';

  function renderSections(){
    catsEl.innerHTML = '';
    SECTIONS.forEach(function(s, idx){
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'cat';
      b.setAttribute('role', 'tab');
      b.setAttribute('aria-pressed', idx === section ? 'true' : 'false');
      b.innerHTML = s[0] + '<span class="n">' + s[1].length + '</span>';
      b.addEventListener('click', function(){
        section = idx;
        save('powder.section', idx);
        renderSections();
        renderElements();
      });
      catsEl.appendChild(b);
    });
  }

  function toolButton(id, text, swatch, extraClass){
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'tool' + (extraClass ? ' ' + extraClass : '');
    b.dataset.id = id;
    var sw = document.createElement('span');
    sw.className = 'sw';
    sw.style.background = swatch;
    if(id === ERASE) sw.style.boxShadow = 'inset 0 0 0 1px rgba(255,255,255,0.5)';
    b.appendChild(sw);
    b.appendChild(document.createTextNode(text));
    b.addEventListener('click', function(){ select(id); });
    return b;
  }

  function renderElements(){
    elsEl.innerHTML = '';
    elsEl.appendChild(toolButton(ERASE, 'Eraser', 'transparent', 'eraser'));
    SECTIONS[section][1].forEach(function(name, k){
      var id = idOf(name);
      var tool_ = id >= ERASE;
      var b = toolButton(id, tool_ ? name : labelOf(id), tool_ ? TOOL_SWATCH[id] : SWATCH[id]);
      if(k < 10) b.title = (tool_ ? name : labelOf(id)) + ' (' + ((k + 1) % 10) + ')';
      elsEl.appendChild(b);
    });
    markTool();
  }

  function markTool(){
    Array.prototype.forEach.call(elsEl.children, function(b){
      b.setAttribute('aria-pressed', +b.dataset.id === tool ? 'true' : 'false');
    });
  }

  function select(id){ tool = id; markTool(); }

  function setBrush(v){
    brush = Math.max(1, Math.min(24, v | 0));
    sizeEl.value = brush;
    sizeVal.textContent = brush;
  }

  function setPaused(p){
    paused = p;
    pauseBtn.textContent = p ? 'Play' : 'Pause';
  }

  function setHeatView(on){
    heatView = on;
    heatBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
    legendEl.hidden = !on;
  }

  sizeEl.addEventListener('input', function(){ setBrush(+sizeEl.value); });
  pauseBtn.addEventListener('click', function(){ setPaused(!paused); pauseBtn.blur(); });
  heatBtn.addEventListener('click', function(){ setHeatView(!heatView); heatBtn.blur(); });
  document.getElementById('clear').addEventListener('click', function(e){
    if(built){ grid.fill(0); life.fill(0); temp.fill(AMBIENT); }
    e.currentTarget.blur();
  });

  // ---------- pointer ----------
  canvas.addEventListener('pointerdown', function(e){
    e.preventDefault();
    if(!built) return;
    canvas.setPointerCapture(e.pointerId);
    var c = toCell(e);
    pointer.down = true;
    pointer.erase = e.button === 2;
    pointer.x = c.x; pointer.y = c.y; pointer.inside = true;
    lastPaint = c;
    paint(c.x, c.y, activeTool());
    hint.classList.add('gone');
  });

  canvas.addEventListener('pointermove', function(e){
    if(!built) return;
    var c = toCell(e);
    pointer.x = c.x; pointer.y = c.y; pointer.inside = true;
    if(pointer.down && lastPaint){
      paintLine(lastPaint.x, lastPaint.y, c.x, c.y, activeTool());
      lastPaint = c;
    }
  });

  function lift(){ pointer.down = false; lastPaint = null; }
  canvas.addEventListener('pointerup', lift);
  canvas.addEventListener('pointercancel', lift);
  canvas.addEventListener('pointerleave', function(){ if(!pointer.down) pointer.inside = false; });
  canvas.addEventListener('contextmenu', function(e){ e.preventDefault(); });

  canvas.addEventListener('wheel', function(e){
    e.preventDefault();
    setBrush(brush + (e.deltaY < 0 ? 1 : -1));
  }, { passive: false });

  window.addEventListener('keydown', function(e){
    if(e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'A')) return;
    if(e.key === ' '){ e.preventDefault(); setPaused(!paused); return; }
    if(e.key === 'h' || e.key === 'H'){ setHeatView(!heatView); return; }
    if(e.key === '['){ setBrush(brush - 1); return; }
    if(e.key === ']'){ setBrush(brush + 1); return; }
    if(/^[0-9]$/.test(e.key)){
      var list = SECTIONS[section][1], n = e.key === '0' ? 9 : +e.key - 1;
      if(list[n]) select(idOf(list[n]));
    }
  });

  if(window.ResizeObserver) new ResizeObserver(onResize).observe(view);
  else window.addEventListener('resize', onResize);

  // ---------- loop: fixed 60 ticks/s, so fast monitors don't run the sim faster ----------
  var STEP_MS = 1000 / 60, acc = 0, last = performance.now(), frames = 0;

  function loop(now){
    requestAnimationFrame(loop);
    if(!built){
      if(!build()) return;   // keep waiting until the view has a real size
      fit();
    }
    acc += Math.min(100, now - last);
    last = now;
    var n = 0;
    while(acc >= STEP_MS && n < 3){
      if(pointer.down) paint(pointer.x, pointer.y, activeTool());   // hold still to keep pouring
      if(!paused) step();
      acc -= STEP_MS;
      n++;
    }
    if(n === 3) acc = 0;   // falling behind: drop the backlog rather than spiral
    var count = render();
    if((++frames & 7) === 0){
      var under = '';
      if(pointer.inside && pointer.x >= 0 && pointer.x < W && pointer.y >= 0 && pointer.y < H){
        var j = pointer.y * W + pointer.x, t = grid[j];
        if(t !== EMPTY) under = '<b>' + labelOf(t) + '</b> <span class="t">' + Math.round(temp[j]) + '&nbsp;&deg;C</span> &middot; ';
      }
      infoEl.innerHTML = under + count.toLocaleString() + ' particles';
    }
  }

  section = Math.min(SECTIONS.length - 1, Math.max(0, parseInt(load('powder.section'), 10) || 0));
  renderSections();
  renderElements();
  setBrush(4);
  if(build()) fit();
  requestAnimationFrame(loop);

})();
</script>

</body>
</html>
