
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1b1a18">
<title>Snake</title>
<style>
  :root{
    /* board shape; JS swaps these to a portrait grid on phones */
    --cols:17;
    --rows:15;
    --page:#1b1a18;
    --panel:#578a34;
    --panel-dark:#4a7a2c;
    --ink:#f6f1e8;
    --ink-dim:#a79d90;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html,body{
    margin:0;
    height:100%;
    background:var(--page);
    color:var(--ink);
    font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    overscroll-behavior:none;
    -webkit-text-size-adjust:100%;
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:max(12px, env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom));
  }

  .wrap{
    width:100%;
    max-width:640px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
  }

  /* ---- score bar ---- */
  .hud{
    width:min(94vw, 640px, calc((100dvh - 150px) * var(--cols) / var(--rows)));
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:10px 16px;
    background:var(--panel);
    border-radius:14px 14px 4px 4px;
    font-weight:700;
  }

  .brand{ font-size:17px; letter-spacing:0.3px; }

  .scores{ display:flex; align-items:center; gap:16px; font-size:16px; }

  .score{ display:flex; align-items:center; gap:7px; }

  .apple-dot{
    width:13px;
    height:13px;
    border-radius:50%;
    background:#e7471d;
    box-shadow:inset 0 -2px 0 rgba(0,0,0,0.16);
  }

  .best{ color:rgba(255,255,255,0.82); font-size:14px; font-weight:600; }

  /* ---- board ---- */
  .stage{
    position:relative;
    width:min(94vw, 640px, calc((100dvh - 150px) * var(--cols) / var(--rows)));
    aspect-ratio:var(--cols) / var(--rows);
    border-radius:4px 4px 14px 14px;
    overflow:hidden;
    background:#aad751;
  }

  canvas{ display:block; width:100%; height:100%; touch-action:none; }

  /* ---- overlays ---- */
  .overlay{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:12px;
    text-align:center;
    padding:20px;
    background:rgba(24,38,12,0.55);
    backdrop-filter:blur(3px);
    -webkit-backdrop-filter:blur(3px);
    transition:opacity .18s ease;
  }

  .overlay[hidden]{ display:none; }

  .overlay h2{
    margin:0;
    font-size:clamp(22px, 6vw, 30px);
    letter-spacing:-0.3px;
  }

  .overlay p{
    margin:0;
    color:rgba(255,255,255,0.85);
    font-size:14px;
    line-height:1.5;
  }

  .big-score{
    font-size:clamp(34px, 10vw, 46px);
    font-weight:700;
    line-height:1;
  }

  button{
    font:inherit;
    font-weight:700;
    color:#2c4416;
    background:#f6f1e8;
    border:none;
    border-radius:999px;
    padding:11px 26px;
    cursor:pointer;
    box-shadow:0 3px 0 rgba(0,0,0,0.22);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  button:hover{ transform:translateY(-1px); box-shadow:0 4px 0 rgba(0,0,0,0.22); }
  button:active{ transform:translateY(2px); box-shadow:0 1px 0 rgba(0,0,0,0.22); }

  .hint{
    margin:2px 0 0;
    color:var(--ink-dim);
    font-size:12px;
    text-align:center;
    line-height:1.5;
  }

  @media (max-width:520px){
    .brand{ display:none; }
    .hud{ justify-content:center; }
  }
</style>
</head>
<body>

<div class="wrap">

  <div class="hud">
    <div class="brand">Snake</div>
    <div class="scores">
      <div class="score"><span class="apple-dot"></span><span id="score">0</span></div>
      <div class="best">Best <span id="best">0</span></div>
    </div>
  </div>

  <div class="stage">
    <canvas id="game"></canvas>

    <div class="overlay" id="overlay">
      <h2 id="ov-title">Snake</h2>
      <div class="big-score" id="ov-score" hidden>0</div>
      <p id="ov-text">Eat the apples. Don't bite yourself.</p>
      <button id="ov-btn">Play</button>
    </div>
  </div>

  <p class="hint">Arrow keys or WASD &middot; Space to pause &middot; swipe on touch</p>

</div>

<script>
(function(){
  'use strict';

  var COLS = 17, ROWS = 15;   // applyGrid() picks the real shape

  var LIGHT  = '#aad751';
  var DARK   = '#a2d149';
  var SNAKE  = '#4a6fe3';
  var SNAKE_DK = '#3f5ec4';
  var APPLE  = '#e7471d';

  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');

  var scoreEl  = document.getElementById('score');
  var bestEl   = document.getElementById('best');
  var overlay  = document.getElementById('overlay');
  var ovTitle  = document.getElementById('ov-title');
  var ovScore  = document.getElementById('ov-score');
  var ovText   = document.getElementById('ov-text');
  var ovBtn    = document.getElementById('ov-btn');

  var cell = 20;
  var snake, dir, queue, apple, score, best = 0, grew, tickMs;
  var state = 'idle';           // idle | playing | paused | over | won
  var lastTick = 0, pausedAt = 0, popT = 0;

  // ---------- storage (may throw in private mode) ----------
  function loadBest(){
    try { return parseInt(localStorage.getItem('snake.best'), 10) || 0; }
    catch(e){ return 0; }
  }
  function saveBest(v){
    try { localStorage.setItem('snake.best', String(v)); } catch(e){}
  }

  // ---------- sizing ----------

  // portrait phones get a taller board so it fills the screen instead of
  // sitting as a small letterboxed strip in the middle
  function applyGrid(){
    var portrait = window.matchMedia('(max-width: 620px) and (orientation: portrait)').matches;
    var c = portrait ? 15 : 17;
    var r = portrait ? 17 : 15;
    if(c === COLS && r === ROWS) return false;
    COLS = c; ROWS = r;
    document.documentElement.style.setProperty('--cols', String(COLS));
    document.documentElement.style.setProperty('--rows', String(ROWS));
    return true;
  }

  function onResize(){
    // only reshape between games — swapping dimensions mid-run would put the
    // snake outside the board
    if(state === 'idle' || state === 'over' || state === 'won'){
      if(applyGrid()) reset();
    }
    resize();
  }

  function resize(){
    var rect = canvas.getBoundingClientRect();
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width  = Math.round(rect.width  * dpr);
    canvas.height = Math.round(rect.height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cell = rect.width / COLS;
    draw(currentT());
  }

  // ---------- game ----------
  function reset(){
    var cx = COLS >> 1, cy = ROWS >> 1;
    snake = [{x:cx, y:cy}, {x:cx-1, y:cy}, {x:cx-2, y:cy}];
    dir = {x:1, y:0};
    queue = [];
    score = 0;
    grew = false;
    tickMs = 150;
    popT = 0;
    placeApple();
    scoreEl.textContent = '0';
  }

  function placeApple(){
    var free = [];
    for(var y=0; y<ROWS; y++){
      for(var x=0; x<COLS; x++){
        var taken = false;
        for(var i=0; i<snake.length; i++){
          if(snake[i].x === x && snake[i].y === y){ taken = true; break; }
        }
        if(!taken) free.push({x:x, y:y});
      }
    }
    if(!free.length){ apple = null; win(); return; }
    apple = free[(Math.random() * free.length) | 0];
  }

  function step(){
    if(queue.length) dir = queue.shift();

    var head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

    if(head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) return die();

    var eating = apple && head.x === apple.x && head.y === apple.y;

    // the tail cell vacates this tick, so it's only solid while growing
    var solid = eating ? snake.length : snake.length - 1;
    for(var i=0; i<solid; i++){
      if(snake[i].x === head.x && snake[i].y === head.y) return die();
    }

    snake.unshift(head);

    if(eating){
      grew = true;
      popT = 1;
      score++;
      scoreEl.textContent = String(score);
      if(score % 4 === 0) tickMs = Math.max(80, tickMs - 6);
      placeApple();
    } else {
      grew = false;
      snake.pop();
    }
  }

  function die(){
    state = 'over';
    if(score > best){ best = score; saveBest(best); bestEl.textContent = String(best); }
    showOverlay('Game over', String(score), 'Best ' + best, 'Play again');
  }

  function win(){
    state = 'won';
    if(score > best){ best = score; saveBest(best); bestEl.textContent = String(best); }
    showOverlay('You filled the board', String(score), 'That is the whole grid. Genuinely well done.', 'Play again');
  }

  // ---------- drawing ----------
  function drawField(){
    for(var y=0; y<ROWS; y++){
      for(var x=0; x<COLS; x++){
        ctx.fillStyle = ((x + y) % 2 === 0) ? LIGHT : DARK;
        ctx.fillRect(x*cell, y*cell, cell+0.5, cell+0.5);
      }
    }
  }

  function drawApple(){
    if(!apple) return;
    var cx = (apple.x + 0.5) * cell;
    var cy = (apple.y + 0.5) * cell;
    var r  = cell * 0.33 * (1 + popT * 0.25);

    ctx.fillStyle = APPLE;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI*2);
    ctx.fill();

    // stem
    ctx.strokeStyle = '#6b3d1b';
    ctx.lineWidth = Math.max(1.5, cell*0.07);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(cx, cy - r*0.85);
    ctx.lineTo(cx + r*0.18, cy - r*1.35);
    ctx.stroke();

    // leaf
    ctx.fillStyle = '#4f9e2f';
    ctx.beginPath();
    ctx.ellipse(cx + r*0.55, cy - r*1.15, r*0.38, r*0.2, -0.5, 0, Math.PI*2);
    ctx.fill();

    // highlight
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.beginPath();
    ctx.arc(cx - r*0.33, cy - r*0.36, r*0.2, 0, Math.PI*2);
    ctx.fill();
  }

  function lerp(a, b, t){ return a + (b - a) * t; }
  function px(v){ return (v + 0.5) * cell; }

  function bodyPoints(t){
    var pts = [];
    var n = snake.length;

    // head slides out of the cell behind it
    var behind = n > 1 ? snake[1] : snake[0];
    pts.push({ x: lerp(behind.x, snake[0].x, t), y: lerp(behind.y, snake[0].y, t) });

    for(var i=1; i<n-1; i++) pts.push({x: snake[i].x, y: snake[i].y});

    if(n > 1){
      var last = snake[n-1], prev = snake[n-2];
      // while growing the tail stays put, so the snake lengthens instead of sliding
      pts.push(grew ? {x:last.x, y:last.y}
                    : {x: lerp(last.x, prev.x, t), y: lerp(last.y, prev.y, t)});
    }
    return pts;
  }

  function drawSnake(t){
    var pts = bodyPoints(t);

    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';

    // darker outline, then the body on top
    ctx.strokeStyle = SNAKE_DK;
    ctx.lineWidth = cell * 0.86;
    strokePath(pts);

    ctx.strokeStyle = SNAKE;
    ctx.lineWidth = cell * 0.72;
    strokePath(pts);

    drawEyes(pts);
  }

  function strokePath(pts){
    ctx.beginPath();
    ctx.moveTo(px(pts[0].x), px(pts[0].y));
    for(var i=1; i<pts.length; i++) ctx.lineTo(px(pts[i].x), px(pts[i].y));
    ctx.stroke();
  }

  function drawEyes(pts){
    var h = pts[0];
    var nx = dir.x, ny = dir.y;
    if(pts.length > 1){
      var dx = h.x - pts[1].x, dy = h.y - pts[1].y;
      var len = Math.hypot(dx, dy);
      if(len > 0.01){ nx = dx/len; ny = dy/len; }
    }

    var cx = px(h.x), cy = px(h.y);
    var fwd = cell * 0.12;
    var side = cell * 0.19;
    var r = cell * 0.11;

    // perpendicular to facing direction
    var ox = -ny, oy = nx;

    for(var s=-1; s<=1; s+=2){
      var ex = cx + nx*fwd + ox*side*s;
      var ey = cy + ny*fwd + oy*side*s;

      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(ex, ey, r, 0, Math.PI*2);
      ctx.fill();

      ctx.fillStyle = '#12203f';
      ctx.beginPath();
      ctx.arc(ex + nx*r*0.35, ey + ny*r*0.35, r*0.52, 0, Math.PI*2);
      ctx.fill();
    }
  }

  function draw(t){
    drawField();
    drawApple();
    if(snake) drawSnake(t);
  }

  // ---------- loop ----------
  function currentT(){
    if(state === 'playing') return Math.min(1, (performance.now() - lastTick) / tickMs);
    if(state === 'paused')  return Math.min(1, (pausedAt - lastTick) / tickMs);
    if(state === 'over' || state === 'won') return 1;
    return 0;
  }

  function frame(now){
    requestAnimationFrame(frame);

    if(state === 'playing'){
      var guard = 0;
      while(now - lastTick >= tickMs && guard++ < 8){
        lastTick += tickMs;
        step();
        if(state !== 'playing') break;
      }
    }

    if(popT > 0) popT = Math.max(0, popT - 0.08);

    draw(currentT());
  }

  // ---------- state changes ----------
  function showOverlay(title, bigScore, text, btn){
    ovTitle.textContent = title;
    if(bigScore === null){
      ovScore.hidden = true;
    } else {
      ovScore.hidden = false;
      ovScore.textContent = bigScore;
    }
    ovText.textContent = text;
    ovBtn.textContent = btn;
    overlay.hidden = false;
  }

  function start(){
    reset();
    overlay.hidden = true;
    state = 'playing';
    lastTick = performance.now();
  }

  function pause(){
    if(state !== 'playing') return;
    state = 'paused';
    pausedAt = performance.now();
    showOverlay('Paused', null, 'Space or the button to resume.', 'Resume');
  }

  function resume(){
    if(state !== 'paused') return;
    lastTick += performance.now() - pausedAt;
    state = 'playing';
    overlay.hidden = true;
  }

  ovBtn.addEventListener('click', function(){
    if(state === 'paused') resume();
    else start();
  });

  // ---------- input ----------
  var DIRS = {
    ArrowUp:{x:0,y:-1}, ArrowDown:{x:0,y:1}, ArrowLeft:{x:-1,y:0}, ArrowRight:{x:1,y:0},
    w:{x:0,y:-1}, s:{x:0,y:1}, a:{x:-1,y:0}, d:{x:1,y:0}
  };

  function turn(nd){
    if(state === 'idle'){ start(); }
    if(state !== 'playing') return;
    // compare against the last queued turn, so fast double-taps both land
    var ref = queue.length ? queue[queue.length-1] : dir;
    if(nd.x === -ref.x && nd.y === -ref.y) return;   // no instant 180
    if(nd.x === ref.x && nd.y === ref.y) return;     // already going that way
    if(queue.length < 2) queue.push(nd);
  }

  window.addEventListener('keydown', function(e){
    var k = e.key;
    var nd = DIRS[k] || DIRS[k.toLowerCase && k.toLowerCase()];

    if(nd){
      e.preventDefault();
      turn(nd);
      return;
    }

    if(k === ' ' || k === 'Spacebar'){
      e.preventDefault();
      if(state === 'playing') pause();
      else if(state === 'paused') resume();
      else start();
      return;
    }

    if((k === 'Enter' || k === 'r' || k === 'R') && (state === 'over' || state === 'won' || state === 'idle')){
      e.preventDefault();
      start();
    }
  });

  // swipe
  var tx = 0, ty = 0, touching = false;
  canvas.addEventListener('touchstart', function(e){
    var t0 = e.changedTouches[0];
    tx = t0.clientX; ty = t0.clientY; touching = true;
    if(state === 'idle') start();
  }, {passive:true});

  canvas.addEventListener('touchmove', function(e){ e.preventDefault(); }, {passive:false});

  canvas.addEventListener('touchend', function(e){
    if(!touching) return;
    touching = false;
    var t1 = e.changedTouches[0];
    var dx = t1.clientX - tx, dy = t1.clientY - ty;
    if(Math.abs(dx) < 18 && Math.abs(dy) < 18) return;
    if(Math.abs(dx) > Math.abs(dy)) turn({x: dx > 0 ? 1 : -1, y:0});
    else turn({x:0, y: dy > 0 ? 1 : -1});
  }, {passive:true});

  document.addEventListener('visibilitychange', function(){
    if(document.hidden) pause();
  });

  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', onResize);

  // ---------- go ----------
  best = loadBest();
  bestEl.textContent = String(best);
  applyGrid();
  reset();
  resize();
  requestAnimationFrame(frame);

})();
</script>

</body>
</html>
