<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#2b1d5c">
<title>Stack Tower</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Lilita+One&display=swap" rel="stylesheet">
<style>
  :root{ --font:'Fredoka', ui-rounded, 'Segoe UI', system-ui, sans-serif; --display:'Lilita One', 'Fredoka', system-ui, sans-serif; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; overflow:hidden; overscroll-behavior:none; background:#2b1d5c; color:#fff; font-family:var(--font); -webkit-user-select:none; user-select:none; }
  #c{ position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:pointer; }
  .hud{ position:fixed; top:0; left:0; right:0; z-index:5; display:flex; align-items:center; gap:8px; padding:10px; padding-top:max(10px, env(safe-area-inset-top)); pointer-events:none; }
  .hud > *{ pointer-events:auto; }
  .back{ padding:8px 12px; border-radius:12px; background:rgba(0,0,0,0.25); color:#fff; font-weight:600; font-size:15px; text-decoration:none; white-space:nowrap; }
  .spacer{ flex:1; }
  .round{ width:40px; height:40px; border:none; border-radius:50%; background:rgba(0,0,0,0.25); color:#fff; font-size:17px; cursor:pointer; flex:none; }
  #score{ position:fixed; top:64px; left:0; right:0; z-index:4; text-align:center; font:400 64px/1 var(--display); text-shadow:0 4px 0 rgba(0,0,0,0.18); pointer-events:none; }
  #combo{ position:fixed; top:134px; left:0; right:0; z-index:4; text-align:center; font:700 20px var(--font); color:#fff6b0; opacity:0; transition:opacity .2s; pointer-events:none; }
  .overlay{ position:fixed; inset:0; z-index:10; display:flex; align-items:center; justify-content:center; padding:16px; background:rgba(20,10,50,0.35); }
  .overlay[hidden]{ display:none; }
  .card{ width:min(100%, 350px); padding:24px 20px; border-radius:26px; text-align:center; background:#fff; color:#2b1d5c; box-shadow:0 20px 50px rgba(0,0,0,0.35); animation:pop .35s cubic-bezier(.2,.9,.3,1.3); }
  @keyframes pop{ from{ transform:scale(0.85); opacity:0; } }
  .card h1{ margin:0 0 8px; font:400 40px var(--display); color:#6a3df0; }
  .card p{ margin:0 0 14px; font-size:16px; line-height:1.4; opacity:0.85; }
  .card .big{ font:400 60px/1 var(--display); color:#ff5d8f; margin:0 0 8px; }
  .card .best{ color:#d18a00; font-weight:700; opacity:1; }
  .btn{ font:400 22px var(--display); border:none; border-radius:18px; padding:13px 32px; color:#fff; cursor:pointer; background:linear-gradient(180deg, #8f6bff, #6a3df0); box-shadow:0 6px 0 #4520b8; }
  .btn:active{ transform:translateY(4px); box-shadow:0 2px 0 #4520b8; }
  .btn:focus-visible, .round:focus-visible, .back:focus-visible{ outline:3px solid #fff; outline-offset:2px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">
  <a class="back" href="../" aria-label="Back to games">&lsaquo; Games</a>
  <div class="spacer"></div>
  <button type="button" class="round" id="mute" aria-label="Sound on">🔊</button>
</div>
<div id="score">0</div>
<div id="combo">Perfect!</div>
<div class="overlay" id="ov">
  <div class="card">
    <h1 id="ov-title">Stack Tower</h1>
    <div class="big" id="ov-score" hidden>0</div>
    <p id="ov-text">Tap to drop each sliding block. Line it up perfectly to keep it big. How high can you build?</p>
    <p class="best" id="ov-best"></p>
    <button type="button" class="btn" id="ov-btn">Play</button>
  </div>
</div>
<script>
(function(){
  'use strict';
  function $(id){ return document.getElementById(id); }
  function load(k, d){ try { var v = localStorage.getItem(k); return v === null ? d : v; } catch(e){ return d; } }
  function save(k, v){ try { localStorage.setItem(k, v); } catch(e){} }

  var actx = null, muted = load('stack.muted', '0') === '1';
  function tone(f0, f1, dur, type, vol, delay){
    if(muted) return;
    try {
      if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if(actx.state === 'suspended') actx.resume();
      var t0 = actx.currentTime + (delay || 0), o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(actx.destination); o.start(t0); o.stop(t0 + dur + 0.05);
    } catch(e){}
  }
  var muteBtn = $('mute');
  function renderMute(){ muteBtn.textContent = muted ? '🔈' : '🔊'; muteBtn.setAttribute('aria-label', muted ? 'Sound off' : 'Sound on'); }
  muteBtn.addEventListener('click', function(){ muted = !muted; save('stack.muted', muted ? '1' : '0'); renderMute(); muteBtn.blur(); });
  renderMute();

  var cv = $('c'), cx = cv.getContext('2d'), W = 0, H = 0, DPR = 1, S = 12, baseY = 0;
  var BASE = 10, LH = 1.2, TOL = 0.35;
  var blocks = [], cur = null, debris = [], rings = [], sparks = [];
  var state = 'menu', score = 0, best = +load('stack.best', '0') || 0, combo = 0, hue = 200;
  var camY = 0, camT = 0, zoom = 1, zoomT = 1, overT = 0, comboT = 0;
  var ov = $('ov'), scoreEl = $('score'), comboEl = $('combo');

  function layout(){
    W = window.innerWidth; H = window.innerHeight; DPR = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.max(1, Math.round(W * DPR)); cv.height = Math.max(1, Math.round(H * DPR));
    S = Math.max(4, Math.min(W * 0.55, H * 0.42, 330) / 17.3);
    baseY = H * 0.64;
  }
  window.addEventListener('resize', layout);
  layout();

  function top(){ return blocks[blocks.length - 1]; }
  function P(x, y, z){ var s = S * zoom; return [W / 2 + (x - z) * 0.866 * s, baseY + ((x + z) * 0.5 - (y - camY) * LH) * s]; }
  function poly(pts, fill){
    cx.beginPath(); cx.moveTo(pts[0][0], pts[0][1]);
    for(var i = 1; i < pts.length; i++) cx.lineTo(pts[i][0], pts[i][1]);
    cx.closePath(); cx.fillStyle = fill; cx.fill();
  }
  function box(b, y0, y1, alpha){
    var x0 = b.x - b.w / 2, x1 = b.x + b.w / 2, z0 = b.z - b.d / 2, z1 = b.z + b.d / 2;
    cx.globalAlpha = alpha == null ? 1 : alpha;
    poly([P(x1, y1, z0), P(x1, y1, z1), P(x1, y0, z1), P(x1, y0, z0)], 'hsl(' + b.h + ',55%,47%)');
    poly([P(x0, y1, z1), P(x1, y1, z1), P(x1, y0, z1), P(x0, y0, z1)], 'hsl(' + b.h + ',50%,36%)');
    poly([P(x0, y1, z0), P(x1, y1, z0), P(x1, y1, z1), P(x0, y1, z1)], 'hsl(' + b.h + ',72%,64%)');
    cx.globalAlpha = 1;
  }

  function reset(){
    hue = Math.floor(Math.random() * 360);
    blocks = [{ x: 0, z: 0, w: BASE, d: BASE, y: 0, h: hue }];
    debris = []; rings = []; sparks = []; score = 0; combo = 0; cur = null;
    camY = 0; camT = 0; zoomT = 1;
    scoreEl.textContent = '0';
  }
  function spawn(){
    var t = top(), n = blocks.length, axis = n % 2 ? 'x' : 'z', range = BASE * 1.3;
    cur = { x: t.x, z: t.z, w: t.w, d: t.d, y: n, h: (hue + n * 6) % 360, axis: axis, dir: 1, speed: Math.min(20, 8 + n * 0.15) };
    var side = Math.random() < 0.5 ? -1 : 1;
    cur[axis] = t[axis] + side * range; cur.dir = -side;
  }
  function startGame(){
    reset(); state = 'play'; ov.hidden = true; spawn();
    tone(520, 780, 0.12, 'triangle', 0.06);
  }
  function flashCombo(text){ comboEl.textContent = text; comboEl.style.opacity = '1'; comboT = 0.9; }

  function drop(){
    if(state !== 'play' || !cur) return;
    var t = top(), ax = cur.axis, sz = ax === 'x' ? 'w' : 'd';
    var delta = cur[ax] - t[ax], size = cur[sz], over = size - Math.abs(delta);
    if(over <= 0.05){
      debris.push({ x: cur.x, z: cur.z, w: cur.w, d: cur.d, y: cur.y, h: cur.h, vy: 0 });
      cur = null; gameOver(); return;
    }
    if(Math.abs(delta) < TOL){
      cur[ax] = t[ax]; combo++;
      if(combo >= 3 && cur[sz] < BASE) cur[sz] = Math.min(BASE, cur[sz] + 0.5);
      rings.push({ x: cur.x, z: cur.z, w: cur.w, d: cur.d, y: cur.y + 1, t: 0 });
      for(var i = 0; i < 10; i++){
        var p = P(cur.x, cur.y + 1, cur.z);
        sparks.push({ x: p[0], y: p[1], vx: (Math.random() - 0.5) * 260, vy: -Math.random() * 220 - 40, life: 0.7 });
      }
      var f = 440 * Math.pow(2, Math.min(combo, 14) / 12);
      tone(f, f * 1.5, 0.18, 'triangle', 0.07);
      flashCombo(combo > 1 ? 'Perfect! x' + combo : 'Perfect!');
    } else {
      combo = 0;
      var newC = t[ax] + delta / 2, cut = Math.abs(delta);
      var d = { x: cur.x, z: cur.z, w: cur.w, d: cur.d, y: cur.y, h: cur.h, vy: 0 };
      d[ax] = delta > 0 ? newC + over / 2 + cut / 2 : newC - over / 2 - cut / 2;
      d[sz] = cut;
      debris.push(d);
      cur[ax] = newC; cur[sz] = over;
      tone(300, 220, 0.1, 'square', 0.05);
    }
    blocks.push({ x: cur.x, z: cur.z, w: cur.w, d: cur.d, y: cur.y, h: cur.h });
    score++; scoreEl.textContent = String(score);
    spawn();
  }

  function gameOver(){
    state = 'over'; overT = 0;
    tone(220, 60, 0.6, 'sawtooth', 0.09);
    if(score > best){ best = score; save('stack.best', String(best)); }
  }
  function showOver(){
    $('ov-title').textContent = score >= 50 ? 'Sky high!' : score >= 20 ? 'Nice tower!' : 'Timber!';
    $('ov-score').hidden = false; $('ov-score').textContent = String(score);
    $('ov-text').textContent = score === best && score > 0 ? 'A new best tower!' : 'Blocks stacked';
    $('ov-best').textContent = 'Best: ' + best;
    $('ov-btn').textContent = 'Play again';
    ov.hidden = false;
  }

  function step(dt){
    if(state === 'play' && cur){
      var t = top(), ax = cur.axis, range = BASE * 1.3;
      cur[ax] += cur.dir * cur.speed * dt;
      if(cur[ax] > t[ax] + range){ cur[ax] = t[ax] + range; cur.dir = -1; }
      else if(cur[ax] < t[ax] - range){ cur[ax] = t[ax] - range; cur.dir = 1; }
    }
    var n = blocks.length;
    if(state === 'over'){
      overT += dt;
      zoomT = Math.min(1, (H * 0.5) / ((n + 16) * LH * S));
      camT = n / 2 - (baseY - H * 0.5) / (LH * S * zoomT);
      if(overT > 1 && ov.hidden) showOver();
    } else {
      zoomT = 1; camT = Math.max(0, n - (H * 0.22) / (LH * S));
    }
    var k = Math.min(1, dt * 4);
    zoom += (zoomT - zoom) * k; camY += (camT - camY) * k;
    for(var i = debris.length - 1; i >= 0; i--){
      var d = debris[i]; d.vy -= 30 * dt; d.y += d.vy * dt;
      if(d.y < camY - 60) debris.splice(i, 1);
    }
    for(i = rings.length - 1; i >= 0; i--){ rings[i].t += dt; if(rings[i].t > 0.5) rings.splice(i, 1); }
    for(i = sparks.length - 1; i >= 0; i--){
      var s = sparks[i]; s.life -= dt; s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 500 * dt;
      if(s.life <= 0) sparks.splice(i, 1);
    }
    if(comboT > 0){ comboT -= dt; if(comboT <= 0) comboEl.style.opacity = '0'; }
  }

  function render(){
    if(!W || !H) return;
    cx.setTransform(DPR, 0, 0, DPR, 0, 0);
    var hh = (hue + blocks.length * 6) % 360;
    var g = cx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, 'hsl(' + ((hh + 30) % 360) + ',55%,32%)');
    g.addColorStop(1, 'hsl(' + ((hh + 200) % 360) + ',45%,14%)');
    cx.fillStyle = g; cx.fillRect(0, 0, W, H);
    var t = top(), tz = t ? t.x + t.z : 0, i;
    for(i = 0; i < debris.length; i++) if(debris[i].x + debris[i].z < tz) box(debris[i], debris[i].y, debris[i].y + 1, 0.95);
    for(i = 0; i < blocks.length; i++){
      var b = blocks[i];
      box(b, i === 0 ? -16 : b.y, b.y + 1);
    }
    for(i = 0; i < debris.length; i++) if(debris[i].x + debris[i].z >= tz) box(debris[i], debris[i].y, debris[i].y + 1, 0.95);
    if(cur) box(cur, cur.y, cur.y + 1);
    for(i = 0; i < rings.length; i++){
      var r = rings[i], sc = 1 + r.t * 0.6, x0 = r.x - r.w / 2 * sc, x1 = r.x + r.w / 2 * sc, z0 = r.z - r.d / 2 * sc, z1 = r.z + r.d / 2 * sc;
      var a = P(x0, r.y, z0), b2 = P(x1, r.y, z0), c = P(x1, r.y, z1), d = P(x0, r.y, z1);
      cx.globalAlpha = Math.max(0, 1 - r.t / 0.5); cx.strokeStyle = '#fff'; cx.lineWidth = 3;
      cx.beginPath(); cx.moveTo(a[0], a[1]); cx.lineTo(b2[0], b2[1]); cx.lineTo(c[0], c[1]); cx.lineTo(d[0], d[1]); cx.closePath(); cx.stroke();
      cx.globalAlpha = 1;
    }
    cx.fillStyle = '#fff';
    for(i = 0; i < sparks.length; i++){ var s = sparks[i]; cx.globalAlpha = Math.max(0, s.life / 0.7); cx.fillRect(s.x - 2, s.y - 2, 4, 4); }
    cx.globalAlpha = 1;
  }

  var last = 0;
  function frame(ts){
    var dt = Math.min(0.05, Math.max(0, (ts - last) / 1000)); last = ts;
    step(dt); render();
    requestAnimationFrame(frame);
  }

  cv.addEventListener('pointerdown', function(e){ e.preventDefault(); if(state === 'play') drop(); });
  $('ov-btn').addEventListener('click', startGame);
  window.addEventListener('keydown', function(e){
    if(e.code === 'Space' || e.code === 'Enter'){
      e.preventDefault();
      if(state === 'play') drop(); else if(!ov.hidden) startGame();
    }
  });

  reset();
  $('ov-best').textContent = best ? 'Best: ' + best : '';
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
