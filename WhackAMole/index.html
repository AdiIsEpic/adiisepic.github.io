<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#7ccf5a">
<title>Whack-a-Mole</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Lilita+One&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#3b2a14; --font:'Fredoka', ui-rounded, 'Segoe UI', system-ui, sans-serif; --display:'Lilita One', 'Fredoka', system-ui, sans-serif; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; overflow:hidden; overscroll-behavior:none; background:#7ccf5a; color:#fff; font-family:var(--font); -webkit-user-select:none; user-select:none; }
  #c{ position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:pointer; }
  .hud{ position:fixed; top:0; left:0; right:0; z-index:5; display:flex; align-items:center; gap:8px; padding:10px; padding-top:max(10px, env(safe-area-inset-top)); pointer-events:none; }
  .hud > *{ pointer-events:auto; }
  .back{ padding:8px 12px; border-radius:12px; background:rgba(40,70,20,0.35); color:#fff; font-weight:600; font-size:15px; text-decoration:none; white-space:nowrap; }
  .stat{ padding:4px 12px; border-radius:14px; background:rgba(40,70,20,0.35); text-align:center; line-height:1.05; min-width:64px; }
  .stat small{ display:block; font-size:10px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; opacity:0.8; }
  .stat b{ font:400 24px var(--display); }
  .stat b.hurry{ color:#ffe14d; }
  .spacer{ flex:1; }
  .round{ width:40px; height:40px; border:none; border-radius:50%; background:rgba(40,70,20,0.35); color:#fff; font-size:17px; cursor:pointer; flex:none; }
  .overlay{ position:fixed; inset:0; z-index:10; display:flex; align-items:center; justify-content:center; padding:16px; background:rgba(30,50,10,0.35); }
  .overlay[hidden]{ display:none; }
  .card{ width:min(100%, 360px); padding:24px 20px; border-radius:26px; text-align:center; background:#fff8e8; color:var(--ink); box-shadow:0 20px 50px rgba(0,0,0,0.3); animation:pop .35s cubic-bezier(.2,.9,.3,1.3); }
  @keyframes pop{ from{ transform:scale(0.85); opacity:0; } }
  .card h1{ margin:0 0 8px; font:400 40px var(--display); color:#8a5a2b; }
  .card p{ margin:0 0 14px; font-size:16px; line-height:1.4; opacity:0.85; }
  .card .big{ font:400 54px/1 var(--display); color:#ff7a1a; margin:0 0 8px; }
  .card .best{ color:#c98f00; font-weight:700; opacity:1; }
  .btn{ font:400 22px var(--display); border:none; border-radius:18px; padding:13px 30px; color:#fff; cursor:pointer; background:linear-gradient(180deg, #ffb13b, #ff7a1a); box-shadow:0 6px 0 #c2530a; }
  .btn:active{ transform:translateY(4px); box-shadow:0 2px 0 #c2530a; }
  .btn:focus-visible, .round:focus-visible, .back:focus-visible{ outline:3px solid #fff; outline-offset:2px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">
  <a class="back" href="../" aria-label="Back to games">&lsaquo; Games</a>
  <div class="spacer"></div>
  <div class="stat"><small>Score</small><b id="score">0</b></div>
  <div class="stat"><small>Time</small><b id="time">60</b></div>
  <div class="spacer"></div>
  <button type="button" class="round" id="mute" aria-label="Sound on">🔊</button>
</div>
<div class="overlay" id="ov">
  <div class="card">
    <h1 id="ov-title">Whack-a-Mole</h1>
    <div class="big" id="ov-score" hidden>0</div>
    <p id="ov-text">Bop as many moles as you can in 60 seconds! Golden moles are worth extra. Don't bop the bombs!</p>
    <p class="best" id="ov-best"></p>
    <button type="button" class="btn" id="ov-btn">🔨 Play</button>
  </div>
</div>
<script>
(function(){
  'use strict';
  function clamp(v, a, b){ return v < a ? a : v > b ? b : v; }
  function $(id){ return document.getElementById(id); }
  function load(k, d){ try { var v = localStorage.getItem(k); return v === null ? d : v; } catch(e){ return d; } }
  function save(k, v){ try { localStorage.setItem(k, v); } catch(e){} }

  var actx = null, muted = load('mole.muted', '0') === '1';
  function tone(f0, f1, dur, type, vol, delay){
    if(muted) return;
    try {
      if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if(actx.state === 'suspended') actx.resume();
      var t0 = actx.currentTime + (delay || 0), o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(actx.destination); o.start(t0); o.stop(t0 + dur + 0.05);
    } catch(e){}
  }
  var sfx = {
    bonk: function(m){ tone(300, 120, 0.12, 'square', 0.08); tone(900 + m * 80, 1400 + m * 80, 0.08, 'triangle', 0.05, 0.03); },
    gold: function(){ [880, 1109, 1319, 1760].forEach(function(f, i){ tone(f, f, 0.12, 'triangle', 0.06, i * 0.05); }); },
    boom: function(){ tone(150, 40, 0.5, 'sawtooth', 0.12); },
    whiff: function(){ tone(500, 300, 0.06, 'sine', 0.03); },
    pop: function(){ tone(400, 700, 0.06, 'sine', 0.025); },
    end: function(){ [784, 659, 523, 784, 1047].forEach(function(f, i){ tone(f, f, 0.18, 'triangle', 0.07, i * 0.12); }); }
  };
  var muteBtn = $('mute');
  function renderMute(){ muteBtn.textContent = muted ? '🔈' : '🔊'; muteBtn.setAttribute('aria-label', muted ? 'Sound off' : 'Sound on'); }
  muteBtn.addEventListener('click', function(){ muted = !muted; save('mole.muted', muted ? '1' : '0'); renderMute(); muteBtn.blur(); });

  var cv = $('c'), cx = cv.getContext('2d'), W = 0, H = 0, DPR = 1, R = 50, holes = [];
  var ROUND = 60, state = 'menu', score = 0, timeLeft = ROUND, combo = 0, spawnT = 0, clock = 0, shake = 0, texts = [], parts = [], hammer = null;

  function layout(){
    W = window.innerWidth; H = window.innerHeight; DPR = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.max(1, Math.round(W * DPR)); cv.height = Math.max(1, Math.round(H * DPR));
    var top = 80, cols = 3, rows = 3, cellW = Math.min((W - 20) / cols, 220), cellH = Math.min((H - top - 30) / rows, 200);
    R = Math.max(22, Math.min(cellW * 0.36, cellH * 0.34));
    var gw = cellW * cols, gh = cellH * rows, x0 = (W - gw) / 2, y0 = top + (H - top - gh) / 2;
    var old = holes;
    holes = [];
    for(var r = 0; r < rows; r++) for(var c = 0; c < cols; c++){
      var h = old[r * cols + c] || { kind: null, up: 0, t: 0, stay: 0, hit: false, hitT: 0 };
      h.x = x0 + (c + 0.5) * cellW; h.y = y0 + (r + 0.62) * cellH;
      holes.push(h);
    }
  }
  window.addEventListener('resize', layout);

  function start(){
    score = 0; timeLeft = ROUND; combo = 0; spawnT = 0.6; texts = []; parts = [];
    holes.forEach(function(h){ h.kind = null; h.up = 0; h.hit = false; });
    state = 'play'; $('ov').hidden = true; hud();
  }

  function hud(){
    $('score').textContent = score;
    var t = $('time'); t.textContent = Math.ceil(timeLeft); t.className = timeLeft <= 10 ? 'hurry' : '';
  }

  // later in the round moles pop up faster and duck back sooner
  function spawn(){
    var free = holes.filter(function(h){ return !h.kind; });
    if(!free.length) return;
    var h = free[Math.floor(Math.random() * free.length)], p = 1 - timeLeft / ROUND, roll = Math.random();
    h.kind = roll < 0.08 ? 'gold' : (roll < 0.22 && p > 0.1) ? 'bomb' : 'mole';
    h.t = 0; h.up = 0; h.hit = false; h.hitT = 0;
    h.stay = (h.kind === 'gold' ? 0.75 : 1.15) - p * 0.45;
    sfx.pop();
  }

  function whack(px, py){
    if(state !== 'play') return;
    hammer = { x: px, y: py, t: 0 };
    var best = null, bd = Infinity;
    holes.forEach(function(h){
      if(!h.kind || h.hit || h.up < 0.35) return;
      var hy = h.y - R * 0.8 * h.up, d = Math.hypot(px - h.x, py - hy);
      if(d < R * 1.15 && d < bd){ bd = d; best = h; }
    });
    if(!best){ sfx.whiff(); return; }
    best.hit = true; best.hitT = 0;
    if(best.kind === 'bomb'){
      combo = 0; score = Math.max(0, score - 30); shake = 14; sfx.boom();
      addText(best.x, best.y - R, '-30', '#ff3b3b'); burst(best.x, best.y - R * 0.6, ['#ff9f43', '#ffd23f', '#555'], 18);
    } else {
      combo++;
      var mult = Math.min(1 + Math.floor(combo / 5), 5), pts = (best.kind === 'gold' ? 50 : 10) * mult;
      score += pts;
      if(best.kind === 'gold') sfx.gold(); else sfx.bonk(mult);
      addText(best.x, best.y - R * 1.2, '+' + pts + (mult > 1 ? ' x' + mult : ''), best.kind === 'gold' ? '#ffd23f' : '#ffffff');
      burst(best.x, best.y - R * 0.8, best.kind === 'gold' ? ['#ffd23f', '#fff6b0'] : ['#ffffff', '#ffe14d'], 10);
    }
    hud();
  }

  function addText(x, y, text, color){ texts.push({ x: x, y: y, text: text, color: color, t: 0 }); }
  function burst(x, y, colors, n){
    for(var i = 0; i < n; i++){ var a = Math.random() * Math.PI * 2, sp = 80 + Math.random() * 220; parts.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 100, t: 0.5 + Math.random() * 0.3, c: colors[i % colors.length], s: 3 + Math.random() * 4 }); }
  }

  function update(dt){
    clock += dt;
    if(state === 'play'){
      timeLeft -= dt;
      if(timeLeft <= 0){ timeLeft = 0; end(); }
      spawnT -= dt;
      if(spawnT <= 0){ spawn(); var p = 1 - timeLeft / ROUND; spawnT = 0.85 - p * 0.45 + Math.random() * 0.25; if(p > 0.5 && Math.random() < 0.3) spawn(); }
      hud();
    }
    holes.forEach(function(h){
      if(!h.kind) return;
      h.t += dt;
      if(h.hit){
        h.hitT += dt;
        h.up = Math.max(0, h.up - dt * (h.hitT > 0.25 ? 6 : 0));
        if(h.hitT > 0.25 && h.up <= 0) h.kind = null;
      } else if(h.t < h.stay){
        h.up = Math.min(1, h.up + dt * 7);
      } else {
        h.up -= dt * 6;
        if(h.up <= 0){ if(h.kind !== 'bomb') combo = 0; h.kind = null; h.up = 0; }
      }
    });
    if(state !== 'play') holes.forEach(function(h){ if(h.kind && !h.hit){ h.up -= dt * 6; if(h.up <= 0){ h.kind = null; h.up = 0; } } });
  }

  function end(){
    state = 'over';
    var best = +load('mole.best', '0') || 0, isBest = score > best;
    if(isBest) save('mole.best', String(score));
    sfx.end();
    $('ov-title').textContent = "Time's up!";
    $('ov-score').hidden = false; $('ov-score').textContent = score;
    $('ov-text').textContent = score >= 2500 ? 'Mole-bopping legend! 🏆' : score >= 1000 ? 'Great bopping!' : 'Nice try! Have another go.';
    $('ov-best').textContent = isBest ? '★ New best score! ★' : 'Best: ' + best;
    $('ov-btn').textContent = '↻ Play again';
    setTimeout(function(){ $('ov').hidden = false; $('ov-btn').focus(); }, 500);
  }

  // ---------- drawing ----------
  function drawCreature(h){
    var up = h.up, bx = h.x, by = h.y - R * 0.95 * up + R * 0.25, sq = h.hit ? 0.8 : 1;
    cx.save();
    cx.beginPath(); cx.rect(h.x - R * 1.3, h.y - R * 3, R * 2.6, R * 3); cx.clip();
    if(h.kind === 'bomb'){
      cx.fillStyle = '#2b2b33'; cx.beginPath(); cx.arc(bx, by, R * 0.62, 0, Math.PI * 2); cx.fill();
      cx.fillStyle = 'rgba(255,255,255,0.25)'; cx.beginPath(); cx.arc(bx - R * 0.2, by - R * 0.22, R * 0.16, 0, Math.PI * 2); cx.fill();
      cx.strokeStyle = '#8a5a2b'; cx.lineWidth = R * 0.08; cx.beginPath(); cx.moveTo(bx + R * 0.3, by - R * 0.5); cx.quadraticCurveTo(bx + R * 0.55, by - R * 0.85, bx + R * 0.35, by - R * 0.95); cx.stroke();
      cx.fillStyle = Math.floor(clock * 12) % 2 ? '#ffd23f' : '#ff7a1a'; cx.beginPath(); cx.arc(bx + R * 0.35, by - R * 0.98, R * 0.1, 0, Math.PI * 2); cx.fill();
      cx.fillStyle = '#ffffff'; cx.font = '700 ' + Math.round(R * 0.4) + 'px Fredoka, sans-serif'; cx.textAlign = 'center'; cx.textBaseline = 'middle'; cx.fillText('!', bx, by + R * 0.05);
    } else {
      var gold = h.kind === 'gold', body = gold ? '#ffcc33' : '#9c6b43', dark = gold ? '#e0a800' : '#7a4f2e', belly = gold ? '#fff3b0' : '#d9b38c';
      cx.save(); cx.translate(bx, by); cx.scale(1 / sq, sq);
      cx.fillStyle = body; cx.beginPath(); cx.ellipse(0, R * 0.15, R * 0.62, R * 0.85, 0, 0, Math.PI * 2); cx.fill();
      cx.fillStyle = belly; cx.beginPath(); cx.ellipse(0, R * 0.45, R * 0.4, R * 0.5, 0, 0, Math.PI * 2); cx.fill();
      cx.fillStyle = dark; cx.beginPath(); cx.arc(-R * 0.45, -R * 0.52, R * 0.16, 0, Math.PI * 2); cx.arc(R * 0.45, -R * 0.52, R * 0.16, 0, Math.PI * 2); cx.fill();
      if(h.hit){
        cx.strokeStyle = '#2b1a0e'; cx.lineWidth = R * 0.07;
        [-1, 1].forEach(function(s){ cx.beginPath(); cx.moveTo(s * R * 0.3 - R * 0.09, -R * 0.2); cx.lineTo(s * R * 0.3 + R * 0.09, -R * 0.02); cx.moveTo(s * R * 0.3 + R * 0.09, -R * 0.2); cx.lineTo(s * R * 0.3 - R * 0.09, -R * 0.02); cx.stroke(); });
      } else {
        cx.fillStyle = '#2b1a0e';
        cx.beginPath(); cx.arc(-R * 0.26, -R * 0.12, R * 0.09, 0, Math.PI * 2); cx.arc(R * 0.26, -R * 0.12, R * 0.09, 0, Math.PI * 2); cx.fill();
        cx.fillStyle = '#fff'; cx.beginPath(); cx.arc(-R * 0.23, -R * 0.15, R * 0.03, 0, Math.PI * 2); cx.arc(R * 0.29, -R * 0.15, R * 0.03, 0, Math.PI * 2); cx.fill();
      }
      cx.fillStyle = '#ff7aa2'; cx.beginPath(); cx.ellipse(0, R * 0.05, R * 0.12, R * 0.09, 0, 0, Math.PI * 2); cx.fill();
      cx.fillStyle = '#fff'; cx.fillRect(-R * 0.09, R * 0.14, R * 0.08, R * 0.12); cx.fillRect(R * 0.01, R * 0.14, R * 0.08, R * 0.12);
      if(gold){ cx.fillStyle = 'rgba(255,255,255,' + (0.5 + 0.5 * Math.sin(clock * 10)).toFixed(2) + ')'; cx.beginPath(); cx.arc(R * 0.4, -R * 0.55, R * 0.07, 0, Math.PI * 2); cx.fill(); }
      cx.restore();
      if(h.hit){
        for(var k = 0; k < 3; k++){ var a = clock * 6 + k * 2.1; cx.fillStyle = '#ffe14d'; cx.font = Math.round(R * 0.32) + 'px sans-serif'; cx.textAlign = 'center'; cx.fillText('★', bx + Math.cos(a) * R * 0.6, by - R * 0.9 + Math.sin(a) * R * 0.15); }
      }
    }
    cx.restore();
  }

  function render(dt){
    cx.setTransform(DPR, 0, 0, DPR, 0, 0);
    var g = cx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#9be66f'); g.addColorStop(1, '#5fb84a');
    cx.fillStyle = g; cx.fillRect(0, 0, W, H);
    if(shake){ cx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake); shake = shake > 0.4 ? shake * 0.88 : 0; }
    // little tufts of grass
    cx.strokeStyle = 'rgba(40,110,30,0.35)'; cx.lineWidth = 2; cx.beginPath();
    for(var i = 0; i < 40; i++){ var tx = (i * 97.3) % W, ty = 90 + ((i * 53.7) % Math.max(1, H - 100)); cx.moveTo(tx, ty); cx.lineTo(tx - 3, ty - 8); cx.moveTo(tx + 4, ty); cx.lineTo(tx + 5, ty - 9); }
    cx.stroke();
    holes.forEach(function(h){
      cx.fillStyle = 'rgba(60,35,15,0.35)'; cx.beginPath(); cx.ellipse(h.x, h.y + R * 0.12, R * 1.08, R * 0.42, 0, 0, Math.PI * 2); cx.fill();
      cx.fillStyle = '#3b2412'; cx.beginPath(); cx.ellipse(h.x, h.y, R, R * 0.36, 0, 0, Math.PI * 2); cx.fill();
      if(h.kind) drawCreature(h);
      // the front lip of the hole covers the bottom of whoever's in it
      cx.fillStyle = '#8a5a2b'; cx.beginPath(); cx.ellipse(h.x, h.y + R * 0.02, R * 1.05, R * 0.36, 0, 0, Math.PI); cx.lineTo(h.x - R * 1.05, h.y); cx.fill();
      cx.fillStyle = '#6e4520'; cx.beginPath(); cx.ellipse(h.x, h.y + R * 0.1, R * 0.95, R * 0.28, 0, 0.15, Math.PI - 0.15); cx.fill();
    });
    texts.forEach(function(t){
      t.t += dt;
      cx.globalAlpha = clamp(1.5 - t.t * 1.6, 0, 1);
      cx.font = '400 ' + Math.round(R * 0.5) + "px 'Lilita One', Fredoka, sans-serif"; cx.textAlign = 'center'; cx.textBaseline = 'middle';
      cx.lineWidth = 5; cx.strokeStyle = 'rgba(60,35,15,0.6)'; cx.strokeText(t.text, t.x, t.y - t.t * 50);
      cx.fillStyle = t.color; cx.fillText(t.text, t.x, t.y - t.t * 50);
    });
    cx.globalAlpha = 1;
    texts = texts.filter(function(t){ return t.t < 0.9; });
    parts.forEach(function(p){ p.t -= dt; p.vy += 600 * dt; p.x += p.vx * dt; p.y += p.vy * dt; cx.globalAlpha = clamp(p.t / 0.3, 0, 1); cx.fillStyle = p.c; cx.fillRect(p.x - p.s / 2, p.y - p.s / 2, p.s, p.s); });
    cx.globalAlpha = 1; parts = parts.filter(function(p){ return p.t > 0; });
    if(combo >= 5 && state === 'play'){
      cx.font = '400 ' + Math.round(Math.max(20, R * 0.45)) + "px 'Lilita One', Fredoka, sans-serif"; cx.textAlign = 'center';
      cx.fillStyle = '#fff6b0'; cx.fillText('Combo ' + combo + '! x' + Math.min(1 + Math.floor(combo / 5), 5), W / 2, 96);
    }
    // the hammer swings down where you tapped
    if(hammer){
      hammer.t += dt;
      var sw = Math.min(1, hammer.t / 0.08), ang = -0.9 + sw * 1.2;
      cx.save(); cx.translate(hammer.x + R * 0.5, hammer.y + R * 0.1); cx.rotate(ang);
      cx.fillStyle = '#b07a44'; cx.fillRect(-R * 0.06, -R * 0.9, R * 0.12, R * 0.9);
      cx.fillStyle = '#ff5d5d'; cx.fillRect(-R * 0.35, -R * 1.15, R * 0.7, R * 0.34);
      cx.fillStyle = '#d93a3a'; cx.fillRect(-R * 0.35, -R * 0.86, R * 0.7, R * 0.07);
      cx.restore();
      if(hammer.t > 0.25) hammer = null;
    }
  }

  cv.addEventListener('pointerdown', function(e){ whack(e.clientX, e.clientY); e.preventDefault(); });
  $('ov-btn').addEventListener('click', function(){ start(); });

  var last = 0;
  function frame(now){ requestAnimationFrame(frame); var dt = last ? Math.min(0.05, (now - last) / 1000) : 0.016; last = now; if(W > 0 && H > 0){ update(dt); render(dt); } }
  renderMute(); layout();
  var best0 = +load('mole.best', '0') || 0; $('ov-best').textContent = best0 ? 'Best: ' + best0 : '';
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
