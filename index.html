<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Drag & Toss Sandbox (Fixed)</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1c1c1e; /* Sleek blackish-grey */
            user-select: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <canvas id="physicsCanvas"></canvas>

    <script>
        const canvas = document.getElementById('physicsCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Physics Forces
        let gravityY = 0.6; 
        let mouseX = 0;
        let mouseY = 0;
        let mouseVx = 0;
        let mouseVy = 0;
        let lastMouseX = 0;
        let lastMouseY = 0;
        let draggedBall = null;

        const colors = ['#FF3B30', '#FF9500', '#FFCC00', '#4CD964', '#5AC8FA', '#5856D6', '#FF2D55'];

        class Ball {
            constructor() {
                this.radius = Math.random() * 12 + 20; // 20px to 32px size range
                this.x = Math.random() * (canvas.width - this.radius * 2) + this.radius;
                this.y = Math.random() * (canvas.height * 0.4) + this.radius; 
                this.vx = (Math.random() - 0.5) * 5;
                this.vy = (Math.random() - 0.5) * 5;
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.bounce = 0.75; 
                this.friction = 0.99; 
                this.isDragged = false;
            }

            update() {
                if (this.isDragged) {
                    // Lock position straight to the cursor coordinate
                    this.x = mouseX;
                    this.y = mouseY;
                    
                    // Match physics movement vectors to cursor velocity
                    this.vx = mouseVx;
                    this.vy = mouseVy;
                    return;
                }

                // Normal Environment Physics
                this.vy += gravityY;
                this.vx *= this.friction;
                this.vy *= this.friction;

                this.x += this.vx;
                this.y += this.vy;

                // Wall Edge Collisions (Left & Right)
                if (this.x - this.radius < 0) {
                    this.x = this.radius;
                    this.vx = -this.vx * this.bounce;
                } else if (this.x + this.radius > canvas.width) {
                    this.x = canvas.width - this.radius;
                    this.vx = -this.vx * this.bounce;
                }

                // Ceiling & Floor Collisions (Top & Bottom)
                if (this.y - this.radius < 0) {
                    this.y = this.radius;
                    this.vy = -this.vy * this.bounce;
                } else if (this.y + this.radius > canvas.height) {
                    this.y = canvas.height - this.radius;
                    this.vy = -this.vy * this.bounce;
                    this.vx *= 0.95; // Ground drag friction
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                
                if (this.isDragged) {
                    ctx.shadowBlur = 25;
                    ctx.shadowColor = 'rgba(255, 255, 255, 0.6)';
                } else {
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = 'rgba(0, 0, 0, 0.4)';
                    ctx.shadowOffsetY = 4;
                }
                
                ctx.fill();
                ctx.closePath();
                ctx.shadowBlur = 0;
                ctx.shadowOffsetY = 0;
            }
        }

        // Generate Balls
        const balls = [];
        const ballCount = 35;
        for (let i = 0; i < ballCount; i++) {
            balls.push(new Ball());
        }

        // Mouse Down Hook: Pick up a ball
        window.addEventListener('mousedown', (e) => {
            for (let i = balls.length - 1; i >= 0; i--) {
                let ball = balls[i];
                let dx = e.clientX - ball.x;
                let dy = e.clientY - ball.y;
                let distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < ball.radius) {
                    draggedBall = ball;
                    ball.isDragged = true;
                    // Bring the selected ball to the top rendering layer
                    balls.push(balls.splice(i, 1)[0]);
                    break;
                }
            }
        });

        // Mouse Move Hook: Track velocity parameters safely
        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;

            // Simple, reliable velocity tracking calculation
            mouseVx = mouseX - lastMouseX;
            mouseVy = mouseY - lastMouseY;

            lastMouseX = mouseX;
            lastMouseY = mouseY;
            
            // UI Cursor feedback adjustments
            if (!draggedBall) {
                let hovering = false;
                for (let ball of balls) {
                    let dx = mouseX - ball.x;
                    let dy = mouseY - ball.y;
                    if (Math.sqrt(dx * dx + dy * dy) < ball.radius) {
                        hovering = true;
                        break;
                    }
                }
                document.body.style.cursor = hovering ? 'pointer' : 'default';
            } else {
                document.body.style.cursor = 'grabbing';
            }
        });

        // Mouse Up Hook: Let go and throw the ball
        window.addEventListener('mouseup', () => {
            if (draggedBall) {
                draggedBall.isDragged = false;
                draggedBall = null;
            }
            document.body.style.cursor = 'default';
        });

        // Interactive Ball-to-Ball Collisions
        function handleBallCollisions() {
            for (let i = 0; i < balls.length; i++) {
                for (let j = i + 1; j < balls.length; j++) {
                    let b1 = balls[i];
                    let b2 = balls[j];

                    let dx = b2.x - b1.x;
                    let dy = b2.y - b1.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    let minDistance = b1.radius + b2.radius;

                    if (distance < minDistance) {
                        let overlap = minDistance - distance;
                        let nx = dx / (distance || 1); 
                        let ny = dy / (distance || 1);

                        // Push overlapping objects away structurally
                        if (!b1.isDragged) {
                            b1.x -= nx * overlap * (b2.isDragged ? 1 : 0.5);
                            b1.y -= ny * overlap * (b2.isDragged ? 1 : 0.5);
                        }
                        if (!b2.isDragged) {
                            b2.x += nx * overlap * (b1.isDragged ? 1 : 0.5);
                            b2.y += ny * overlap * (b1.isDragged ? 1 : 0.5);
                        }

                        // Kinetic momentum velocity exchange
                        let kx = b1.vx - b2.vx;
                        let ky = b1.vy - b2.vy;
                        let p = 2 * (nx * kx + ny * ky) / 2;

                        if (!b1.isDragged) {
                            b1.vx -= p * nx * b1.bounce;
                            b1.vy -= p * ny * b1.bounce;
                        }
                        if (!b2.isDragged) {
                            b2.vx += p * nx * b2.bounce;
                            b2.vy += p * ny * b2.bounce;
                        }
                    }
                }
            }
        }

        // Continuous Loop Render Processing
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            handleBallCollisions();

            balls.forEach(ball => {
                ball.update();
                ball.draw();
            });

            // Naturally slow down mouse recording speeds when mouse stops 
            mouseVx *= 0.85;
            mouseVy *= 0.85;

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
