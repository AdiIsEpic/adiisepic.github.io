<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#12151f">
<title>adiisepic — Game Launcher</title>
<style>
  :root{
    --bg-deep:#12151f;
    --text-main:#eef0f5;
    --text-dim:#8b90a0;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html,body{
    margin:0;
    height:100%;
    background:
      radial-gradient(circle at 15% 0%, #1c2233 0%, transparent 50%),
      var(--bg-deep);
    color:var(--text-main);
    font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    overflow-x:hidden;
    -webkit-text-size-adjust:100%;
  }

  main{
    position:relative;
    display:flex;
    align-items:flex-start;
    justify-content:flex-start;
    padding:max(20px, env(safe-area-inset-top)) 20px 40px max(20px, env(safe-area-inset-left));
    min-height:100vh;
    min-height:100dvh;
  }

  .launcher-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, 100px);
    gap:22px;
  }

  /* the app icon */
  .app-tile{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    text-decoration:none;
    color:var(--text-main);
    width:100px;
    padding:0;
    touch-action:manipulation;
    user-select:none;
    -webkit-user-select:none;
  }

  .app-tile:active .game-icon{
    transform:translateY(1px) scale(0.96);
  }

  .app-tile:focus-visible .game-icon{
    outline:2px solid #7ea6ff;
    outline-offset:3px;
  }

  /* normal rounded-square game icon, flat/mobile-app style */
  .game-icon{
    width:76px;
    height:76px;
    border-radius:20px;
    background:linear-gradient(160deg, #4a5bd6 0%, #2a3494 100%);
    box-shadow:
      0 2px 5px rgba(0,0,0,0.35),
      0 1px 0 rgba(255,255,255,0.12) inset;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    transition:box-shadow 0.2s ease, transform 0.15s ease;
  }

  /* subtle top sheen, like typical app-icon renders */
  .game-icon::before{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(180deg, rgba(255,255,255,0.16) 0%, rgba(255,255,255,0) 40%);
    pointer-events:none;
  }

  .app-tile:hover .game-icon{
    transform:translateY(-2px);
    box-shadow:
      0 6px 14px rgba(0,0,0,0.4),
      0 1px 0 rgba(255,255,255,0.14) inset;
  }

  /* simple flat illustration: planet + ring + moon, standing in for "physics sandbox" */
  .planet{
    width:34px;
    height:34px;
    border-radius:50%;
    background:radial-gradient(circle at 32% 30%, #ffd27a 0%, #ffb545 55%, #e8912a 100%);
    position:relative;
    z-index:1;
  }
  .ring{
    position:absolute;
    width:58px;
    height:18px;
    border:3px solid rgba(255,255,255,0.85);
    border-radius:50%;
    transform:rotate(-18deg);
    z-index:2;
  }
  .moon{
    position:absolute;
    width:8px;
    height:8px;
    border-radius:50%;
    background:#ffffff;
    top:14px;
    right:14px;
    z-index:2;
  }

  .app-label{
    font-size:12px;
    font-weight:500;
    text-align:center;
    line-height:1.3;
  }

  footer{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    text-align:center;
    padding:16px 20px calc(16px + env(safe-area-inset-bottom));
    color:var(--text-dim);
    font-size:11px;
  }

  footer a{
    color:var(--text-dim);
    text-decoration:underline;
  }
</style>
</head>
<body>

<main>
  <div class="launcher-grid">

    <a class="app-tile" href="https://adiisepic.github.io/gravitysandbox/" aria-label="Launch Gravity Sandbox">
      <div class="game-icon">
        <span class="ring"></span>
        <span class="planet"></span>
        <span class="moon"></span>
      </div>
      <div class="app-label">Gravity Sandbox</div>
    </a>

  </div>
</main>

<footer>
  Built by <a href="https://adiisepic.github.io/">adiisepic</a>
</footer>

</body>
</html>
